<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha conta — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>
  <main class="conteudo">
    <div class="container" style="max-width:760px;">
      <h1 class="pagina-titulo">Minha conta</h1>
      <div class="tabs" role="tablist">
        <button class="tab ativo" data-aba="dados">Meus dados</button>
        <button class="tab" data-aba="senha">Alterar senha</button>
      </div>
      <div id="conteudo-dados"><div class="carregando"><div class="spinner"></div></div></div>
      <div id="conteudo-senha" class="oculto">
        <div class="cartao">
          <form id="form-senha">
            <div class="campo"><label>Nova senha</label><input type="password" id="nova-senha" minlength="6" required /><span class="campo__dica">Mínimo 6 caracteres.</span></div>
            <div class="campo"><label>Confirme a nova senha</label><input type="password" id="confirma-senha" minlength="6" required /></div>
            <button type="submit" class="btn btn--principal" id="btn-salvar-senha">Alterar senha</button>
          </form>
        </div>
      </div>

      <div class="mt-8 flex gap-3" style="flex-wrap:wrap;">
        <a href="./pedidos.html" class="btn btn--contorno">Meus pedidos</a>
        <a href="./propostas.html" class="btn btn--contorno">Minhas propostas</a>
        <a href="./favoritos.html" class="btn btn--contorno">Meus favoritos</a>
        <a href="./chat.html" class="btn btn--contorno">Minhas conversas</a>
        <a href="./notificacoes.html" class="btn btn--contorno">Notificações</a>
        <button type="button" class="btn btn--erro" id="btn-sair">Sair da conta</button>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
    import { supabase } from './assets/js/supabase.js';

    await iniciarConfiguracoes();
    await renderHeader('conta');
    await renderFooter();

    const el = document.getElementById('conteudo-dados');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    function toast(t, m = '', tipo = 'info') {
      let a = document.querySelector('.toast-area');
      if (!a) { a = document.createElement('div'); a.className = 'toast-area'; document.body.appendChild(a); }
      const x = document.createElement('div');
      x.className = `toast toast--${tipo}`;
      x.innerHTML = `<div class="toast__titulo">${esc(t)}</div>${m ? `<div class="toast__msg">${esc(m)}</div>` : ''}`;
      a.appendChild(x); setTimeout(() => x.remove(), 4000);
    }

    (async () => {
      const r = await supabase.auth.getSession();
      if (!r.data?.session) { location.href = './login.html?redirect=perfil.html'; return; }

      const { data: p } = await supabase.from('profiles').select('*').eq('id', r.data.session.user.id).maybeSingle();
      if (!p) { el.innerHTML = '<div class="alerta alerta--erro">Erro ao carregar perfil.</div>'; return; }

      el.innerHTML = `
        <div class="cartao">
          <form id="form-dados">
            <div class="campo"><label>Nome completo</label><input type="text" id="nome" value="${esc(p.nome || '')}" required /></div>
            <div class="campo"><label>E-mail (não editável)</label><input type="email" value="${esc(p.email || '')}" disabled /></div>
            <div class="campo-grupo" style="gap:12px;">
              <div class="campo" style="flex:1;"><label>Telefone</label><input type="tel" id="telefone" value="${esc(p.telefone || '')}" /></div>
              <div class="campo" style="flex:1;"><label>WhatsApp</label><input type="tel" id="whatsapp" value="${esc(p.whatsapp || '')}" /></div>
            </div>
            <div class="campo"><label>Membro desde</label><div class="texto-suave texto-sm">${new Date(p.created_at).toLocaleDateString('pt-BR')}</div></div>
            <button type="submit" class="btn btn--principal" id="btn-salvar-dados">Salvar alterações</button>
          </form>
        </div>
      `;

      document.getElementById('form-dados').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-salvar-dados');
        btn.disabled = true; btn.textContent = 'Salvando...';
        const { error } = await supabase.from('profiles').update({
          nome: document.getElementById('nome').value.trim(),
          telefone: document.getElementById('telefone').value.trim() || null,
          whatsapp: document.getElementById('whatsapp').value.trim() || null
        }).eq('id', r.data.session.user.id);
        btn.disabled = false; btn.textContent = 'Salvar alterações';
        if (error) { toast('Erro', error.message, 'erro'); return; }
        toast('Dados salvos', '', 'sucesso');
      };
    })();

    document.getElementById('form-senha').onsubmit = async (e) => {
      e.preventDefault();
      const s1 = document.getElementById('nova-senha').value;
      const s2 = document.getElementById('confirma-senha').value;
      if (s1.length < 6) { toast('Senha muito curta', 'Mínimo 6 caracteres', 'erro'); return; }
      if (s1 !== s2) { toast('As senhas não coincidem', '', 'erro'); return; }
      const btn = document.getElementById('btn-salvar-senha');
      btn.disabled = true; btn.textContent = 'Alterando...';
      const { error } = await supabase.auth.updateUser({ password: s1 });
      btn.disabled = false; btn.textContent = 'Alterar senha';
      if (error) { toast('Erro', error.message, 'erro'); return; }
      toast('Senha alterada', 'Sua nova senha já está ativa.', 'sucesso');
      document.getElementById('form-senha').reset();
    };

    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('ativo'));
        t.classList.add('ativo');
        const a = t.dataset.aba;
        document.getElementById('conteudo-dados').classList.toggle('oculto', a !== 'dados');
        document.getElementById('conteudo-senha').classList.toggle('oculto', a !== 'senha');
      };
    });

    document.getElementById('btn-sair').onclick = async () => {
      if (!confirm('Sair da conta?')) return;
      await supabase.auth.signOut();
      location.href = './index.html';
    };
  </script>
</body>
</html>
