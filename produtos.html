<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produtos — Minha Loja</title>

  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/store.css">
</head>

<body>

  <div id="cabecalho"></div>

  <main class="pagina-produtos">

    <section class="produtos-topo">
      <div>
        <h1 id="titulo-pagina">Produtos</h1>
        <p id="descricao-pagina">Encontre o produto que você procura.</p>
      </div>
    </section>

    <section class="produtos-layout">

      <aside class="produtos-filtros">

        <form id="form-filtros">

          <div class="campo">
            <label for="busca">Buscar</label>
            <input
              type="search"
              id="busca"
              name="busca"
              placeholder="Digite o nome do produto..."
            >
          </div>

          <div class="campo">
            <label for="condicao">Condição</label>

            <select id="condicao" name="condicao">
              <option value="">Todas</option>
              <option value="novo">Novo</option>
              <option value="seminovo">Seminovo</option>
              <option value="usado">Usado</option>
            </select>
          </div>

          <div class="campo">
            <label for="preco-min">Preço mínimo</label>

            <input
              type="number"
              id="preco-min"
              name="preco-min"
              min="0"
              step="0.01"
              placeholder="R$ 0,00"
            >
          </div>

          <div class="campo">
            <label for="preco-max">Preço máximo</label>

            <input
              type="number"
              id="preco-max"
              name="preco-max"
              min="0"
              step="0.01"
              placeholder="R$ 0,00"
            >
          </div>

          <button type="submit" class="botao botao--principal">
            Filtrar
          </button>

          <button
            type="button"
            id="limpar-filtros"
            class="botao botao--secundario"
          >
            Limpar filtros
          </button>

        </form>

      </aside>

      <section class="produtos-conteudo">

        <div class="produtos-barra">

          <span id="resultado-produtos">
            Carregando produtos...
          </span>

          <div class="campo campo--ordenacao">

            <label for="ordenar">Ordenar por</label>

            <select id="ordenar">
              <option value="recentes">Mais recentes</option>
              <option value="menor_preco">Menor preço</option>
              <option value="maior_preco">Maior preço</option>
              <option value="nome">Nome</option>
            </select>

          </div>

        </div>

        <div
          id="lista-produtos"
          class="produtos-grid"
        ></div>

        <div
          id="paginacao"
          class="paginacao"
        ></div>

      </section>

    </section>

  </main>

  <div id="rodape"></div>

  <script type="module">

    import { listarProdutos } from './assets/js/services/products.service.js';

    import { renderCabecalho } from './assets/js/components/store-header.js';

    /*
     * ============================================================
     * ESTADO DA PÁGINA
     * ============================================================
     */

    const estado = {
      filtros: {},
      ordenar: 'recentes'
    };

    /*
     * ============================================================
     * LEITURA DOS PARÂMETROS DA URL
     * ============================================================
     *
     * Exemplos:
     *
     * produtos.html?categoria=ID
     * produtos.html?q=iphone
     * produtos.html?categoria=ID&q=iphone
     *
     * A categoria agora é enviada para o products.service.js.
     */

    const params = new URLSearchParams(location.search);

    if (params.get('q')) {
      estado.filtros.busca = params.get('q');
    }

    if (params.get('categoria')) {
      estado.filtros.categoria = params.get('categoria');
    }

    if (params.get('ordenar')) {
      estado.ordenar = params.get('ordenar');
    }

    /*
     * ============================================================
     * ELEMENTOS
     * ============================================================
     */

    const listaProdutos =
      document.getElementById('lista-produtos');

    const resultadoProdutos =
      document.getElementById('resultado-produtos');

    const paginacao =
      document.getElementById('paginacao');

    const formFiltros =
      document.getElementById('form-filtros');

    const ordenar =
      document.getElementById('ordenar');

    const limparFiltros =
      document.getElementById('limpar-filtros');

    const busca =
      document.getElementById('busca');

    const condicao =
      document.getElementById('condicao');

    const precoMin =
      document.getElementById('preco-min');

    const precoMax =
      document.getElementById('preco-max');

    /*
     * ============================================================
     * CONFIGURAÇÃO INICIAL
     * ============================================================
     */

    if (estado.filtros.busca) {
      busca.value = estado.filtros.busca;
    }

    if (estado.ordenar) {
      ordenar.value = estado.ordenar;
    }

    /*
     * ============================================================
     * CARREGAR PRODUTOS
     * ============================================================
     */

    async function carregarProdutos(pagina = 1) {

      listaProdutos.innerHTML = `
        <div class="carregando">
          Carregando produtos...
        </div>
      `;

      try {

        const resposta = await listarProdutos({
          filtros: estado.filtros,
          ordenar: estado.ordenar,
          pagina,
          porPagina: 24
        });

        const produtos = resposta.produtos || [];

        resultadoProdutos.textContent =
          `${resposta.total || produtos.length} produto(s) encontrado(s)`;

        if (!produtos.length) {

          listaProdutos.innerHTML = `
            <div class="estado-vazio">
              <h3>Nenhum produto encontrado</h3>
              <p>
                Não encontramos produtos para os filtros selecionados.
              </p>
            </div>
          `;

          paginacao.innerHTML = '';

          return;
        }

        listaProdutos.innerHTML =
          produtos.map(renderProduto).join('');

        renderPaginacao(resposta);

      } catch (erro) {

        console.error(
          '[produtos] Erro ao carregar produtos:',
          erro
        );

        resultadoProdutos.textContent =
          'Erro ao carregar produtos';

        listaProdutos.innerHTML = `
          <div class="estado-vazio">
            <h3>Não foi possível carregar os produtos</h3>
            <p>
              Tente novamente em alguns instantes.
            </p>
          </div>
        `;

        paginacao.innerHTML = '';
      }
    }

    /*
     * ============================================================
     * RENDERIZAÇÃO DO PRODUTO
     * ============================================================
     */

    function renderProduto(produto) {

      const imagem =
        produto.imagemPrincipal ||
        produto.imagem ||
        './assets/img/placeholder.png';

      const preco =
        Number(
          produto.precoFinal ??
          produto.preco ??
          0
        );

      const nome =
        produto.nome || 'Produto';

      return `
        <article class="produto-card">

          <a
            href="./produto.html?id=${encodeURIComponent(produto.id)}"
            class="produto-card__link"
          >

            <div class="produto-card__imagem">

              <img
                src="${imagem}"
                alt="${nome}"
                loading="lazy"
                onerror="this.src='./assets/img/placeholder.png'"
              >

            </div>

            <div class="produto-card__conteudo">

              <h3 class="produto-card__nome">
                ${nome}
              </h3>

              <div class="produto-card__preco">
                ${formatarMoeda(preco)}
              </div>

            </div>

          </a>

        </article>
      `;
    }

    /*
     * ============================================================
     * PAGINAÇÃO
     * ============================================================
     */

    function renderPaginacao(resposta) {

      const totalPaginas =
        resposta.totalPaginas || 1;

      const paginaAtual =
        resposta.pagina || 1;

      if (totalPaginas <= 1) {
        paginacao.innerHTML = '';
        return;
      }

      let html = '';

      if (paginaAtual > 1) {

        html += `
          <button
            type="button"
            class="paginacao__botao"
            data-pagina="${paginaAtual - 1}"
          >
            ← Anterior
          </button>
        `;
      }

      for (
        let pagina = 1;
        pagina <= totalPaginas;
        pagina++
      ) {

        html += `
          <button
            type="button"
            class="paginacao__botao ${pagina === paginaAtual ? 'ativo' : ''}"
            data-pagina="${pagina}"
          >
            ${pagina}
          </button>
        `;
      }

      if (paginaAtual < totalPaginas) {

        html += `
          <button
            type="button"
            class="paginacao__botao"
            data-pagina="${paginaAtual + 1}"
          >
            Próxima →
          </button>
        `;
      }

      paginacao.innerHTML = html;

      paginacao
        .querySelectorAll('[data-pagina]')
        .forEach(botao => {

          botao.addEventListener('click', () => {

            const pagina =
              Number(botao.dataset.pagina);

            carregarProdutos(pagina);

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          });

        });
    }

    /*
     * ============================================================
     * FILTROS
     * ============================================================
     */

    formFiltros.addEventListener('submit', event => {

      event.preventDefault();

      estado.filtros = {};

      const termo =
        busca.value.trim();

      const valorCondicao =
        condicao.value;

      const minimo =
        precoMin.value;

      const maximo =
        precoMax.value;

      /*
       * IMPORTANTE:
       * preserva a categoria que veio da URL.
       */

      if (params.get('categoria')) {
        estado.filtros.categoria =
          params.get('categoria');
      }

      if (termo) {
        estado.filtros.busca = termo;
      }

      if (valorCondicao) {
        estado.filtros.condicao =
          valorCondicao;
      }

      if (minimo) {
        estado.filtros.precoMin =
          Number(minimo);
      }

      if (maximo) {
        estado.filtros.precoMax =
          Number(maximo);
      }

      carregarProdutos(1);
    });

    /*
     * ============================================================
     * LIMPAR FILTROS
     * ============================================================
     */

    limparFiltros.addEventListener('click', () => {

      busca.value = '';
      condicao.value = '';
      precoMin.value = '';
      precoMax.value = '';

      estado.filtros = {};

      /*
       * A categoria da URL NÃO é removida.
       * Assim, "Limpar filtros" continua dentro da categoria
       * selecionada.
       */

      if (params.get('categoria')) {
        estado.filtros.categoria =
          params.get('categoria');
      }

      carregarProdutos(1);
    });

    /*
     * ============================================================
     * ORDENAÇÃO
     * ============================================================
     */

    ordenar.addEventListener('change', () => {

      estado.ordenar =
        ordenar.value;

      carregarProdutos(1);
    });

    /*
     * ============================================================
     * MOEDA
     * ============================================================
     */

    function formatarMoeda(valor) {

      return Number(valor || 0).toLocaleString(
        'pt-BR',
        {
          style: 'currency',
          currency: 'BRL'
        }
      );
    }

    /*
     * ============================================================
     * CABEÇALHO
     * ============================================================
     */

    try {

      if (typeof renderCabecalho === 'function') {
        renderCabecalho();
      }

    } catch (erro) {

      console.warn(
        '[produtos] Cabeçalho:',
        erro
      );

    }

    /*
     * ============================================================
     * TÍTULO DA CATEGORIA
     * ============================================================
     */

    if (params.get('categoria')) {

      const categoriaId =
        params.get('categoria');

      console.log(
        '[produtos] Categoria selecionada:',
        categoriaId
      );
    }

    /*
     * ============================================================
     * INICIALIZAÇÃO
     * ============================================================
     */

    carregarProdutos(1);

  </script>

</body>
</html>
