<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minhas propostas — Minha Loja</title>
<link rel="stylesheet" href="./assets/css/tokens.css" />
<link rel="stylesheet" href="./assets/css/base.css" />
<link rel="stylesheet" href="./assets/css/layout.css" />
<link rel="stylesheet" href="./assets/css/components.css" />
<link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
<div id="header"></div>
<main class="conteudo">
<div class="container">
<div class="migalhas"><a href="./index.html">Início</a><span>Minhas propostas</span></div>
<h1 class="pagina-titulo">Minhas propostas</h1>
<div id="conteudo"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
</div>
</main>
<div id="footer"></div>

<script type="module">
import { renderHeader } from './assets/js/components/header.js';
import { renderFooter } from './assets/js/components/footer.js';
import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
import { supabase } from './assets/js/supabase.js';
import { listarMinhasPropostas, rotuloStatusProposta } from './assets/js/services/proposals.service.js';

await iniciarConfiguracoes();
await renderHeader('conta');
await renderFooter();

const el = document.getElementById('conteudo');
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

(async () => {
const r = await supabase.auth.getSession();
if (!r.data?.session) {
el.innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Faça login</div><a href="./login.html?redirect=propostas.html" class="btn btn--principal">Fazer login</a></div>';
return;
}

try {
const props = await listarMinhasPropostas();
if (!props.length) {
el.innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Nenhuma proposta ainda</div><p class="estado-vazio__descricao">Quando você enviar uma proposta em algum produto, ela aparece aqui.</p><a href="./produtos.html" class="btn btn--principal">Ver produtos</a></div>';
return;
}

el.innerHTML = props.map(p => {
const { texto, tipo } = rotuloStatusProposta(p.status);
const img = (p.products?.product_images || []).slice().sort((a,b) => (b.principal?1:0)-(a.principal?1:0))[0]?.url;

return '<div class="proposta-card">' +
(img
? '<img src="' + img + '" class="proposta-card__img" alt="" />'
: '<div class="proposta-card__img" style="display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.3;">📦</div>') +
'<div class="proposta-card__info">' +
'<div class="proposta-card__numero">' + esc(p.numero) + '</div>' +
'<a href="./produto.html?id=' + p.product_id + '" class="proposta-card__produto">' + esc(p.products?.nome || '-') + '</a>' +
'<div class="proposta-card__valores">' +
'Você ofertou <strong>R$ ' + Number(p.valor_proposta).toFixed(2) + '</strong>' +
(p.valor_contra ? ' · Contraproposta: <strong style="color:var(--cor-principal);">R$ ' + Number(p.valor_contra).toFixed(2) + '</strong>' : '') +
'</div>' +
'</div>' +
'<div class="proposta-card__lado">' +
'<span class="badge badge--' + tipo + '">' + texto + '</span>' +
'<div class="proposta-card__data">' + new Date(p.created_at).toLocaleDateString('pt-BR') + '</div>' +
'<a href="./proposta.html?id=' + p.id + '" class="btn btn--contorno btn--sm">Ver</a>' +
'</div>' +
'</div>';
}).join('');
} catch (e) {
el.innerHTML = '<div class="alerta alerta--erro">' + esc(e.message) + '</div>';
}
})();
</script>
</body>
</html>
