<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversa — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
  <style>
    .chat-wrap { background: #fff; border: 1px solid var(--cor-borda); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 220px); }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--cor-borda); }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg--me { background: var(--cor-principal); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg--other { background: #fff; color: var(--cor-texto); align-self: flex-start; border: 1px solid var(--cor-borda); border-bottom-left-radius: 4px; }
    .msg__hora { font-size: 10px; opacity: .7; margin-top: 4px; display: block; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .chat-input { padding: 12px 16px; border-top: 1px solid var(--cor-borda); display: flex; gap: 8px; align-items: center; background: #fff; }
    .chat-input input[type=text] { flex: 1; }
    .chat-input input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="conteudo">
    <div class="container" style="max-width:800px;">
      <div id="conteudo"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
    import { supabase } from './assets/js/supabase.js';
    import { buscarChat, listarMensagens, enviarMensagem, marcarComoLidas, uploadImagemChat } from './assets/js/services/chat.service.js';

    await iniciarConfiguracoes();
    await renderHeader('chat');
    await renderFooter();

    const el = document.getElementById('conteudo');
    const params = new URLSearchParams(location.search);
    const chatId = params.get('id');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    let user;
    let chat;

    (async () => {
      const r = await supabase.auth.getSession();
      if (!r.data?.session) { location.href = './login.html?redirect=conversa.html%3Fid=' + chatId; return; }
      user = r.data.session.user;

      if (!chatId) { el.innerHTML = '<div class="estado-vazio">Conversa não encontrada.</div>'; return; }

      try {
        chat = await buscarChat(chatId);
        if (!chat) { el.innerHTML = '<div class="estado-vazio">Conversa não encontrada.</div>'; return; }

        el.innerHTML = `
          <div class="migalhas"><a href="./chat.html">Mensagens</a><span>${esc(chat.assunto || 'Conversa')}</span></div>
          <div class="chat-wrap">
            <div class="chat-header">
              <strong>${esc(chat.assunto || 'Conversa')}</strong>
              ${chat.products ? `<div style="font-size:12px;color:var(--cor-texto-suave);">Sobre: ${esc(chat.products.nome)}</div>` : ''}
            </div>
            <div class="chat-body" id="mensagens"></div>
            <div class="chat-input">
              <input type="file" id="file-img" accept="image/*" />
              <button class="btn btn--fantasma btn--sm" id="btn-img" title="Anexar imagem">📎</button>
              <input type="text" id="input-msg" placeholder="Digite uma mensagem..." />
              <button class="btn btn--principal" id="btn-enviar">Enviar</button>
            </div>
          </div>
        `;

        await recarregar();
        await marcarComoLidas(chatId, 'cliente');

        // Realtime
        supabase.channel('chat-' + chatId)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `chat_id=eq.${chatId}` }, () => recarregar())
          .subscribe();

        document.getElementById('btn-enviar').onclick = enviar;
        document.getElementById('input-msg').onkeydown = (e) => { if (e.key === 'Enter') enviar(); };
        document.getElementById('btn-img').onclick = () => document.getElementById('file-img').click();
        document.getElementById('file-img').onchange = enviarImagem;
      } catch (e) {
        console.error(e);
        el.innerHTML = `<div class="alerta alerta--erro">${esc(e.message)}</div>`;
      }
    })();

    async function recarregar() {
      const msgs = await listarMensagens(chatId);
      const box = document.getElementById('mensagens');
      if (!box) return;
      box.innerHTML = msgs.map(m => {
        const me = m.sender_id === user.id;
        return `
          <div class="msg msg--${me ? 'me' : 'other'}">
            ${m.conteudo ? esc(m.conteudo) : ''}
            ${m.imagem_url ? `<img src="${m.imagem_url}" alt="" />` : ''}
            <span class="msg__hora">${new Date(m.created_at).toLocaleString('pt-BR')}</span>
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function enviar() {
      const inp = document.getElementById('input-msg');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      try {
        await enviarMensagem(chatId, { conteudo: txt });
        await recarregar();
      } catch (e) { alert('Erro: ' + e.message); }
    }

    async function enviarImagem(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const { url, path } = await uploadImagemChat(chatId, file);
        await enviarMensagem(chatId, { conteudo: null, imagem_url: url, storage_path: path });
        await recarregar();
      } catch (err) { alert('Erro ao enviar imagem: ' + err.message); }
      e.target.value = '';
    }
  </script>
</body>
</html>
