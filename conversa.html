<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conversa — Minha Loja</title>
<link rel="stylesheet" href="./assets/css/tokens.css" />
<link rel="stylesheet" href="./assets/css/base.css" />
<link rel="stylesheet" href="./assets/css/layout.css" />
<link rel="stylesheet" href="./assets/css/components.css" />
<link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
<div id="header"></div>
<main class="conteudo">
<div class="container" style="max-width: 800px;">
<div id="conteudo"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
</div>
</main>
<div id="footer"></div>

<script type="module">
(async () => {
try {
const { renderHeader } = await import('./assets/js/components/header.js');
const { renderFooter } = await import('./assets/js/components/footer.js');
await renderHeader('chat');
await renderFooter();
} catch (e) {}
})();

const el = document.getElementById('conteudo');
const params = new URLSearchParams(location.search);
const chatId = params.get('id');
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

let supabase, user, chat;

(async () => {
try {
const mod = await import('./assets/js/supabase.js');
supabase = mod.supabase;

const r = await supabase.auth.getUser();
if (!r.data || !r.data.user) {
location.href = './login.html?redirect=conversa.html%3Fid=' + chatId;
return;
}
user = r.data.user;

if (!chatId) {
el.innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Conversa não encontrada</div><a href="./chat.html" class="btn btn--principal">Ver minhas conversas</a></div>';
return;
}

const chatSvc = await import('./assets/js/services/chat.service.js');
chat = await chatSvc.buscarChat(chatId);

if (!chat) {
el.innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Conversa não encontrada</div><a href="./chat.html" class="btn btn--principal">Ver minhas conversas</a></div>';
return;
}

if (chat.user_id !== user.id) {
const p = await supabase.from('profiles').select('role').eq('id', user.id).maybeSingle();
const ehAdmin = p.data && p.data.role === 'admin';
if (!ehAdmin) {
el.innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Você não tem acesso a esta conversa</div><a href="./chat.html" class="btn btn--principal">Ver minhas conversas</a></div>';
return;
}
}

el.innerHTML =
'<div class="migalhas"><a href="./chat.html">Mensagens</a><span>' + esc(chat.assunto || 'Conversa') + '</span></div>' +
'<div class="chat-wrap">' +
'<div class="chat-header">' +
'<strong>' + esc(chat.assunto || 'Conversa') + '</strong>' +
(chat.products ? '<small>Sobre: ' + esc(chat.products.nome) + '</small>' : '') +
'</div>' +
'<div class="chat-body" id="mensagens"></div>' +
'<div class="chat-input">' +
'<input type="file" id="file-img" accept="image/*" />' +
'<button class="btn btn--fantasma" id="btn-img" title="Anexar imagem">📎</button>' +
'<input type="text" id="input-msg" placeholder="Digite uma mensagem..." />' +
'<button class="btn btn--principal" id="btn-enviar">Enviar</button>' +
'</div>' +
'</div>';

await recarregar();
await chatSvc.marcarComoLidas(chatId, 'cliente');

supabase.channel('chat-' + chatId)
.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: 'chat_id=eq.' + chatId }, function() { recarregar(); })
.subscribe();

document.getElementById('btn-enviar').onclick = enviar;
document.getElementById('input-msg').onkeydown = function(e) { if (e.key === 'Enter') enviar(); };
document.getElementById('btn-img').onclick = function() { document.getElementById('file-img').click(); };
document.getElementById('file-img').onchange = enviarImagem;

async function recarregar() {
const msgs = await chatSvc.listarMensagens(chatId);
const box = document.getElementById('mensagens');
if (!box) return;
if (!msgs.length) {
box.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;font-size:13px;">Nenhuma mensagem ainda. Diga olá!</div>';
return;
}
box.innerHTML = msgs.map(function(m) {
const me = m.sender_id === user.id;
return '<div class="msg msg--' + (me ? 'me' : 'other') + '">' +
(m.conteudo ? esc(m.conteudo) : '') +
(m.imagem_url ? '<img src="' + m.imagem_url + '" alt="" />' : '') +
'<span class="msg__hora">' + new Date(m.created_at).toLocaleString('pt-BR') + '</span>' +
'</div>';
}).join('');
box.scrollTop = box.scrollHeight;
}

async function enviar() {
const inp = document.getElementById('input-msg');
const txt = inp.value.trim();
if (!txt) return;
inp.value = '';
try {
await chatSvc.enviarMensagem(chatId, { conteudo: txt });
await recarregar();
} catch (e) { alert('Erro: ' + e.message); }
}

async function enviarImagem(e) {
const file = e.target.files && e.target.files[0];
if (!file) return;
try {
const up = await chatSvc.uploadImagemChat(chatId, file);
await chatSvc.enviarMensagem(chatId, { conteudo: null, imagem_url: up.url, storage_path: up.path });
await recarregar();
} catch (err) { alert('Erro ao enviar imagem: ' + err.message); }
e.target.value = '';
}

} catch (e) {
console.error(e);
el.innerHTML = '<div class="alerta alerta--erro">Erro ao carregar conversa. Tente novamente.</div>';
}
})();
</script>
</body>
</html>
