<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Auditoria — Admin</title>

  <link rel="stylesheet" href="../assets/css/admin.css" />

  <style>
    .auditoria-conteudo {
      padding: 24px;
    }

    .auditoria-intro {
      margin-bottom: 18px;
    }

    .auditoria-intro h2 {
      margin: 0 0 5px;
      font-size: 20px;
      color: #0f172a;
    }

    .auditoria-intro p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .filtros {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .campo label {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #0f172a;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,.10);
    }

    .acoes-filtro {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 15px;
      border-radius: 8px;
      border: 1px solid #0ea5e9;
      background: #0ea5e9;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover {
      filter: brightness(.95);
    }

    .btn-secundario {
      background: #fff;
      color: #0ea5e9;
    }

    .resultado-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #64748b;
      font-size: 13px;
    }

    .auditoria-lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .registro {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }

    .registro:hover {
      border-color: #cbd5e1;
      box-shadow: 0 2px 8px rgba(15,23,42,.04);
    }

    .registro-cabecalho {
      display: grid;
      grid-template-columns: 165px minmax(180px, 1.3fr) 160px 110px minmax(100px, .7fr) 38px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
    }

    .registro-data {
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .registro-usuario {
      min-width: 0;
    }

    .registro-usuario strong {
      display: block;
      font-size: 13px;
      color: #0f172a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .registro-usuario small {
      color: #94a3b8;
      font-size: 11px;
    }

    .registro-tabela {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .registro-id code {
      font-size: 11px;
      color: #64748b;
      background: #f8fafc;
      padding: 3px 5px;
      border-radius: 5px;
    }

    .seta {
      font-size: 16px;
      color: #94a3b8;
      text-align: center;
      transition: transform .15s;
    }

    .registro.aberto .seta {
      transform: rotate(180deg);
    }

    .registro-detalhes {
      display: none;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
      padding: 18px;
    }

    .registro.aberto .registro-detalhes {
      display: block;
    }

    .detalhes-titulo {
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 10px;
    }

    .alteracoes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .alteracao {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .alteracao-campo {
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 800;
      color: #334155;
    }

    .alteracao-valores {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .valor {
      padding: 12px;
      min-width: 0;
    }

    .valor + .valor {
      border-left: 1px solid #e2e8f0;
    }

    .valor small {
      display: block;
      margin-bottom: 6px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: #94a3b8;
    }

    .valor.antes {
      background: #fffafa;
    }

    .valor.depois {
      background: #fafffc;
    }

    .valor-conteudo {
      color: #334155;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .valor-vazio {
      color: #94a3b8;
      font-style: italic;
    }

    .mudanca {
      display: inline-block;
      margin: 0 5px;
      color: #94a3b8;
      font-weight: 700;
    }

    .observacao {
      margin-top: 16px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
    }

    .observacao strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #475569;
    }

    .observacao span {
      font-size: 13px;
      color: #334155;
      white-space: pre-wrap;
    }

    .metadados {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      color: #64748b;
      font-size: 11px;
    }

    .metadados strong {
      color: #475569;
    }

    .dados-completos {
      margin-top: 16px;
      border-top: 1px dashed #cbd5e1;
      padding-top: 12px;
    }

    .dados-completos summary {
      cursor: pointer;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      user-select: none;
    }

    .dados-json {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .json-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      overflow: hidden;
    }

    .json-titulo {
      padding: 9px 11px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
    }

    .json-card pre {
      margin: 0;
      padding: 11px;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      color: #475569;
    }

    .sem-dados {
      padding: 14px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      color: #64748b;
      font-size: 13px;
    }

    .vazio {
      padding: 60px 24px;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      color: #64748b;
    }

    .vazio strong {
      display: block;
      color: #0f172a;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .erro {
      padding: 18px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
    }

    .paginacao {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 1100px) {
      .registro-cabecalho {
        grid-template-columns: 140px 1fr 130px 100px 30px;
      }

      .registro-id {
        display: none;
      }
    }

    @media (max-width: 850px) {
      .registro-cabecalho {
        grid-template-columns: 1fr 1fr 30px;
      }

      .detalhes-grid,
      .dados-json {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .auditoria-conteudo {
        padding: 14px;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      .registro-cabecalho {
        grid-template-columns: 1fr 30px;
      }

      .registro-usuario,
      .registro-tabela,
      .registro-acao,
      .registro-data {
        grid-column: 1;
      }

      .seta {
        grid-column: 2;
        grid-row: 1 / span 4;
      }

      .alteracao-valores {
        grid-template-columns: 1fr;
      }

      .valor + .valor {
        border-left: 0;
        border-top: 1px solid #e2e8f0;
      }

      .resultado-info {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="admin-layout">

    <aside id="admin-menu"></aside>

    <main class="admin-main">

      <header class="admin-topbar">
        <div>
          <h1>Auditoria</h1>
        </div>

        <a href="../index.html" class="btn-loja">
          ← Ver loja
        </a>
      </header>

      <div class="auditoria-conteudo">

        <div class="auditoria-intro">
          <h2>Histórico de alterações</h2>
          <p>
            Consulte quem realizou cada ação e veja exatamente o que foi alterado.
          </p>
        </div>

        <form class="filtros" id="form-filtros">

          <div class="campo">
            <label>Usuário</label>
            <input
              type="text"
              name="usuario"
              placeholder="E-mail do usuário"
            />
          </div>

          <div class="campo">
            <label>Tabela</label>
            <select name="tabela">
              <option value="">Todas</option>
              <option value="products">Produtos</option>
              <option value="categories">Categorias</option>
              <option value="orders">Pedidos</option>
              <option value="proposals">Propostas</option>
              <option value="company_settings">Dados da empresa</option>
              <option value="visual_settings">Identidade visual</option>
              <option value="store_settings">Config. loja</option>
            </select>
          </div>

          <div class="campo">
            <label>Ação</label>
            <select name="acao">
              <option value="">Todas</option>
              <option value="criado">Criado</option>
              <option value="editado">Editado</option>
              <option value="excluido">Excluído</option>
            </select>
          </div>

          <div class="campo">
            <label>Data inicial</label>
            <input type="date" name="dataInicio" />
          </div>

          <div class="campo">
            <label>Data final</label>
            <input type="date" name="dataFim" />
          </div>

          <div class="acoes-filtro">
            <button type="submit" class="btn">
              🔍 Filtrar
            </button>

            <button type="button" class="btn btn-secundario" id="btn-limpar">
              Limpar
            </button>
          </div>

        </form>

        <div id="resultado-info" class="resultado-info"></div>

        <div id="conteudo">
          <div class="vazio">
            Carregando...
          </div>
        </div>

        <div id="paginacao" class="paginacao"></div>

      </div>

    </main>

  </div>

  <script type="module">

    import { renderAdminMenu } from '../assets/js/components/admin-menu.js';

    import {
      listarLogs,
      rotuloAcao,
      corAcao,
      rotuloTabela
    } from '../assets/js/services/audit.service.js';

    const el = document.getElementById('conteudo');
    const pag = document.getElementById('paginacao');
    const info = document.getElementById('resultado-info');

    let estado = {
      filtros: {},
      pagina: 1
    };

    /*
     * ============================================================
     * SEGURANÇA
     * ============================================================
     */

    function esc(valor) {

      if (valor == null) return '';

      return String(valor).replace(/[&<>"']/g, function(m) {

        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];

      });

    }

    /*
     * ============================================================
     * NOMES AMIGÁVEIS
     * ============================================================
     */

    const NOMES_CAMPOS = {

      id: 'ID',

      nome: 'Nome',
      name: 'Nome',

      descricao: 'Descrição',
      description: 'Descrição',

      preco: 'Preço',
      price: 'Preço',

      preco_venda: 'Preço de venda',
      preco_custo: 'Preço de custo',

      estoque: 'Estoque',
      quantidade: 'Quantidade',

      estoque_minimo: 'Estoque mínimo',

      categoria: 'Categoria',
      categoria_id: 'Categoria',

      category: 'Categoria',
      category_id: 'Categoria',

      status: 'Status',

      ativo: 'Ativo',
      ativo: 'Ativo',

      imagem: 'Imagem',
      imagem_url: 'Imagem',

      telefone: 'Telefone',
      celular: 'Celular',

      email: 'E-mail',

      endereco: 'Endereço',
      numero: 'Número',
      bairro: 'Bairro',
      cidade: 'Cidade',
      estado: 'Estado',
      cep: 'CEP',

      cpf: 'CPF',
      cnpj: 'CNPJ',

      unidade: 'Unidade',

      observacao: 'Observação',
      observacoes: 'Observações',

      forma_pagamento: 'Forma de pagamento',
      metodo_pagamento: 'Método de pagamento',

      parcelas: 'Parcelas',

      subtotal: 'Subtotal',
      total: 'Total',
      frete: 'Frete',
      desconto: 'Desconto',

      created_at: 'Data de criação',
      updated_at: 'Última atualização',

      user_id: 'Usuário',
      user_email: 'E-mail do usuário',
      user_role: 'Perfil do usuário',

      produto_id: 'Produto',
      product_id: 'Produto',

      pedido_id: 'Pedido',
      order_id: 'Pedido'
    };

    function nomeCampo(campo) {

      if (NOMES_CAMPOS[campo]) {
        return NOMES_CAMPOS[campo];
      }

      return String(campo)
        .replace(/_/g, ' ')
        .replace(/\b\w/g, function(letra) {
          return letra.toUpperCase();
        });
    }

    /*
     * ============================================================
     * FORMATAÇÃO DE VALORES
     * ============================================================
     */

    const CAMPOS_MONETARIOS = new Set([
      'preco',
      'price',
      'preco_venda',
      'preco_custo',
      'subtotal',
      'total',
      'frete',
      'desconto',
      'valor'
    ]);

    const CAMPOS_DATA = new Set([
      'created_at',
      'updated_at',
      'data',
      'data_inicio',
      'data_fim'
    ]);

    function formatarNumero(valor) {

      const numero = Number(valor);

      if (!Number.isFinite(numero)) {
        return esc(valor);
      }

      return numero.toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatarDataValor(valor) {

      if (!valor) return '—';

      const data = new Date(valor);

      if (Number.isNaN(data.getTime())) {
        return esc(valor);
      }

      return data.toLocaleString('pt-BR');
    }

    function formatarValor(valor, campo = '') {

      if (valor === undefined || valor === null || valor === '') {

        return '<span class="valor-vazio">Não informado</span>';

      }

      if (
        CAMPOS_MONETARIOS.has(campo) &&
        typeof valor !== 'object'
      ) {

        return `R$ ${formatarNumero(valor)}`;

      }

      if (
        CAMPOS_DATA.has(campo) &&
        typeof valor === 'string'
      ) {

        return formatarDataValor(valor);

      }

      if (typeof valor === 'boolean') {

        return valor ? 'Sim' : 'Não';

      }

      if (typeof valor === 'number') {

        return esc(
          valor.toLocaleString('pt-BR')
        );

      }

      if (typeof valor === 'object') {

        try {

          return `
            <pre style="
              margin:0;
              white-space:pre-wrap;
              font-family:inherit;
              font-size:12px;
            ">${esc(JSON.stringify(valor, null, 2))}</pre>
          `;

        } catch {

          return esc(String(valor));

        }

      }

      return esc(valor);
    }

    function formatarData(data) {

      if (!data) return '—';

      const d = new Date(data);

      if (Number.isNaN(d.getTime())) {
        return esc(data);
      }

      return d.toLocaleString('pt-BR', {
        dateStyle: 'short',
        timeStyle: 'medium'
      });
    }

    /*
     * ============================================================
     * COMPARAÇÃO
     * ============================================================
     */

    function normalizarObjeto(valor) {

      if (
        !valor ||
        typeof valor !== 'object' ||
        Array.isArray(valor)
      ) {

        return {};

      }

      return valor;
    }

    function valoresIguais(a, b) {

      try {

        return JSON.stringify(a) === JSON.stringify(b);

      } catch {

        return String(a) === String(b);

      }

    }

    function obterAlteracoes(antes, depois) {

      const a = normalizarObjeto(antes);
      const d = normalizarObjeto(depois);

      const chaves = new Set([
        ...Object.keys(a),
        ...Object.keys(d)
      ]);

      const alteracoes = [];

      chaves.forEach(function(campo) {

        const valorAntes = a[campo];
        const valorDepois = d[campo];

        if (!valoresIguais(valorAntes, valorDepois)) {

          alteracoes.push({
            campo,
            antes: valorAntes,
            depois: valorDepois
          });

        }

      });

      return alteracoes.sort(function(x, y) {

        return nomeCampo(x.campo)
          .localeCompare(nomeCampo(y.campo));

      });

    }

    /*
     * ============================================================
     * ALTERAÇÕES DE EDIÇÃO
     * ============================================================
     */

    function montarAlteracoes(log) {

      if (log.acao === 'editado') {

        const alteracoes =
          obterAlteracoes(
            log.dados_antes,
            log.dados_depois
          );

        if (!alteracoes.length) {

          return `
            <div class="sem-dados">
              Não foram encontradas diferenças entre os dados
              anteriores e posteriores deste registro.
            </div>
          `;

        }

        return `
          <div class="detalhes-titulo">
            Alterações realizadas
            (${alteracoes.length})
          </div>

          <div class="alteracoes">

            ${alteracoes.map(function(item) {

              return `
                <div class="alteracao">

                  <div class="alteracao-campo">
                    ${esc(nomeCampo(item.campo))}
                  </div>

                  <div class="alteracao-valores">

                    <div class="valor antes">

                      <small>Antes</small>

                      <div class="valor-conteudo">
                        ${formatarValor(
                          item.antes,
                          item.campo
                        )}
                      </div>

                    </div>

                    <div class="valor depois">

                      <small>Depois</small>

                      <div class="valor-conteudo">
                        ${formatarValor(
                          item.depois,
                          item.campo
                        )}
                      </div>

                    </div>

                  </div>

                </div>
              `;

            }).join('')}

          </div>
        `;
      }

      /*
       * ==========================================================
       * CRIAÇÃO
       * ==========================================================
       */

      if (log.acao === 'criado') {

        const dados =
          normalizarObjeto(log.dados_depois);

        const campos =
          Object.keys(dados);

        if (!campos.length) {

          return `
            <div class="sem-dados">
              Não há detalhes adicionais disponíveis para este registro.
            </div>
          `;

        }

        return `
          <div class="detalhes-titulo">
            Dados registrados
          </div>

          <div class="alteracoes">

            ${campos.map(function(campo) {

              return `
                <div class="alteracao">

                  <div class="alteracao-campo">
                    ${esc(nomeCampo(campo))}
                  </div>

                  <div class="valor depois">
                    <div class="valor-conteudo">
                      ${formatarValor(
                        dados[campo],
                        campo
                      )}
                    </div>
                  </div>

                </div>
              `;

            }).join('')}

          </div>
        `;
      }

      /*
       * ==========================================================
       * EXCLUSÃO
       * ==========================================================
       */

      if (log.acao === 'excluido') {

        const dados =
          normalizarObjeto(log.dados_antes);

        const campos =
          Object.keys(dados);

        if (!campos.length) {

          return `
            <div class="sem-dados">
              Não há detalhes adicionais disponíveis para este registro.
            </div>
          `;

        }

        return `
          <div class="detalhes-titulo">
            Dados antes da exclusão
          </div>

          <div class="alteracoes">

            ${campos.map(function(campo) {

              return `
                <div class="alteracao">

                  <div class="alteracao-campo">
                    ${esc(nomeCampo(campo))}
                  </div>

                  <div class="valor antes">
                    <div class="valor-conteudo">
                      ${formatarValor(
                        dados[campo],
                        campo
                      )}
                    </div>
                  </div>

                </div>
              `;

            }).join('')}

          </div>
        `;
      }

      return `
        <div class="sem-dados">
          Nenhum detalhe disponível para esta ação.
        </div>
      `;
    }

    /*
     * ============================================================
     * DADOS COMPLETOS
     * ============================================================
     */

    function montarDadosCompletos(log) {

      if (
        !log.dados_antes &&
        !log.dados_depois
      ) {

        return '';

      }

      return `
        <details class="dados-completos">

          <summary>
            Ver dados completos em formato técnico
          </summary>

          <div class="dados-json">

            ${
              log.dados_antes
                ? `
                  <div class="json-card">

                    <div class="json-titulo">
                      DADOS ANTES
                    </div>

                    <pre>${esc(
                      JSON.stringify(
                        log.dados_antes,
                        null,
                        2
                      )
                    )}</pre>

                  </div>
                `
                : ''
            }

            ${
              log.dados_depois
                ? `
                  <div class="json-card">

                    <div class="json-titulo">
                      DADOS DEPOIS
                    </div>

                    <pre>${esc(
                      JSON.stringify(
                        log.dados_depois,
                        null,
                        2
                      )
                    )}</pre>

                  </div>
                `
                : ''
            }

          </div>

        </details>
      `;
    }

    /*
     * ============================================================
     * DETALHES
     * ============================================================
     */

    function montarDetalhes(log) {

      return `
        <div class="registro-detalhes">

          ${montarAlteracoes(log)}

          ${
            log.observacao
              ? `
                <div class="observacao">

                  <strong>Observação</strong>

                  <span>
                    ${esc(log.observacao)}
                  </span>

                </div>
              `
              : ''
          }

          <div class="metadados">

            <span>
              <strong>ID do registro:</strong>
              ${esc(log.registro_id || '—')}
            </span>

            <span>
              <strong>Usuário:</strong>
              ${esc(log.user_email || '—')}
            </span>

            <span>
              <strong>Perfil:</strong>
              ${esc(log.user_role || '—')}
            </span>

            <span>
              <strong>IP:</strong>
              ${esc(log.ip || '—')}
            </span>

            <span>
              <strong>ID da auditoria:</strong>
              ${esc(log.id)}
            </span>

          </div>

          ${montarDadosCompletos(log)}

        </div>
      `;
    }

    /*
     * ============================================================
     * REGISTRO
     * ============================================================
     */

    function montarRegistro(log, index) {

      const cor = corAcao(log.acao);

      return `
        <article
          class="registro"
          data-index="${index}"
        >

          <div
            class="registro-cabecalho"
            role="button"
            tabindex="0"
            aria-expanded="false"
          >

            <div class="registro-data">
              ${formatarData(log.created_at)}
            </div>

            <div class="registro-usuario">

              <strong>
                ${esc(
                  log.user_email ||
                  'Usuário não identificado'
                )}
              </strong>

              <small>
                ${esc(log.user_role || '—')}
              </small>

            </div>

            <div class="registro-tabela">
              ${esc(rotuloTabela(log.tabela))}
            </div>

            <div class="registro-acao">

              <span
                class="badge"
                style="
                  background:${cor.bg};
                  color:${cor.cor};
                "
              >
                ${esc(rotuloAcao(log.acao))}
              </span>

            </div>

            <div class="registro-id">

              <code
                title="${esc(log.registro_id || '')}"
              >
                ${esc(
                  (log.registro_id || '—')
                    .substring(0, 12)
                )}
              </code>

            </div>

            <div class="seta">
              ▼
            </div>

          </div>

          ${montarDetalhes(log)}

        </article>
      `;
    }

    /*
     * ============================================================
     * ABRIR / FECHAR
     * ============================================================
     */

    function ativarRegistros() {

      document
        .querySelectorAll('.registro')
        .forEach(function(registro) {

          const cabecalho =
            registro.querySelector(
              '.registro-cabecalho'
            );

          function alternar() {

            const aberto =
              registro.classList.toggle(
                'aberto'
              );

            cabecalho.setAttribute(
              'aria-expanded',
              aberto ? 'true' : 'false'
            );

          }

          cabecalho.addEventListener(
            'click',
            alternar
          );

          cabecalho.addEventListener(
            'keydown',
            function(e) {

              if (
                e.key === 'Enter' ||
                e.key === ' '
              ) {

                e.preventDefault();
                alternar();

              }

            }
          );

        });

    }

    /*
     * ============================================================
     * ACESSO
     * ============================================================
     */

    async function verificarAcesso() {

      const { supabase } =
        await import(
          '../assets/js/supabase.js'
        );

      const sessao =
        await supabase.auth.getSession();

      if (
        !sessao.data ||
        !sessao.data.session
      ) {

        location.href =
          '../login.html';

        return false;

      }

      const usuario =
        sessao.data.session.user;

      const perfil =
        await supabase
          .from('profiles')
          .select('role')
          .eq('id', usuario.id)
          .maybeSingle();

      if (
        !perfil.data ||
        perfil.data.role !== 'admin'
      ) {

        el.innerHTML = `
          <div class="erro">
            Acesso restrito a administradores.
          </div>
        `;

        return false;
      }

      return true;
    }

    /*
     * ============================================================
     * CARREGAR
     * ============================================================
     */

    async function carregar() {

      el.innerHTML = `
        <div class="vazio">
          Carregando registros de auditoria...
        </div>
      `;

      pag.innerHTML = '';
      info.innerHTML = '';

      try {

        const resultado =
          await listarLogs({
            filtros: estado.filtros,
            pagina: estado.pagina,
            porPagina: 30
          });

        if (!resultado.logs.length) {

          el.innerHTML = `
            <div class="vazio">

              <strong>
                Nenhum registro encontrado
              </strong>

              <p>
                Nenhuma ação foi encontrada
                com os filtros selecionados.
              </p>

            </div>
          `;

          return;
        }

        info.innerHTML = `
          <span>
            ${resultado.total}
            registro(s) encontrado(s)
          </span>

          <span>
            Página ${resultado.pagina}
            de ${resultado.totalPaginas}
          </span>
        `;

        el.innerHTML = `
          <div class="auditoria-lista">

            ${resultado.logs
              .map(montarRegistro)
              .join('')}

          </div>
        `;

        ativarRegistros();

        montarPaginacao(resultado);

      } catch (erro) {

        console.error(
          '[auditoria]',
          erro
        );

        el.innerHTML = `
          <div class="erro">
            Erro ao carregar auditoria:
            ${esc(
              erro.message || erro
            )}
          </div>
        `;
      }
    }

    /*
     * ============================================================
     * PAGINAÇÃO
     * ============================================================
     */

    function montarPaginacao(resultado) {

      if (
        resultado.totalPaginas <= 1
      ) {

        return;
      }

      let html = '';

      if (resultado.pagina > 1) {

        html += `
          <button
            class="btn btn-secundario"
            data-p="${resultado.pagina - 1}"
          >
            ← Anterior
          </button>
        `;

      }

      const inicio =
        Math.max(
          1,
          resultado.pagina - 2
        );

      const fim =
        Math.min(
          resultado.totalPaginas,
          resultado.pagina + 2
        );

      for (
        let i = inicio;
        i <= fim;
        i++
      ) {

        html += `
          <button
            class="btn ${
              i === resultado.pagina
                ? ''
                : 'btn-secundario'
            }"
            data-p="${i}"
          >
            ${i}
          </button>
        `;

      }

      if (
        resultado.pagina <
        resultado.totalPaginas
      ) {

        html += `
          <button
            class="btn btn-secundario"
            data-p="${resultado.pagina + 1}"
          >
            Próxima →
          </button>
        `;

      }

      pag.innerHTML = html;

      pag
        .querySelectorAll('[data-p]')
        .forEach(function(botao) {

          botao.addEventListener(
            'click',
            function() {

              estado.pagina =
                Number(
                  botao.dataset.p
                );

              carregar();

              window.scrollTo({
                top: 0,
                behavior: 'smooth'
              });

            }
          );

        });

    }

    /*
     * ============================================================
     * FILTROS
     * ============================================================
     */

    document
      .getElementById('form-filtros')
      .addEventListener(
        'submit',
        function(e) {

          e.preventDefault();

          const f = e.target;

          estado.filtros = {};

          if (f.usuario.value.trim()) {

            estado.filtros.usuario =
              f.usuario.value.trim();

          }

          if (f.tabela.value) {

            estado.filtros.tabela =
              f.tabela.value;

          }

          if (f.acao.value) {

            estado.filtros.acao =
              f.acao.value;

          }

          if (f.dataInicio.value) {

            estado.filtros.dataInicio =
              f.dataInicio.value;

          }

          if (f.dataFim.value) {

            estado.filtros.dataFim =
              f.dataFim.value;

          }

          estado.pagina = 1;

          carregar();

        }
      );

    document
      .getElementById('btn-limpar')
      .addEventListener(
        'click',
        function() {

          document
            .getElementById('form-filtros')
            .reset();

          estado.filtros = {};
          estado.pagina = 1;

          carregar();

        }
      );

    /*
     * ============================================================
     * INICIALIZAÇÃO
     * ============================================================
     */

    (async function iniciar() {

      try {

        renderAdminMenu(
          'auditoria'
        );

        const acesso =
          await verificarAcesso();

        if (!acesso) return;

        await carregar();

      } catch (erro) {

        console.error(
          '[auditoria:init]',
          erro
        );

        el.innerHTML = `
          <div class="erro">
            Erro ao iniciar auditoria:
            ${esc(
              erro.message || erro
            )}
          </div>
        `;

      }

    })();

  </script>

</body>
</html>
