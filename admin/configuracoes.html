<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Configurações — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; }
    .topbar h1 { font-size: 18px; }
    .conteudo { padding: 24px; max-width: 800px; }
    .bloco { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .bloco h2 { font-size: 15px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .campo input, .campo textarea { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .campo__dica { font-size: 12px; color: #94a3b8; margin-top: 3px; display: block; }
    .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    .status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
    .status--ok { background: #dcfce7; color: #166534; }
    .status--err { background: #fee2e2; color: #991b1b; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin: 20px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>
      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
      </nav>
      <div class="sidebar__secao">Configurações</div>
      <nav class="sidebar__lista">
        <a href="./empresa.html" class="sidebar__item">Dados da empresa</a>
        <a href="./identidade.html" class="sidebar__item">Identidade visual</a>
        <a href="./configuracoes.html" class="sidebar__item ativo">Outras configurações</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><h1>Outras configurações</h1></header>
      <div class="conteudo" id="conteudo">
        <div class="erro">Carregando...</div>
      </div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    (async () => {
      try {
        const { supabase } = await import('../assets/js/supabase.js');
        const r = await supabase.auth.getSession();
        if (!r.data?.session) { location.href = '../login.html'; return; }
        const p = await supabase.from('profiles').select('role').eq('id', r.data.session.user.id).maybeSingle();
        if (!p.data || p.data.role !== 'admin') { el.innerHTML = '<div class="erro">Acesso restrito</div>'; return; }

        const { data } = await supabase.from('store_settings').select('*').eq('id', 1).maybeSingle();
        const s = data || {};

        el.innerHTML = `
          <form id="form">
            <div class="bloco">
              <h2>Mensagens do WhatsApp</h2>
              <div class="campo">
                <label>Mensagem ao falar sobre um produto</label>
                <textarea id="wa_produto" rows="2">${esc(s.whatsapp_msg_produto || '')}</textarea>
                <span class="campo__dica">Use [NOME DO PRODUTO] para inserir o nome e [PRECO] para o preço.</span>
              </div>
              <div class="campo">
                <label>Mensagem geral (botão do rodapé)</label>
                <textarea id="wa_geral" rows="2">${esc(s.whatsapp_msg_geral || '')}</textarea>
              </div>
            </div>

            <div class="bloco">
              <h2>Textos legais</h2>
              <div class="campo">
                <label>Política de Privacidade</label>
                <textarea id="privacidade" rows="4">${esc(s.politica_privacidade || '')}</textarea>
              </div>
              <div class="campo">
                <label>Termos de Uso</label>
                <textarea id="termos" rows="4">${esc(s.termos_uso || '')}</textarea>
              </div>
            </div>

            <button type="submit" class="btn" id="btn-salvar">Salvar configurações</button>
            <div id="status"></div>
          </form>
        `;

        document.getElementById('form').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('btn-salvar');
          btn.disabled = true; btn.textContent = 'Salvando...';

          const { error } = await supabase.from('store_settings').upsert({
            id: 1,
            whatsapp_msg_produto: document.getElementById('wa_produto').value.trim() || null,
            whatsapp_msg_geral:   document.getElementById('wa_geral').value.trim() || null,
            politica_privacidade: document.getElementById('privacidade').value.trim() || null,
            termos_uso:           document.getElementById('termos').value.trim() || null,
            updated_at: new Date().toISOString()
          });

          btn.disabled = false; btn.textContent = 'Salvar configurações';
          document.getElementById('status').innerHTML = error
            ? `<div class="status status--err">❌ ${esc(error.message)}</div>`
            : `<div class="status status--ok">✅ Configurações salvas.</div>`;
        };
      } catch (e) { el.innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
    })();
  </script>
</body>
</html>
