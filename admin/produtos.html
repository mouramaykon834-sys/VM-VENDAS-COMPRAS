<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>

  <main class="conteudo">
    <div class="container">
      <div id="conteudo-produto"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
    </div>
  </main>

  <div id="footer"></div>

  <div id="modal-proposta" class="oculto"></div>
  <div id="modal-aviso" class="oculto"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
    import { supabase } from './assets/js/supabase.js';
    import { buscarProduto, rotuloDisponibilidade, rotuloCondicao } from './assets/js/services/products.service.js';
    import { abrirWhatsapp } from './assets/js/services/whatsapp.service.js';

    const params = new URLSearchParams(location.search);
    const produtoId = params.get('id');

    await iniciarConfiguracoes();
    await renderHeader('produtos');
    await renderFooter();

    if (!produtoId) { renderizarNaoEncontrado('Nenhum produto selecionado.'); }
    else { await carregarProduto(produtoId); }

    async function carregarProduto(id) {
      const el = document.getElementById('conteudo-produto');
      try {
        const p = await buscarProduto(id);
        if (!p || p.status === 'oculto') { renderizarNaoEncontrado('Produto não encontrado ou indisponível.'); return; }

        document.title = `${p.nome} — Minha Loja`;
        const disp = rotuloDisponibilidade(p);
        const cond = rotuloCondicao(p.condicao);
        const imagens = p.imagens.length ? p.imagens : [{ url: null, id: 'ph' }];

        el.innerHTML = `
          <div class="migalhas">
            <a href="./index.html">Início</a>
            <span><a href="./produtos.html">Produtos</a></span>
            ${p.categoria ? `<span><a href="./produtos.html?categoria=${p.categoriaId}">${esc(p.categoria.nome)}</a></span>` : ''}
            <span>${esc(p.nome)}</span>
          </div>
          <div class="produto">
            <div class="galeria">
              <div class="galeria__principal" id="galeria-principal">
                ${p.imagemPrincipal ? `<img src="${p.imagemPrincipal}" alt="${esc(p.nome)}" id="img-principal" />` : `<div class="produto-card__sem-imagem"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
              </div>
              ${imagens.length > 1 ? `<div class="galeria__miniaturas" id="galeria-miniaturas">${imagens.map((img, i) => `<button class="galeria__miniatura ${i === 0 ? 'ativa' : ''}" data-img="${img.url || ''}">${img.url ? `<img src="${img.url}" alt="" />` : ''}</button>`).join('')}</div>` : ''}
            </div>

            <div class="produto__info">
              <div class="produto__meta">
                <span class="badge badge--neutro">${cond}</span>
                <span class="badge badge--${disp.tipo}">${disp.texto}</span>
                ${p.marca ? `<span class="texto-suave">Marca: <strong>${esc(p.marca)}</strong></span>` : ''}
                ${p.sku ? `<span class="texto-suave">Cód: ${esc(p.sku)}</span>` : ''}
              </div>

              <h1 class="produto__nome">${esc(p.nome)}</h1>
              ${p.descricaoCurta ? `<p class="texto-suave">${esc(p.descricaoCurta)}</p>` : ''}

              <div class="produto__preco-bloco">
                ${p.temPromo ? `<div class="produto__preco-antigo">R$ ${p.preco.toFixed(2)}</div><div class="produto__preco produto__preco--promo">R$ ${p.precoPromocional.toFixed(2)}</div>` : `<div class="produto__preco">R$ ${p.preco.toFixed(2)}</div>`}
                <div class="produto__parcelas">Em até <strong>3x</strong> de R$ ${(p.precoFinal/3).toFixed(2)} sem juros</div>
              </div>

              <div class="produto__acoes">
                <button class="btn btn--principal btn--lg btn--bloco" id="btn-comprar">Comprar agora</button>
                <div class="produto__acoes-linha">
                  <button class="btn btn--contorno" id="btn-proposta">Fazer proposta</button>
                  <button class="btn btn--contorno" id="btn-chat">Conversar</button>
                </div>
                <div class="produto__acoes-linha">
                  <button class="btn btn--sucesso" id="btn-whatsapp">Falar no WhatsApp</button>
                  <button class="btn btn--fantasma btn--icone" id="btn-favorito" title="Favoritar">❤</button>
                </div>
              </div>

              ${p.descricao ? `<div><h3 class="mb-2">Descrição</h3><p class="produto__descricao">${esc(p.descricao)}</p></div>` : ''}
              ${renderCarac(p.caracteristicas)}
              ${renderEsp(p)}
            </div>
          </div>
        `;

        ligarEventos(p);
        aplicarFavorito(p.id);
      } catch (e) {
        console.error(e);
        renderizarNaoEncontrado('Não foi possível carregar este produto.');
      }
    }

    function renderCarac(c) {
      if (!Array.isArray(c) || !c.length) return '';
      return `<div><h3 class="mb-2">Características</h3><ul style="list-style:disc;padding-left:1.2rem;">${c.map(x => `<li class="texto-sm">${esc(x)}</li>`).join('')}</ul></div>`;
    }

    function renderEsp(p) {
      const linhas = [];
      if (p.marca) linhas.push(['Marca', p.marca]);
      if (p.modelo) linhas.push(['Modelo', p.modelo]);
      if (p.sku) linhas.push(['Código / SKU', p.sku]);
      if (p.condicao) linhas.push(['Condição', rotuloCondicao(p.condicao)]);
      const esp = p.especificacoes || {};
      Object.keys(esp).forEach(k => { if (esp[k] != null && esp[k] !== '') linhas.push([k, String(esp[k])]); });
      if (!linhas.length) return '';
      return `<div><h3 class="mb-2">Especificações</h3><div class="produto__especificacoes"><table><tbody>${linhas.map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }

    function ligarEventos(p) {
      document.querySelectorAll('.galeria__miniatura').forEach(btn => {
        btn.onclick = () => {
          const url = btn.dataset.img;
          if (!url) return;
          document.getElementById('galeria-principal').innerHTML = `<img src="${url}" alt="" id="img-principal" />`;
          document.querySelectorAll('.galeria__miniatura').forEach(b => b.classList.remove('ativa'));
          btn.classList.add('ativa');
        };
      });

      document.getElementById('btn-comprar').onclick = () => { adicionarCarrinho(p, 1); location.href = './carrinho.html'; };

      document.getElementById('btn-proposta').onclick = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { modalAviso('Entre na sua conta', 'Para enviar uma proposta, você precisa estar logado.', 'Fazer login', './login.html'); return; }
        abrirModalProposta(p);
      };

      document.getElementById('btn-chat').onclick = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { modalAviso('Entre na sua conta', 'Para conversar com a loja, faça login.', 'Fazer login', './login.html'); return; }
        abrirChat(p);
      };

      document.getElementById('btn-whatsapp').onclick = () => abrirWhatsapp({ tipo: 'produto', produto: p });

      document.getElementById('btn-favorito').onclick = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { modalAviso('Entre na sua conta', 'Para favoritar, faça login.', 'Fazer login', './login.html'); return; }
        alternarFavorito(p.id);
      };
    }

    function adicionarCarrinho(p, qtd) {
      const c = JSON.parse(localStorage.getItem('carrinho') || '[]');
      const idx = c.findIndex(i => i.id === p.id);
      if (idx >= 0) c[idx].quantidade += qtd;
      else c.push({ id: p.id, nome: p.nome, preco: p.precoFinal, imagem: p.imagemPrincipal, quantidade: qtd });
      localStorage.setItem('carrinho', JSON.stringify(c));
      toast('Adicionado ao carrinho', p.nome, 'sucesso');
    }

    async function aplicarFavorito(produtoId) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const { data } = await supabase.from('favorites').select('id').eq('user_id', user.id).eq('product_id', produtoId).maybeSingle();
      if (data) document.getElementById('btn-favorito')?.classList.add('ativo');
    }

    async function alternarFavorito(produtoId) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const btn = document.getElementById('btn-favorito');
      const { data: ex } = await supabase.from('favorites').select('id').eq('user_id', user.id).eq('product_id', produtoId).maybeSingle();
      if (ex) { await supabase.from('favorites').delete().eq('id', ex.id); btn.classList.remove('ativo'); toast('Removido dos favoritos','','neutro'); }
      else { await supabase.from('favorites').insert({ user_id: user.id, product_id: produtoId }); btn.classList.add('ativo'); toast('Adicionado aos favoritos','','sucesso'); }
    }

    async function abrirChat(p) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const { data: ex } = await supabase.from('chats').select('id').eq('user_id', user.id).eq('product_id', p.id).maybeSingle();
      let chatId = ex?.id;
      if (!chatId) {
        const { data: novo, error } = await supabase.from('chats').insert({ user_id: user.id, product_id: p.id, assunto: `Interesse em: ${p.nome}` }).select('id').single();
        if (error) { toast('Erro','Não foi possível abrir o chat','erro'); return; }
        chatId = novo.id;
      }
      location.href = `./conversa.html?id=${chatId}`;
    }

    function abrirModalProposta(p) {
      const el = document.getElementById('modal-proposta');
      el.classList.remove('oculto');
      el.innerHTML = `
        <div class="modal-overlay" id="mp-bg">
          <div class="modal" style="max-width:520px;">
            <div class="modal__cabecalho"><h2 class="modal__titulo">Enviar proposta</h2><button class="modal__fechar" id="mp-x">×</button></div>
            <form id="form-prop">
              <div class="modal__corpo">
                <p class="texto-sm texto-suave mb-4">Produto: <strong>${esc(p.nome)}</strong><br>Preço anunciado: <strong>R$ ${p.precoFinal.toFixed(2)}</strong></p>
                <div class="campo"><label>Seu valor (R$)</label><input type="number" id="vp" min="0" step="0.01" required /></div>
                <div class="campo"><label>Quantidade</label><input type="number" id="qp" min="1" value="1" required /></div>
                <div class="campo"><label>Mensagem</label><textarea id="mp" rows="3"></textarea></div>
              </div>
              <div class="modal__rodape">
                <button type="button" class="btn btn--fantasma" id="mp-cancel">Cancelar</button>
                <button type="submit" class="btn btn--principal" id="mp-enviar">Enviar proposta</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('mp-x').onclick = fecharProp;
      document.getElementById('mp-cancel').onclick = fecharProp;
      document.getElementById('mp-bg').onclick = (e) => { if (e.target.id === 'mp-bg') fecharProp(); };
      document.getElementById('form-prop').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('mp-enviar');
        btn.disabled = true; btn.textContent = 'Enviando...';
        const { data: { user } } = await supabase.auth.getUser();
        const { data: prop, error } = await supabase.from('proposals').insert({
          user_id: user.id, product_id: p.id, preco_anunciado: p.precoFinal,
          valor_proposta: Number(document.getElementById('vp').value),
          quantidade: Number(document.getElementById('qp').value),
          mensagem: document.getElementById('mp').value.trim() || null,
          status: 'enviada'
        }).select('id, numero').single();
        if (error) { toast('Erro', error.message, 'erro'); btn.disabled = false; btn.textContent = 'Enviar proposta'; return; }
        fecharProp();
        toast('Proposta enviada!', `Número: ${prop.numero}`, 'sucesso');
        setTimeout(() => location.href = './propostas.html', 1200);
      };
    }

    function fecharProp() { const el = document.getElementById('modal-proposta'); el.classList.add('oculto'); el.innerHTML = ''; }

    function modalAviso(t, txt, bt, link) {
      const el = document.getElementById('modal-aviso');
      el.classList.remove('oculto');
      el.innerHTML = `<div class="modal-overlay" id="ma-bg"><div class="modal" style="max-width:400px;"><div class="modal__cabecalho"><h2 class="modal__titulo">${esc(t)}</h2></div><div class="modal__corpo"><p>${esc(txt)}</p></div><div class="modal__rodape"><button class="btn btn--fantasma" id="ma-c">Agora não</button><a href="${link}" class="btn btn--principal">${esc(bt)}</a></div></div></div>`;
      document.getElementById('ma-c').onclick = () => { el.classList.add('oculto'); el.innerHTML = ''; };
      document.getElementById('ma-bg').onclick = (e) => { if (e.target.id === 'ma-bg') { el.classList.add('oculto'); el.innerHTML = ''; } };
    }

    function renderizarNaoEncontrado(msg) {
      document.getElementById('conteudo-produto').innerHTML = `<div class="estado-vazio"><div class="estado-vazio__titulo">Produto não disponível</div><p class="estado-vazio__descricao">${esc(msg)}</p><a href="./produtos.html" class="btn btn--principal">Ver catálogo</a></div>`;
    }

    function toast(t, m = '', tipo = 'info') {
      let a = document.querySelector('.toast-area');
      if (!a) { a = document.createElement('div'); a.className = 'toast-area'; document.body.appendChild(a); }
      const x = document.createElement('div');
      x.className = `toast toast--${tipo}`;
      x.innerHTML = `<div class="toast__titulo">${esc(t)}</div>${m ? `<div class="toast__msg">${esc(m)}</div>` : ''}`;
      a.appendChild(x);
      setTimeout(() => x.remove(), 4000);
    }

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
