<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Produtos — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { font-size: 18px; }
    .topbar__acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .topbar input[type=search] { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; width: 200px; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { filter: brightness(.94); }
    .btn--fantasma { background: transparent; color: #0ea5e9; }
    .btn--perigo { background: transparent; color: #dc2626; border-color: transparent; padding: 6px 10px; }
    .btn--loja { padding: 8px 14px; border: 1px solid #0ea5e9; border-radius: 8px; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn--loja:hover { background: #0ea5e9; color: #fff; }
    .conteudo { padding: 24px; }
    .vazio { background: #fff; padding: 60px 24px; text-align: center; border-radius: 12px; border: 1px solid #e2e8f0; color: #64748b; }
    .tabela { width: 100%; background: #fff; border-collapse: collapse; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
    .tabela th { text-align: left; padding: 12px 16px; background: #f8fafc; font-size: 12px; text-transform: uppercase; color: #64748b; }
    .tabela td { padding: 12px 16px; border-top: 1px solid #e2e8f0; font-size: 14px; }
    .tabela tr:hover td { background: #f8fafc; }
    .miniatura { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #f1f5f9; display: block; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; font-family: monospace; font-size: 13px; margin: 20px; }
    .badge { padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge--ok { background: #dcfce7; color: #166534; }
    .badge--no { background: #fee2e2; color: #991b1b; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>
      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item ativo">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
        <a href="./produtos-destaque.html" class="sidebar__item">Destaques e promoções</a>
      </nav>
      <div class="sidebar__secao">Clientes</div>
      <nav class="sidebar__lista">
        <a href="./clientes.html" class="sidebar__item">Clientes</a>
      </nav>
      <div class="sidebar__secao">Configurações</div>
      <nav class="sidebar__lista">
        <a href="./empresa.html" class="sidebar__item">Dados da empresa</a>
        <a href="./identidade.html" class="sidebar__item">Identidade visual</a>
        <a href="./configuracoes.html" class="sidebar__item">Outras configurações</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Produtos</h1>
        <div class="topbar__acoes">
          <input type="search" id="busca" placeholder="Buscar produto..." />
          <a href="../index.html" class="btn--loja">← Ver loja</a>
          <a href="./produto-editar.html" class="btn">+ Novo produto</a>
        </div>
      </header>
      <div class="conteudo" id="conteudo">
        <div class="vazio">Carregando...</div>
      </div>
    </main>
  </div>

  <script type="module">
    const conteudo = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    let supabase;
    let todos = [];

    (async () => {
      try {
        const mod = await import('../assets/js/supabase.js');
        supabase = mod.supabase;

        const r = await supabase.auth.getSession();
        const session = r.data ? r.data.session : null;
        if (!session) { location.href = '../login.html'; return; }

        const p = await supabase.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
        if (!p.data || p.data.role !== 'admin') {
          conteudo.innerHTML = '<div class="erro">Acesso restrito a administradores</div>';
          return;
        }

        await carregar();

        document.getElementById('busca').addEventListener('input', function() {
          const q = this.value.trim().toLowerCase();
          renderizar(todos.filter(function(x) {
            return !q || (x.nome || '').toLowerCase().indexOf(q) !== -1;
          }));
        });
      } catch (e) {
        conteudo.innerHTML = '<div class="erro">Erro: ' + esc(e.message) + '</div>';
      }
    })();

    async function carregar() {
      const r = await supabase
        .from('products')
        .select('id, nome, preco, preco_promocional, estoque, status, product_images ( url, principal, ordem )')
        .order('created_at', { ascending: false });

      if (r.error) {
        conteudo.innerHTML = '<div class="erro">' + esc(r.error.message) + '</div>';
        return;
      }

      todos = r.data || [];
      renderizar(todos);
    }

    function renderizar(lista) {
      if (!lista.length) {
        conteudo.innerHTML = '<div class="vazio"><div style="font-size:18px;font-weight:600;color:#0f172a;margin-bottom:8px;">Nenhum produto ainda</div><p style="margin-bottom:20px;">Clique em "+ Novo produto" para cadastrar o primeiro.</p><a href="./produto-editar.html" class="btn">Cadastrar primeiro produto</a></div>';
        return;
      }

      conteudo.innerHTML =
        '<table class="tabela">' +
          '<thead><tr><th>Foto</th><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>' +
          '<tbody>' +
            lista.map(function(p) {
              const imgs = (p.product_images || []).slice().sort(function(a, b) { return (b.principal ? 1 : 0) - (a.principal ? 1 : 0); });
              const img = imgs[0] ? imgs[0].url : null;
              const temPromo = p.preco_promocional != null && p.preco_promocional < p.preco;
              return '<tr>' +
                '<td>' + (img ? '<img src="' + img + '" class="miniatura" alt="" loading="lazy" />' : '<div class="miniatura"></div>') + '</td>' +
                '<td><strong>' + esc(p.nome) + '</strong></td>' +
                '<td>' +
                  (temPromo
                    ? '<div style="font-size:11px;color:#94a3b8;text-decoration:line-through;">R$ ' + Number(p.preco).toFixed(2) + '</div><strong style="color:#16a34a;">R$ ' + Number(p.preco_promocional).toFixed(2) + '</strong>'
                    : '<strong>R$ ' + Number(p.preco).toFixed(2) + '</strong>') +
                '</td>' +
                '<td>' + (p.estoque || 0) + '</td>' +
                '<td><span class="badge ' + (p.status === 'disponivel' ? 'badge--ok' : 'badge--no') + '">' + esc(p.status) + '</span></td>' +
                '<td style="text-align:right;">' +
                  '<a href="./produto-editar.html?id=' + p.id + '" class="btn btn--fantasma">Editar</a>' +
                  '<button class="btn btn--perigo" data-del="' + p.id + '">Excluir</button>' +
                '</td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>';

      conteudo.querySelectorAll('[data-del]').forEach(function(b) {
        b.onclick = async function() {
          if (!confirm('Excluir este produto?')) return;
          await supabase.from('products').delete().eq('id', b.dataset.del);
          carregar();
        };
      });
    }
  </script>
</body>
</html>
