<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Editar produto — Admin</title>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/store.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />

  <style>
    .form-produto {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--esp-6);
      align-items: start;
    }
    @media (max-width: 1024px) {
      .form-produto { grid-template-columns: 1fr; }
    }
    .imagens-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: var(--esp-2);
      margin-top: var(--esp-3);
    }
    .imagem-card {
      aspect-ratio: 1;
      border-radius: var(--raio-md);
      overflow: hidden;
      border: 2px solid var(--cor-borda);
      position: relative;
      background: var(--cor-fundo-suave);
    }
    .imagem-card img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .imagem-card.principal { border-color: var(--cor-principal); }
    .imagem-card__btn {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(255,255,255,0.9);
      border-radius: var(--raio-sm);
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      color: var(--cor-erro);
      padding: 0;
    }
    .upload-area {
      border: 2px dashed var(--cor-borda);
      border-radius: var(--raio-md);
      padding: var(--esp-6);
      text-align: center;
      color: var(--cor-texto-suave);
      cursor: pointer;
      transition: all var(--transicao-rapida);
    }
    .upload-area:hover {
      border-color: var(--cor-principal);
      background: var(--cor-fundo-suave);
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div id="admin-sidebar-overlay" class="admin-sidebar-overlay"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button id="admin-menu-btn" class="admin-topbar__menu-btn" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="admin-topbar__titulo" id="titulo-pagina">Novo produto</h1>
        <div class="admin-topbar__acoes">
          <a href="./produtos.html" class="btn btn--fantasma btn--sm">Voltar</a>
          <button class="btn btn--principal btn--sm" id="btn-salvar-topo">Salvar</button>
        </div>
      </header>

      <div class="admin-conteudo">
        <div id="carregando" class="carregando"><div class="spinner"></div></div>

        <form id="form-produto" class="form-produto oculto">

          <!-- COLUNA PRINCIPAL -->
          <div>
            <div class="admin-secao" style="padding: var(--esp-5);">
              <div class="campo">
                <label for="nome">Nome do produto *</label>
                <input type="text" id="nome" required />
              </div>

              <div class="campo">
                <label for="descricao_curta">Descrição curta</label>
                <input type="text" id="descricao_curta" maxlength="200" placeholder="Resumo em uma linha" />
              </div>

              <div class="campo">
                <label for="descricao">Descrição completa</label>
                <textarea id="descricao" rows="6"></textarea>
              </div>
            </div>

            <div class="admin-secao mt-4" style="padding: var(--esp-5);">
              <h3 class="mb-4">Imagens</h3>

              <div class="upload-area" id="upload-area">
                <input type="file" id="input-arquivos" multiple accept="image/*" hidden />
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 8px;">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <div><strong>Clique para escolher imagens</strong></div>
                <div class="texto-xs">Você pode enviar várias fotos</div>
              </div>

              <div id="status-upload" class="oculto mt-3"></div>

              <div class="imagens-grid" id="imagens-grid"></div>
            </div>

            <div class="admin-secao mt-4" style="padding: var(--esp-5);">
              <h3 class="mb-4">Especificações</h3>

              <div class="campo-grupo" style="gap: var(--esp-3);">
                <div class="campo" style="flex:1; margin-bottom:0;">
                  <label for="marca">Marca</label>
                  <input type="text" id="marca" />
                </div>
                <div class="campo" style="flex:1; margin-bottom:0;">
                  <label for="modelo">Modelo</label>
                  <input type="text" id="modelo" />
                </div>
              </div>

              <div class="campo mt-4">
                <label for="sku">Código / SKU</label>
                <input type="text" id="sku" />
              </div>

              <div class="campo">
                <label for="caracteristicas">Características (uma por linha)</label>
                <textarea id="caracteristicas" rows="4" placeholder="Exemplo:
Garantia de 90 dias
Acompanha cabo
Caixa original"></textarea>
              </div>

              <div class="campo">
                <label for="especificacoes">Especificações técnicas (chave: valor, uma por linha)</label>
                <textarea id="especificacoes" rows="4" placeholder="Exemplo:
Cor: Preto
Tamanho: 40cm
Peso: 1,2kg"></textarea>
              </div>
            </div>
          </div>

          <!-- COLUNA LATERAL -->
          <aside>
            <div class="admin-secao" style="padding: var(--esp-5);">
              <h3 class="mb-3">Publicação</h3>

              <div class="campo">
                <label for="status">Status</label>
                <select id="status">
                  <option value="disponivel">Disponível</option>
                  <option value="indisponivel">Indisponível</option>
                  <option value="em_negociacao">Em negociação</option>
                  <option value="vendido">Vendido</option>
                  <option value="oculto">Oculto</option>
                </select>
              </div>

              <div class="campo">
                <label class="checkbox">
                  <input type="checkbox" id="destaque" />
                  <span>Exibir em destaque na home</span>
                </label>
              </div>
            </div>

            <div class="admin-secao mt-4" style="padding: var(--esp-5);">
              <h3 class="mb-3">Preços</h3>

              <div class="campo">
                <label for="preco">Preço (R$) *</label>
                <input type="number" id="preco" min="0" step="0.01" required />
              </div>

              <div class="campo">
                <label for="preco_promocional">Preço promocional (R$)</label>
                <input type="number" id="preco_promocional" min="0" step="0.01" />
                <span class="campo__dica">Deixe vazio para não ter promoção</span>
              </div>
            </div>

            <div class="admin-secao mt-4" style="padding: var(--esp-5);">
              <h3 class="mb-3">Estoque e categoria</h3>

              <div class="campo">
                <label for="estoque">Quantidade em estoque</label>
                <input type="number" id="estoque" min="0" value="1" />
              </div>

              <div class="campo">
                <label for="categoria_id">Categoria</label>
                <select id="categoria_id"><option value="">Carregando...</option></select>
              </div>

              <div class="campo">
                <label for="condicao">Condição</label>
                <select id="condicao">
                  <option value="novo">Novo</option>
                  <option value="seminovo">Seminovo</option>
                  <option value="usado">Usado</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn--principal btn--bloco btn--lg mt-4" id="btn-salvar">
              Salvar produto
            </button>
          </aside>

        </form>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/pages/admin-produto-editar.js"></script>
</body>
</html>
