<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Banners da home — Admin</title>
<link rel="stylesheet" href="../assets/css/admin.css" />
<style>
.banners-conteudo {
  padding: 24px;
}

.banners-intro {
  margin-bottom: 18px;
}
.banners-intro h2 {
  margin: 0 0 5px;
  font-size: 20px;
  color: #0f172a;
}
.banners-intro p {
  margin: 0;
  color: #64748b;
  font-size: 14px;
}

/* Configurações do carrossel */
.config-bloco {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
}
.config-bloco h3 {
  margin: 0 0 14px;
  font-size: 14px;
  color: #0f172a;
  padding-bottom: 10px;
  border-bottom: 1px solid #e2e8f0;
}
.config-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  align-items: end;
}
.config-campo {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.config-campo label {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
}
.config-campo input[type="number"] {
  padding: 9px 11px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
.config-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  cursor: pointer;
}
.config-check input {
  width: 18px;
  height: 18px;
  accent-color: #0ea5e9;
  cursor: pointer;
}

/* Lista de slides */
.lista-slides {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.slide-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 200px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 12px;
  transition: border-color .15s, box-shadow .15s;
}
.slide-card:hover {
  border-color: #cbd5e1;
  box-shadow: 0 2px 8px rgba(15,23,42,.04);
}
.slide-card.inativo {
  opacity: .55;
}

.slide-preview {
  width: 200px;
  height: 100px;
  border-radius: 10px;
  overflow: hidden;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  font-size: 12px;
  flex-shrink: 0;
}
.slide-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.slide-info {
  min-width: 0;
}
.slide-info h4 {
  margin: 0 0 4px;
  font-size: 15px;
  color: #0f172a;
}
.slide-info p {
  margin: 0 0 6px;
  font-size: 13px;
  color: #64748b;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.slide-info .slide-meta {
  font-size: 11px;
  color: #94a3b8;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.slide-info .slide-meta code {
  background: #f8fafc;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: ui-monospace, monospace;
  color: #64748b;
}

.slide-acoes {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: stretch;
  min-width: 120px;
}

/* Botões */
.btn {
  padding: 9px 15px;
  border-radius: 8px;
  border: 1px solid #0ea5e9;
  background: #0ea5e9;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  transition: filter .15s;
}
.btn:hover { filter: brightness(.95); color: #fff; text-decoration: none; }
.btn-secundario {
  background: #fff;
  color: #0ea5e9;
}
.btn-perigo {
  background: transparent;
  color: #dc2626;
  border-color: transparent;
  padding: 6px 10px;
  font-size: 12px;
}
.btn-pequeno {
  padding: 6px 12px;
  font-size: 12px;
}

.acoes-topo {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.status-msg {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.status-msg.visivel { display: block; }
.status-msg--ok { background: #dcfce7; color: #166534; }
.status-msg--err { background: #fee2e2; color: #991b1b; }
.status-msg--info { background: #dbeafe; color: #1e40af; }

.vazio {
  padding: 60px 24px;
  text-align: center;
  background: #fff;
  border-radius: 12px;
  border: 1px dashed #cbd5e1;
  color: #64748b;
}
.vazio strong {
  display: block;
  color: #0f172a;
  font-size: 16px;
  margin-bottom: 6px;
}

.erro {
  padding: 18px;
  background: #fee2e2;
  color: #991b1b;
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
}

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.6);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 9999;
}
.modal-bg.aberto { display: flex; }
.modal {
  background: #fff;
  border-radius: 16px;
  max-width: 620px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.modal h2 {
  font-size: 18px;
  margin: 0 0 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid #e2e8f0;
}
.campo {
  margin-bottom: 14px;
}
.campo label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 5px;
  color: #334155;
}
.campo input,
.campo textarea,
.campo select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  box-sizing: border-box;
}
.campo input:focus,
.campo textarea:focus,
.campo select:focus {
  outline: none;
  border-color: #0ea5e9;
  box-shadow: 0 0 0 3px rgba(14,165,233,.1);
}
.campo__dica {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 4px;
  display: block;
}

.upload-area {
  border: 2px dashed #cbd5e1;
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  background: #f8fafc;
}
.upload-area:hover {
  border-color: #0ea5e9;
  background: #f0f9ff;
}
.upload-area__preview {
  max-width: 100%;
  max-height: 180px;
  margin: 0 auto;
  display: block;
  border-radius: 8px;
}
.upload-area__texto {
  color: #64748b;
  font-size: 13px;
}
.upload-area__texto strong {
  color: #0f172a;
  display: block;
  font-size: 14px;
  margin-bottom: 2px;
}

.linha-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.check-linha {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  cursor: pointer;
}
.check-linha input {
  width: 18px;
  height: 18px;
  accent-color: #0ea5e9;
  cursor: pointer;
}
.check-linha label {
  margin: 0;
  cursor: pointer;
}

.modal__acoes {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #e2e8f0;
}

@media (max-width: 900px) {
  .slide-card {
    grid-template-columns: 1fr;
  }
  .slide-preview {
    width: 100%;
    height: 140px;
  }
  .slide-acoes {
    flex-direction: row;
  }
  .linha-2 {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-sidebar-overlay" id="admin-sidebar-overlay"></div>

  <main class="admin-main">
    <header class="admin-topbar">
      <button id="admin-menu-btn" class="admin-topbar__menu-btn" aria-label="Abrir menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h1 class="admin-topbar__titulo">Banners da home</h1>
      <div class="admin-topbar__acoes">
        <button class="btn" id="btn-novo">+ Novo slide</button>
        <a href="../index.html" class="btn-loja" style="padding:8px 14px;border:1px solid #0ea5e9;border-radius:8px;color:#0ea5e9;text-decoration:none;font-size:13px;font-weight:600;">← Ver loja</a>
      </div>
    </header>

    <div class="banners-conteudo">

      <div class="banners-intro">
        <h2>Carrossel da página inicial</h2>
        <p>Configure os slides que aparecem no banner do topo da loja. Eles trocam automaticamente.</p>
      </div>

      <div id="status-msg" class="status-msg"></div>

      <!-- CONFIGURAÇÕES DO CARROSSEL -->
      <div class="config-bloco">
        <h3>⚙️ Configurações do carrossel</h3>
        <div class="config-grid">
          <div class="config-campo">
            <label for="cfg-autoplay">Autoplay (segundos)</label>
            <input type="number" id="cfg-autoplay" min="2" max="30" value="5" />
          </div>
          <label class="config-check">
            <input type="checkbox" id="cfg-setas" checked />
            Mostrar setas ‹ ›
          </label>
          <label class="config-check">
            <input type="checkbox" id="cfg-bolinhas" checked />
            Mostrar bolinhas ● ○ ○
          </label>
          <label class="config-check">
            <input type="checkbox" id="cfg-hover" checked />
            Pausar ao passar o mouse
          </label>
          <label class="config-check">
            <input type="checkbox" id="cfg-swipe" checked />
            Permitir swipe no mobile
          </label>
        </div>
        <div style="margin-top:14px;">
          <button class="btn btn-secundario" id="btn-salvar-config">Salvar configurações</button>
        </div>
      </div>

      <!-- LISTA DE SLIDES -->
      <h3 style="font-size:14px;color:#0f172a;margin:0 0 12px;">📸 Slides</h3>
      <div class="lista-slides" id="lista-slides">
        <div class="vazio">Carregando...</div>
      </div>

    </div>
  </main>
</div>

<!-- MODAL DE EDIÇÃO -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-corpo"></div>
</div>

<script type="module">

import { supabase } from '../assets/js/supabase.js';
import { renderAdminMenu } from '../assets/js/components/admin-menu.js';

const el = document.getElementById('lista-slides');
const statusMsg = document.getElementById('status-msg');

let slides = [];
let arquivoImagem = null;

/* ============================================================
   SEGURANÇA
   ============================================================ */
function esc(v) {
  if (v == null) return '';
  return String(v).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

/* ============================================================
   STATUS
   ============================================================ */
function mostrarStatus(msg, tipo) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg visivel status-msg--' + tipo;
  setTimeout(function() {
    statusMsg.classList.remove('visivel');
  }, 4000);
}

/* ============================================================
   ACESSO
   ============================================================ */
async function verificarAcesso() {
  const sessao = await supabase.auth.getSession();
  if (!sessao.data || !sessao.data.session) {
    location.href = '../login.html';
    return false;
  }
  const perfil = await supabase
    .from('profiles')
    .select('role')
    .eq('id', sessao.data.session.user.id)
    .maybeSingle();

  if (!perfil.data || perfil.data.role !== 'admin') {
    el.innerHTML = '<div class="erro">Acesso restrito a administradores.</div>';
    return false;
  }
  return true;
}

/* ============================================================
   CARREGAR
   ============================================================ */
async function carregar() {
  el.innerHTML = '<div class="vazio">Carregando slides...</div>';

  try {
    const r = await supabase
      .from('visual_settings')
      .select('banners_home, carrossel_config')
      .eq('id', 1)
      .maybeSingle();

    if (r.error) throw r.error;

    slides = Array.isArray(r.data?.banners_home) ? r.data.banners_home : [];

    // Configurações
    const cfg = r.data?.carrossel_config || {};
    document.getElementById('cfg-autoplay').value = cfg.autoplay_segundos || 5;
    document.getElementById('cfg-setas').checked = cfg.mostrar_setas !== false;
    document.getElementById('cfg-bolinhas').checked = cfg.mostrar_bolinhas !== false;
    document.getElementById('cfg-hover').checked = cfg.pausar_no_hover !== false;
    document.getElementById('cfg-swipe').checked = cfg.permitir_swipe !== false;

    renderizar();
  } catch (e) {
    el.innerHTML = '<div class="erro">Erro ao carregar: ' + esc(e.message) + '</div>';
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderizar() {
  if (!slides.length) {
    el.innerHTML = '<div class="vazio">' +
      '<strong>Nenhum slide criado</strong>' +
      '<p style="margin:0 0 16px;">Clique em "+ Novo slide" para adicionar o primeiro banner.</p>' +
      '<p style="font-size:12px;color:#94a3b8;margin:0;">Se você não criar nenhum, a home vai continuar usando o banner padrão.</p>' +
      '</div>';
    return;
  }

  const ordenados = slides.slice().sort(function(a, b) {
    return (a.ordem || 0) - (b.ordem || 0);
  });

  el.innerHTML = ordenados.map(function(s) {
    const img = s.imagem_url
      ? '<img src="' + esc(s.imagem_url) + '" alt="" />'
      : 'Sem imagem';

    return '<div class="slide-card ' + (s.ativo === false ? 'inativo' : '') + '">' +
      '<div class="slide-preview">' + img + '</div>' +
      '<div class="slide-info">' +
        '<h4>' + esc(s.titulo || 'Sem título') + '</h4>' +
        (s.subtitulo ? '<p>' + esc(s.subtitulo) + '</p>' : '') +
        '<div class="slide-meta">' +
          '<span>Ordem: <strong>' + (s.ordem || 0) + '</strong></span>' +
          (s.texto_botao ? '<span>Botão: <strong>' + esc(s.texto_botao) + '</strong></span>' : '') +
          (s.link_botao ? '<span>Link: <code>' + esc(s.link_botao) + '</code></span>' : '') +
          '<span>' + (s.ativo === false ? '❌ Inativo' : '✅ Ativo') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="slide-acoes">' +
        '<button class="btn btn-secundario btn-pequeno" data-edit="' + s.id + '">✏️ Editar</button>' +
        '<button class="btn btn-secundario btn-pequeno" data-toggle="' + s.id + '">' +
          (s.ativo === false ? '👁️ Ativar' : '🚫 Desativar') +
        '</button>' +
        '<button class="btn btn-perigo" data-del="' + s.id + '">🗑️ Excluir</button>' +
      '</div>' +
    '</div>';
  }).join('');

  // Eventos
  el.querySelectorAll('[data-edit]').forEach(function(b) {
    b.onclick = function() {
      const slide = slides.find(function(x) { return x.id === b.dataset.edit; });
      abrirModal(slide);
    };
  });

  el.querySelectorAll('[data-toggle]').forEach(function(b) {
    b.onclick = async function() {
      const slide = slides.find(function(x) { return x.id === b.dataset.toggle; });
      slide.ativo = slide.ativo === false;
      await salvarSlides();
    };
  });

  el.querySelectorAll('[data-del]').forEach(function(b) {
    b.onclick = async function() {
      if (!confirm('Excluir este slide?')) return;
      slides = slides.filter(function(x) { return x.id !== b.dataset.del; });
      await salvarSlides();
    };
  });
}

/* ============================================================
   SALVAR SLIDES
   ============================================================ */
async function salvarSlides() {
  try {
    const r = await supabase
      .from('visual_settings')
      .update({ banners_home: slides, updated_at: new Date().toISOString() })
      .eq('id', 1);

    if (r.error) throw r.error;
    renderizar();
    mostrarStatus('✅ Slides salvos!', 'ok');
  } catch (e) {
    mostrarStatus('❌ Erro: ' + e.message, 'err');
  }
}

/* ============================================================
   SALVAR CONFIGURAÇÕES
   ============================================================ */
document.getElementById('btn-salvar-config').onclick = async function() {
  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const cfg = {
      autoplay_segundos: Number(document.getElementById('cfg-autoplay').value) || 5,
      mostrar_setas: document.getElementById('cfg-setas').checked,
      mostrar_bolinhas: document.getElementById('cfg-bolinhas').checked,
      pausar_no_hover: document.getElementById('cfg-hover').checked,
      permitir_swipe: document.getElementById('cfg-swipe').checked
    };

    const r = await supabase
      .from('visual_settings')
      .update({ carrossel_config: cfg, updated_at: new Date().toISOString() })
      .eq('id', 1);

    if (r.error) throw r.error;
    mostrarStatus('✅ Configurações salvas!', 'ok');
  } catch (e) {
    mostrarStatus('❌ Erro: ' + e.message, 'err');
  }

  btn.disabled = false;
  btn.textContent = 'Salvar configurações';
};

/* ============================================================
   MODAL DE EDIÇÃO
   ============================================================ */
function abrirModal(slide) {
  const editando = !!slide;
  const s = slide || {
    id: 'slide-' + Date.now().toString(36),
    imagem_url: null,
    titulo: '',
    subtitulo: '',
    texto_botao: 'Ver mais',
    link_botao: './produtos.html',
    ativo: true,
    ordem: slides.length
  };

  arquivoImagem = null;

  const modal = document.getElementById('modal-bg');
  const corpo = document.getElementById('modal-corpo');
  modal.classList.add('aberto');

  corpo.innerHTML =
    '<h2>' + (editando ? 'Editar' : 'Novo') + ' slide</h2>' +

    '<div class="campo">' +
      '<label>Imagem de fundo</label>' +
      '<div class="upload-area" id="upload-imagem">' +
        '<div id="preview-imagem">' +
          (s.imagem_url
            ? '<img src="' + esc(s.imagem_url) + '" class="upload-area__preview" alt="" />'
            : '<div class="upload-area__texto"><strong>Clique para escolher</strong>Recomendado: 1600×500px (proporção ~3:1)</div>') +
        '</div>' +
        '<input type="file" id="input-imagem" accept="image/*" hidden />' +
      '</div>' +
    '</div>' +

    '<div class="campo">' +
      '<label>Título</label>' +
      '<input type="text" id="f-titulo" value="' + esc(s.titulo || '') + '" placeholder="Ex: Ofertas imperdíveis" />' +
    '</div>' +

    '<div class="campo">' +
      '<label>Subtítulo</label>' +
      '<input type="text" id="f-subtitulo" value="' + esc(s.subtitulo || '') + '" placeholder="Ex: Aproveite os melhores preços" />' +
    '</div>' +

    '<div class="linha-2">' +
      '<div class="campo">' +
        '<label>Texto do botão</label>' +
        '<input type="text" id="f-texto-botao" value="' + esc(s.texto_botao || '') + '" placeholder="Ex: Ver ofertas" />' +
      '</div>' +
      '<div class="campo">' +
        '<label>Link do botão</label>' +
        '<input type="text" id="f-link-botao" value="' + esc(s.link_botao || '') + '" placeholder="Ex: ./produtos.html?ordenar=menor-preco" />' +
      '</div>' +
    '</div>' +

    '<div class="linha-2">' +
      '<div class="campo">' +
        '<label>Ordem de exibição</label>' +
        '<input type="number" id="f-ordem" value="' + (s.ordem || 0) + '" min="0" />' +
        '<span class="campo__dica">Menor número = aparece primeiro</span>' +
      '</div>' +
      '<label class="check-linha" style="padding-top:22px;">' +
        '<input type="checkbox" id="f-ativo" ' + (s.ativo !== false ? 'checked' : '') + ' />' +
        '<label for="f-ativo">Slide ativo</label>' +
      '</label>' +
    '</div>' +

    '<div class="modal__acoes">' +
      '<button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>' +
      '<button type="button" class="btn" id="btn-salvar-slide">' + (editando ? 'Salvar' : 'Adicionar') + '</button>' +
    '</div>';

  // Upload
  const areaUp = document.getElementById('upload-imagem');
  const inputImg = document.getElementById('input-imagem');
  const preview = document.getElementById('preview-imagem');

  areaUp.onclick = function() { inputImg.click(); };

  inputImg.onchange = function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    arquivoImagem = file;
    preview.innerHTML = '<img src="' + URL.createObjectURL(file) + '" class="upload-area__preview" alt="" />';
  };

  document.getElementById('btn-cancelar').onclick = function() {
    modal.classList.remove('aberto');
  };

  modal.onclick = function(e) {
    if (e.target === modal) modal.classList.remove('aberto');
  };

  document.getElementById('btn-salvar-slide').onclick = async function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
      let imagemUrl = s.imagem_url;

      // Upload de nova imagem
      if (arquivoImagem) {
        const ext = (arquivoImagem.name.split('.').pop() || 'jpg').toLowerCase();
        const path = 'banners-home/' + Date.now() + '.' + ext;

        const up = await supabase.storage
          .from('branding')
          .upload(path, arquivoImagem, { cacheControl: '3600', upsert: false });

        if (up.error) throw up.error;

        const urlData = supabase.storage.from('branding').getPublicUrl(path);
        imagemUrl = urlData.data.publicUrl;
      }

      const novato = {
        id: s.id,
        imagem_url: imagemUrl,
        titulo: document.getElementById('f-titulo').value.trim() || null,
        subtitulo: document.getElementById('f-subtitulo').value.trim() || null,
        texto_botao: document.getElementById('f-texto-botao').value.trim() || null,
        link_botao: document.getElementById('f-link-botao').value.trim() || null,
        ativo: document.getElementById('f-ativo').checked,
        ordem: Number(document.getElementById('f-ordem').value) || 0
      };

      if (editando) {
        slides = slides.map(function(x) {
          return x.id === s.id ? novato : x;
        });
      } else {
        slides.push(novato);
      }

      await salvarSlides();
      modal.classList.remove('aberto');
    } catch (e) {
      alert('Erro: ' + e.message);
      btn.disabled = false;
      btn.textContent = editando ? 'Salvar' : 'Adicionar';
    }
  };
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function iniciar() {
  try {
    renderAdminMenu('banners');
    const acesso = await verificarAcesso();
    if (!acesso) return;

    document.getElementById('btn-novo').onclick = function() {
      abrirModal();
    };

    await carregar();
  } catch (e) {
    el.innerHTML = '<div class="erro">Erro ao iniciar: ' + esc(e.message) + '</div>';
  }
})();

</script>
