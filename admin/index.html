<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Admin</title>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-sidebar-overlay" id="admin-sidebar-overlay"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button id="admin-menu-btn" class="admin-topbar__menu-btn" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="admin-topbar__titulo">Dashboard</h1>
        <div class="admin-topbar__acoes">
          <select id="filtro-periodo" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;">
            <option value="hoje">Hoje</option>
            <option value="7dias">Últimos 7 dias</option>
            <option value="mes" selected>Este mês</option>
            <option value="mes_anterior">Mês anterior</option>
            <option value="personalizado">Personalizado</option>
          </select>
          <a href="../index.html" class="btn btn--contorno btn--sm" target="_blank">Ver loja</a>
        </div>
      </header>

      <div class="admin-conteudo">
        <div id="filtro-custom" style="display:none;margin-bottom:20px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;">
          <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;">
            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;">De</label><input type="date" id="dataInicio" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;" /></div>
            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;">Até</label><input type="date" id="dataFim" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;" /></div>
            <button class="btn btn--principal btn--sm" id="btn-aplicar-filtro">Aplicar</button>
          </div>
        </div>

        <div id="conteudo"><div class="carregando" style="padding:60px;"><div class="spinner spinner--lg"></div></div></div>
      </div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });

    let supabase;
    let periodo = 'mes';

    (async () => {
      try {
        const mod = await import('../assets/js/supabase.js');
        supabase = mod.supabase;

        const r = await supabase.auth.getSession();
        if (!r.data || !r.data.session) { location.href = '../login.html'; return; }

        const p = await supabase.from('profiles').select('role').eq('id', r.data.session.user.id).maybeSingle();
        if (!p.data) { el.innerHTML = '<div class="erro" style="padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;">Perfil não encontrado</div>'; return; }

        renderMenu();
        await carregar();

        document.getElementById('filtro-periodo').onchange = function(e) {
          periodo = e.target.value;
          document.getElementById('filtro-custom').style.display = periodo === 'personalizado' ? 'block' : 'none';
          if (periodo !== 'personalizado') carregar();
        };

        document.getElementById('btn-aplicar-filtro').onclick = carregar;
      } catch (e) {
        el.innerHTML = '<div style="padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;font-family:monospace;">Erro: ' + esc(e.message) + '</div>';
      }
    })();

    function renderMenu() {
      const menuHTML =
        '<a href="../index.html" class="admin-sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="admin-sidebar__logo-badge">ADMIN</span></a>' +
        '<div class="admin-sidebar__secao">Principal</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./index.html" class="admin-sidebar__item ativo">Dashboard</a>' +
          '<a href="./pedidos.html" class="admin-sidebar__item">Pedidos</a>' +
          '<a href="./propostas.html" class="admin-sidebar__item">Propostas</a>' +
          '<a href="./conversas.html" class="admin-sidebar__item">Conversas</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Vendas</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./orcamentos.html" class="admin-sidebar__item">Orçamentos</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Financeiro</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./financeiro.html" class="admin-sidebar__item">Visão geral</a>' +
          '<a href="./contas-receber.html" class="admin-sidebar__item">Contas a receber</a>' +
          '<a href="./contas-pagar.html" class="admin-sidebar__item">Contas a pagar</a>' +
          '<a href="./fluxo-caixa.html" class="admin-sidebar__item">Fluxo de caixa</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Relatórios</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./relatorios.html" class="admin-sidebar__item">Todos os relatórios</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Catálogo</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./produtos.html" class="admin-sidebar__item">Produtos</a>' +
          '<a href="./categorias.html" class="admin-sidebar__item">Categorias</a>' +
          '<a href="./produtos-destaque.html" class="admin-sidebar__item">Destaques e promoções</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Estoque</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./estoque.html" class="admin-sidebar__item">Visão geral</a>' +
          '<a href="./estoque-movimentar.html" class="admin-sidebar__item">Movimentar</a>' +
          '<a href="./estoque-historico.html" class="admin-sidebar__item">Histórico</a>' +
          '<a href="./estoque-alertas.html" class="admin-sidebar__item">Alertas</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Compras</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./fornecedores.html" class="admin-sidebar__item">Fornecedores</a>' +
          '<a href="./compras.html" class="admin-sidebar__item">Compras</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Clientes</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./clientes.html" class="admin-sidebar__item">Clientes</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Sistema</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./auditoria.html" class="admin-sidebar__item">Auditoria</a>' +
        '</nav>' +
        '<div class="admin-sidebar__secao">Configurações</div>' +
        '<nav class="admin-sidebar__lista">' +
          '<a href="./empresa.html" class="admin-sidebar__item">Dados da empresa</a>' +
          '<a href="./identidade.html" class="admin-sidebar__item">Identidade visual</a>' +
          '<a href="./configuracoes.html" class="admin-sidebar__item">Outras configurações</a>' +
        '</nav>' +
        '<div class="admin-sidebar__rodape">' +
          '<a href="../index.html">← Ver loja</a>' +
        '</div>';

      document.getElementById('admin-sidebar').innerHTML = menuHTML;

      const btn = document.getElementById('admin-menu-btn');
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('admin-sidebar-overlay');
      if (btn) {
        btn.onclick = function() {
          sidebar.classList.toggle('aberta');
          overlay.classList.toggle('ativa');
        };
        overlay.onclick = function() {
          sidebar.classList.remove('aberta');
          overlay.classList.remove('ativa');
        };
      }
    }

    function calcularDatas() {
      const hoje = new Date();
      const inicio = new Date();
      let fim = new Date();

      if (periodo === 'hoje') {
        return { inicio: hoje.toISOString().slice(0, 10), fim: hoje.toISOString().slice(0, 10) };
      }

      if (periodo === '7dias') {
        inicio.setDate(inicio.getDate() - 6);
        return { inicio: inicio.toISOString().slice(0, 10), fim: hoje.toISOString().slice(0, 10) };
      }

      if (periodo === 'mes') {
        inicio.setDate(1);
        return { inicio: inicio.toISOString().slice(0, 10), fim: hoje.toISOString().slice(0, 10) };
      }

      if (periodo === 'mes_anterior') {
        inicio.setMonth(inicio.getMonth() - 1);
        inicio.setDate(1);
        fim = new Date(inicio.getFullYear(), inicio.getMonth() + 1, 0);
        return { inicio: inicio.toISOString().slice(0, 10), fim: fim.toISOString().slice(0, 10) };
      }

      return { inicio: document.getElementById('dataInicio').value || null, fim: document.getElementById('dataFim').value || null };
    }

    async function carregar() {
      el.innerHTML = '<div class="carregando" style="padding:60px;"><div class="spinner spinner--lg"></div></div>';

      try {
        const mod = await import('../assets/js/services/reports.service.js');
        const datas = calcularDatas();

        const kpis = await mod.kpisDashboard(datas);
        const topProdutos = await mod.produtosMaisVendidos({ limite: 8 });

        el.innerHTML =
          // KPIs principais
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;">' +
            kpiCard('💰 Faturamento', 'R$ ' + kpis.faturamento.toFixed(2), '#0ea5e9') +
            kpiCard('🛒 Vendas', kpis.vendas, '#0ea5e9') +
            kpiCard('📊 Ticket médio', 'R$ ' + kpis.ticketMedio.toFixed(2), '#0ea5e9') +
            kpiCard('📋 Orçamentos pendentes', kpis.orcamentosPendentes, '#f59e0b') +
          '</div>' +

          // KPIs secundários
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;">' +
            kpiCard('🛍️ Compras', 'R$ ' + kpis.totalCompras.toFixed(2), '#f97316') +
            kpiCard('📥 A receber', 'R$ ' + kpis.contasReceber.toFixed(2), '#16a34a') +
            kpiCard('📤 A pagar', 'R$ ' + kpis.contasPagar.toFixed(2), '#dc2626') +
            kpiCard('📦 Valor em estoque', 'R$ ' + kpis.valorEstoque.toFixed(2), '#8b5cf6') +
          '</div>' +

          // Lucro bruto destacado
          '<div style="background:' + (kpis.lucroBruto >= 0 ? '#f0fdf4' : '#fef2f2') + ';border:1px solid ' + (kpis.lucroBruto >= 0 ? '#86efac' : '#fca5a5') + ';border-radius:12px;padding:24px;margin-bottom:24px;">' +
            '<div style="font-size:12px;text-transform:uppercase;color:#64748b;font-weight:600;margin-bottom:8px;">Lucro bruto estimado</div>' +
            '<div style="font-size:36px;font-weight:700;color:' + (kpis.lucroBruto >= 0 ? '#16a34a' : '#dc2626') + ';">R$ ' + kpis.lucroBruto.toFixed(2) + '</div>' +
            '<div style="font-size:12px;color:#64748b;margin-top:8px;">Faturamento (' + kpis.faturamento.toFixed(2) + ') − Compras recebidas (' + kpis.totalCompras.toFixed(2) + ')</div>' +
          '</div>' +

          // Top produtos (lista)
          (topProdutos.length
            ? '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">' +
                '<h3 style="font-size:16px;margin-bottom:16px;">🏆 Produtos mais vendidos</h3>' +
                topProdutos.map(function(p) {
                  return '<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9;">' +
                    '<div><strong>' + esc(p.nome) + '</strong></div>' +
                    '<div style="color:#64748b;font-size:14px;">' + p.quantidade + ' un · R$ ' + p.total.toFixed(2) + '</div>' +
                  '</div>';
                }).join('') +
              '</div>'
            : '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:40px;text-align:center;color:#64748b;">' +
                '<div style="font-size:40px;margin-bottom:12px;">📊</div>' +
                '<div style="font-size:16px;font-weight:600;color:#0f172a;margin-bottom:4px;">Sem dados ainda</div>' +
                '<div style="font-size:13px;">Quando houver vendas, os produtos mais vendidos aparecerão aqui.</div>' +
              '</div>');

      } catch (e) {
        console.error(e);
        el.innerHTML = '<div style="padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;font-family:monospace;">Erro: ' + esc(e.message) + '</div>';
      }
    }

    function kpiCard(rotulo, valor, cor) {
      return '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">' +
        '<div style="font-size:12px;text-transform:uppercase;color:#64748b;font-weight:600;margin-bottom:8px;">' + rotulo + '</div>' +
        '<div style="font-size:24px;font-weight:700;color:' + cor + ';line-height:1.1;">' + valor + '</div>' +
      '</div>';
    }
  </script>
</body>
</html>
