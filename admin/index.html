<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Admin</title>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/store.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div id="admin-sidebar-overlay" class="admin-sidebar-overlay"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button id="admin-menu-btn" class="admin-topbar__menu-btn" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="admin-topbar__titulo">Dashboard</h1>
        <div class="admin-topbar__acoes">
          <a href="../index.html" class="btn btn--contorno btn--sm" target="_blank">Ver loja</a>
        </div>
      </header>

      <div class="admin-conteudo">
        <p class="admin-pagina-sub">
          Visão geral da sua loja. Os números atualizam automaticamente.
        </p>

        <div id="admin-cards" class="admin-cards"></div>

        <section class="admin-secao">
          <div class="admin-secao__cabecalho">
            <h2 class="admin-secao__titulo">Últimos pedidos</h2>
            <a href="./pedidos.html" class="texto-sm">Ver todos</a>
          </div>
          <div class="admin-secao__corpo" id="admin-ultimos-pedidos">
            <div class="admin-lista-vazia">Carregando...</div>
          </div>
        </section>

        <section class="admin-secao">
          <div class="admin-secao__cabecalho">
            <h2 class="admin-secao__titulo">Últimas propostas</h2>
            <a href="./propostas.html" class="texto-sm">Ver todas</a>
          </div>
          <div class="admin-secao__corpo" id="admin-ultimas-propostas">
            <div class="admin-lista-vazia">Carregando...</div>
          </div>
        </section>

        <section class="admin-secao">
          <div class="admin-secao__cabecalho">
            <h2 class="admin-secao__titulo">Últimas conversas</h2>
            <a href="./conversas.html" class="texto-sm">Ver todas</a>
          </div>
          <div class="admin-secao__corpo" id="admin-ultimas-conversas">
            <div class="admin-lista-vazia">Carregando...</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/pages/admin-dashboard.js"></script>
</body>
</html>
