<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .topbar h1 { font-size: 18px; }
    .btn-loja { padding: 8px 14px; border: 1px solid #0ea5e9; border-radius: 8px; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn-loja:hover { background: #0ea5e9; color: #fff; }
    .conteudo { padding: 24px; }
    .cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .card__rotulo { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 8px; }
    .card__valor { font-size: 30px; font-weight: 700; line-height: 1; }
    .secao { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 16px; }
    .secao__titulo { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; font-size: 15px; font-weight: 600; }
    .secao__vazio { padding: 24px; text-align: center; color: #94a3b8; font-size: 14px; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin: 20px; font-family: monospace; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item ativo">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>
      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
        <a href="./produtos-destaque.html" class="sidebar__item">Destaques e promoções</a>
      </nav>
      <div class="sidebar__secao">Clientes</div>
      <nav class="sidebar__lista">
        <a href="./clientes.html" class="sidebar__item">Clientes</a>
      </nav>
      <div class="sidebar__secao">Configurações</div>
      <nav class="sidebar__lista">
        <a href="./empresa.html" class="sidebar__item">Dados da empresa</a>
        <a href="./identidade.html" class="sidebar__item">Identidade visual</a>
        <a href="./configuracoes.html" class="sidebar__item">Outras configurações</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <a href="../index.html" class="btn-loja">← Ver loja</a>
      </header>
      <div class="conteudo">
        <div id="conteudo"><div class="secao__vazio">Carregando...</div></div>
      </div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const erro = (msg) => el.innerHTML = '<div class="erro">❌ ' + msg + '</div>';

    (async () => {
      try {
        const { supabase } = await import('../assets/js/supabase.js');

        const r = await supabase.auth.getSession();
        const session = r.data ? r.data.session : null;
        if (!session) { location.href = '../login.html'; return; }

        const p = await supabase.from('profiles').select('role, nome').eq('id', session.user.id).maybeSingle();
        if (!p.data || p.data.role !== 'admin') { erro('Acesso restrito a administradores'); return; }

        const contar = async (tabela, filtro) => {
          let q = supabase.from(tabela).select('*', { count: 'exact', head: true });
          if (filtro) Object.entries(filtro).forEach(([k, v]) => q = q.eq(k, v));
          const { count } = await q;
          return count || 0;
        };

        const resultados = await Promise.all([
          contar('products'), contar('orders'), contar('proposals'), contar('profiles')
        ]);

        el.innerHTML =
          '<div class="cards">' +
            '<div class="card"><div class="card__rotulo">Produtos</div><div class="card__valor">' + resultados[0] + '</div></div>' +
            '<div class="card"><div class="card__rotulo">Pedidos</div><div class="card__valor">' + resultados[1] + '</div></div>' +
            '<div class="card"><div class="card__rotulo">Propostas</div><div class="card__valor">' + resultados[2] + '</div></div>' +
            '<div class="card"><div class="card__rotulo">Clientes</div><div class="card__valor">' + resultados[3] + '</div></div>' +
          '</div>' +
          '<div class="secao"><div class="secao__titulo">Últimos pedidos</div><div class="secao__vazio">Nenhum pedido ainda.</div></div>' +
          '<div class="secao"><div class="secao__titulo">Últimas propostas</div><div class="secao__vazio">Nenhuma proposta ainda.</div></div>' +
          '<div class="secao"><div class="secao__titulo">Últimas conversas</div><div class="secao__vazio">Nenhuma conversa ainda.</div></div>' +
          '<div style="margin-top:24px;padding:12px;background:#dcfce7;color:#166534;border-radius:8px;text-align:center;font-size:13px;">✅ Logado como <strong>' + session.user.email + '</strong></div>';
      } catch (e) {
        console.error(e);
        erro(e.message);
      }
    })();
  </script>
</body>
</html>
