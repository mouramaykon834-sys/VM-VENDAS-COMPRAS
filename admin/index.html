<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Loja — Produtos e ofertas</title>
  <meta name="description" content="Loja virtual com produtos novos, usados e seminovos." />

  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>

  <main class="conteudo">
    <div class="container">
      <section class="banner-home" id="banner">
        <div class="banner-home__conteudo">
          <h1 class="banner-home__titulo" id="home-titulo">Bem-vindo à nossa loja</h1>
          <p class="banner-home__subtitulo" id="home-subtitulo">Encontre produtos novos, usados e seminovos com preços imperdíveis.</p>
          <a href="./produtos.html" class="btn btn--destaque btn--lg">Ver todos os produtos</a>
        </div>
      </section>

      <section class="secao">
        <div class="secao__cabecalho">
          <h2 class="secao__titulo">Produtos em destaque</h2>
          <a href="./produtos.html" class="secao__link">Ver todos</a>
        </div>
        <div class="grid grid-4" id="lista-destaques"><div class="carregando" style="grid-column:1/-1;"><div class="spinner"></div></div></div>
      </section>

      <section class="secao">
        <div class="secao__cabecalho">
          <h2 class="secao__titulo">Ofertas</h2>
          <a href="./produtos.html?ordenar=menor-preco" class="secao__link">Ver todas</a>
        </div>
        <div class="grid grid-4" id="lista-ofertas"><div class="carregando" style="grid-column:1/-1;"><div class="spinner"></div></div></div>
      </section>

      <section class="secao">
        <div class="secao__cabecalho">
          <h2 class="secao__titulo">Novidades</h2>
          <a href="./produtos.html?ordenar=recentes" class="secao__link">Ver todas</a>
        </div>
        <div class="grid grid-4" id="lista-recentes"><div class="carregando" style="grid-column:1/-1;"><div class="spinner"></div></div></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module">
    Promise.all([
      import('./assets/js/components/header.js').then(m => m.renderHeader('inicio')).catch(e => console.error('[header]', e)),
      import('./assets/js/components/footer.js').then(m => m.renderFooter()).catch(e => console.error('[footer]', e))
    ]);

    (async () => {
      try {
        const mod = await import('./assets/js/services/settings.service.js');
        const cfg = await mod.iniciarConfiguracoes();
        const store = cfg.store || {};
        if (store.banner_home_url) {
          const b = document.getElementById('banner');
          b.style.background = 'linear-gradient(rgba(15,23,42,.4), rgba(15,23,42,.6)), url(' + store.banner_home_url + ') center/cover';
        }
        if (store.titulo_home) document.getElementById('home-titulo').textContent = store.titulo_home;
        if (store.subtitulo_home) document.getElementById('home-subtitulo').textContent = store.subtitulo_home;
      } catch (e) {}
    })();

    (async () => {
      try {
        const mod = await import('./assets/js/services/products.service.js');
        await Promise.all([
          carregarSecao('lista-destaques', mod.listarDestaques, 'Nenhum produto em destaque ainda', mod),
          carregarSecao('lista-ofertas', mod.listarOfertas, 'Nenhuma oferta no momento', mod),
          carregarSecao('lista-recentes', mod.listarRecentes, 'Nenhum produto cadastrado ainda', mod)
        ]);
      } catch (e) {}
    })();

    async function carregarSecao(id, fn, textoVazio, mod) {
      const el = document.getElementById(id);
      try {
        const produtos = await Promise.race([
          fn(8),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
        ]);
        if (!produtos || !produtos.length) {
          el.innerHTML = '<div class="estado-vazio" style="grid-column:1/-1;"><div class="estado-vazio__titulo">' + textoVazio + '</div><p class="estado-vazio__descricao">Em breve novos produtos.</p></div>';
          return;
        }
        el.innerHTML = produtos.map(p => cardProduto(p, mod)).join('');
      } catch (e) {
        el.innerHTML = '<div class="estado-vazio" style="grid-column:1/-1;"><div class="estado-vazio__titulo">' + textoVazio + '</div></div>';
      }
    }

    function cardProduto(p, mod) {
      const disp = mod.rotuloDisponibilidade(p);
      const img = p.imagemPrincipal
        ? '<img src="' + p.imagemPrincipal + '" alt="" loading="lazy" />'
        : '<div class="produto-card__sem-imagem"></div>';
      const preco = p.temPromo
        ? '<div class="produto-card__preco-antigo">R$ ' + p.preco.toFixed(2) + '</div><div class="produto-card__preco produto-card__preco--promo">R$ ' + p.precoPromocional.toFixed(2) + '</div>'
        : '<div class="produto-card__preco">R$ ' + p.preco.toFixed(2) + '</div>';
      return '<article class="produto-card">' +
        '<a href="./produto.html?id=' + p.id + '" class="produto-card__imagem">' + img +
          '<div class="produto-card__selos">' +
            (p.temPromo ? '<span class="badge badge--destaque">-' + p.descontoPct + '%</span>' : '') +
            (p.destaque ? '<span class="badge badge--principal">Destaque</span>' : '') +
          '</div>' +
        '</a>' +
        '<div class="produto-card__info">' +
          '<div class="produto-card__condicao">' + mod.rotuloCondicao(p.condicao) + '</div>' +
          '<a href="./produto.html?id=' + p.id + '" class="produto-card__nome">' + esc(p.nome) + '</a>' +
          preco +
          '<div><span class="badge badge--' + disp.tipo + '">' + disp.texto + '</span></div>' +
          '<div class="produto-card__acoes">' +
            '<a href="./produto.html?id=' + p.id + '" class="btn btn--principal btn--sm">Comprar</a>' +
            '<a href="./produto.html?id=' + p.id + '#proposta" class="btn btn--contorno btn--sm">Proposta</a>' +
          '</div>' +
        '</div>' +
      '</article>';
    }

    function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  </script>
</body>
</html>
