<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }

    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #cbd5e1; font-size: 14px; text-decoration: none; transition: background 120ms; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }

    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: 18px; }
    .topbar a { color: #0ea5e9; font-size: 14px; text-decoration: none; }

    .conteudo { padding: 24px; }
    .subtitulo { color: #64748b; font-size: 14px; margin-bottom: 24px; }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .card__rotulo { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 8px; }
    .card__valor { font-size: 30px; font-weight: 700; color: #0f172a; line-height: 1; }
    .card__nota { font-size: 12px; color: #64748b; margin-top: 4px; }

    .secao { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 16px; }
    .secao__titulo { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; font-size: 15px; font-weight: 600; }
    .secao__vazio { padding: 24px; text-align: center; color: #94a3b8; font-size: 14px; }

    .aviso { padding: 20px; background: #fef3c7; color: #92400e; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin-bottom: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__logo">
        <span>🏠</span>
        <span>Minha Loja</span>
        <span class="sidebar__badge">ADMIN</span>
      </div>

      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item ativo">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>

      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
      </nav>

      <div class="sidebar__secao">Configurações</div>
      <nav class="sidebar__lista">
        <a href="./empresa.html" class="sidebar__item">Dados da empresa</a>
        <a href="./identidade.html" class="sidebar__item">Identidade visual</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <a href="../index.html" target="_blank">Ver loja →</a>
      </header>

      <div class="conteudo">
        <p class="subtitulo">Visão geral da sua loja.</p>

        <div id="conteudo">
          <div class="aviso">⏳ Carregando dados...</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');

    function erro(titulo, detalhe) {
      el.innerHTML = `
        <div class="erro"><strong>❌ ${titulo}</strong>\n\n${detalhe}</div>
      `;
    }

    try {
      // 1. Importa o supabase
      const { supabase } = await import('../assets/js/supabase.js');
      console.log('[dashboard] supabase importado');

      // 2. Verifica sessão
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        erro('Não autenticado', 'Você precisa fazer login. Redirecionando em 3 segundos...');
        setTimeout(() => { window.location.href = '../login.html'; }, 3000);
        throw new Error('sem sessão');
      }
      console.log('[dashboard] logado como', session.user.email);

      // 3. Verifica se é admin
      const { data: perfil, error: errPerfil } = await supabase
        .from('profiles')
        .select('role, nome')
        .eq('id', session.user.id)
        .maybeSingle();

      if (errPerfil || !perfil) {
        erro('Perfil não encontrado', JSON.stringify(errPerfil || {}, null, 2));
        throw new Error('sem perfil');
      }

      if (perfil.role !== 'admin') {
        erro('Acesso restrito', `Seu perfil tem role="${perfil.role}". Apenas admin pode acessar.`);
        throw new Error('não é admin');
      }
      console.log('[dashboard] é admin ✅');

      // 4. Conta registros
      const contar = async (tabela) => {
        const { count, error } = await supabase
          .from(tabela)
          .select('*', { count: 'exact', head: true });
        if (error) { console.warn('Erro ao contar', tabela, error.message); return 0; }
        return count || 0;
      };

      const [produtos, pedidos, propostas, clientes] = await Promise.all([
        contar('products'),
        contar('orders'),
        contar('proposals'),
        contar('profiles')
      ]);
      console.log('[dashboard] contagens carregadas');

      // 5. Renderiza o conteúdo final
      el.innerHTML = `
        <div class="cards">
          <div class="card">
            <div class="card__rotulo">Produtos</div>
            <div class="card__valor">${produtos}</div>
            <div class="card__nota">cadastrados</div>
          </div>
          <div class="card">
            <div class="card__rotulo">Pedidos</div>
            <div class="card__valor">${pedidos}</div>
            <div class="card__nota">total</div>
          </div>
          <div class="card">
            <div class="card__rotulo">Propostas</div>
            <div class="card__valor">${propostas}</div>
            <div class="card__nota">total</div>
          </div>
          <div class="card">
            <div class="card__rotulo">Clientes</div>
            <div class="card__valor">${clientes}</div>
            <div class="card__nota">cadastrados</div>
          </div>
        </div>

        <div class="secao">
          <div class="secao__titulo">Últimos pedidos</div>
          <div class="secao__vazio">Nenhum pedido ainda.</div>
        </div>

        <div class="secao">
          <div class="secao__titulo">Últimas propostas</div>
          <div class="secao__vazio">Nenhuma proposta ainda.</div>
        </div>

        <div class="secao">
          <div class="secao__titulo">Últimas conversas</div>
          <div class="secao__vazio">Nenhuma conversa ainda.</div>
        </div>

        <div style="margin-top:24px;padding:12px;background:#dcfce7;color:#166534;border-radius:8px;font-size:13px;text-align:center;">
          ✅ Logado como <strong>${session.user.email}</strong> (${perfil.nome || 'admin'})
        </div>
      `;
      console.log('[dashboard] renderizado ✅');

    } catch (e) {
      console.error('[dashboard] ERRO:', e);
      if (!el.innerHTML.includes('erro')) {
        erro('Erro inesperado', e.message + '\n\n' + (e.stack || ''));
      }
    }
  </script>
</body>
</html>
