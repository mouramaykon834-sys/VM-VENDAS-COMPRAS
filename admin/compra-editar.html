<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Editar compra — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .topbar h1 { font-size: 18px; }
    .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn:hover { filter: brightness(.94); }
    .btn--fantasma { background: transparent; color: #0ea5e9; }
    .btn--perigo { background: transparent; color: #dc2626; border-color: transparent; padding: 6px 10px; }
    .conteudo { padding: 24px; }
    .bloco { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .bloco h2 { font-size: 15px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .campo input, .campo textarea, .campo select { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .linha-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .linha-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .itens { background: #f8fafc; border-radius: 8px; padding: 12px; }
    .item-linha { display: grid; grid-template-columns: 2fr 1fr 1fr 40px; gap: 8px; margin-bottom: 8px; align-items: end; }
    .item-linha input, .item-linha select { padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; }
    .item-remover { background: transparent; border: none; color: #dc2626; cursor: pointer; font-size: 20px; padding: 6px; }
    .totais { text-align: right; padding: 12px; }
    .totais__linha { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 6px; font-size: 14px; }
    .totais__linha strong { min-width: 100px; text-align: right; }
    .totais__total { font-size: 18px; font-weight: 700; border-top: 2px solid #e2e8f0; padding-top: 10px; margin-top: 6px; }
    .status { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-top: 12px; display: none; }
    .status.visivel { display: block; }
    .status--ok { background: #dcfce7; color: #166534; }
    .status--err { background: #fee2e2; color: #991b1b; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin: 20px; font-family: monospace; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .item-linha { grid-template-columns: 1fr; } .linha-2, .linha-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item">Dashboard</a>
      </nav>
      <div class="sidebar__secao">Compras</div>
      <nav class="sidebar__lista">
        <a href="./fornecedores.html" class="sidebar__item">Fornecedores</a>
        <a href="./compras.html" class="sidebar__item ativo">Compras</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="titulo">Nova compra</h1>
        <div style="display:flex;gap:8px;">
          <a href="./compras.html" class="btn btn--fantasma">← Voltar</a>
          <button class="btn" id="btn-salvar-topo">Salvar</button>
        </div>
      </header>

      <div id="carregando" style="padding:40px;text-align:center;color:#64748b;">
        <div style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#0ea5e9;border-radius:50%;margin:0 auto 12px;animation:spin .7s linear infinite;"></div>
        Carregando...
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>

      <form class="conteudo" id="form" style="display:none;">
        <div class="bloco">
          <h2>Dados da compra</h2>
          <div class="linha-2">
            <div class="campo"><label>Fornecedor</label><select id="supplier_id"><option value="">Carregando...</option></select></div>
            <div class="campo"><label>Status</label>
              <select id="status">
                <option value="rascunho">Rascunho</option>
                <option value="solicitada">Solicitada</option>
                <option value="aguardando">Aguardando recebimento</option>
              </select>
            </div>
          </div>
          <div class="linha-2">
            <div class="campo"><label>Data do pedido</label><input type="date" id="data_pedido" /></div>
            <div class="campo"><label>Previsão de entrega</label><input type="date" id="data_previsao" /></div>
          </div>
          <div class="campo"><label>Condição de pagamento</label><input type="text" id="condicao_pagamento" placeholder="Ex: 30/60/90 dias" /></div>
          <div class="campo"><label>Prazo de entrega</label><input type="text" id="prazo_entrega" placeholder="Ex: 5 dias úteis" /></div>
          <div class="campo"><label>Observações</label><textarea id="observacoes" rows="2"></textarea></div>
        </div>

        <div class="bloco">
          <h2>Itens da compra</h2>
          <div class="itens">
            <div id="lista-itens"></div>
            <button type="button" class="btn btn--fantasma" id="btn-add-item" style="margin-top:8px;">+ Adicionar item</button>
          </div>

          <div class="totais">
            <div class="totais__linha"><span>Subtotal:</span><strong id="t-subtotal">R$ 0,00</strong></div>
            <div class="totais__linha"><span>Desconto:</span><input type="number" id="desconto" min="0" step="0.01" value="0" style="width:100px;text-align:right;" /></div>
            <div class="totais__linha"><span>Frete:</span><input type="number" id="frete" min="0" step="0.01" value="0" style="width:100px;text-align:right;" /></div>
            <div class="totais__linha totais__total"><span>Total:</span><strong id="t-total">R$ 0,00</strong></div>
          </div>
        </div>

        <button type="submit" class="btn" id="btn-salvar" style="width:100%;padding:14px;font-size:15px;">Salvar compra</button>
        <div class="status" id="status-msg"></div>
      </form>
    </main>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const idEdicao = params.get('id');
    const editando = !!idEdicao;
    const $ = id => document.getElementById(id);
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });

    let supabase;
    let fornecedores = [];
    let produtos = [];

    (async () => {
      try {
        const mod = await import('../assets/js/supabase.js');
        supabase = mod.supabase;

        const r = await supabase.auth.getSession();
        if (!r.data || !r.data.session) { location.href = '../login.html'; return; }

        // Carrega dados auxiliares
        const supMod = await import('../assets/js/services/suppliers.service.js');
        fornecedores = await supMod.listarFornecedores({ somenteAtivos: true });
        $('supplier_id').innerHTML = '<option value="">Escolha o fornecedor...</option>' +
          fornecedores.map(function(f) { return '<option value="' + f.id + '">' + esc(f.nome) + '</option>'; }).join('');

        const prodMod = await supabase.from('products').select('id, nome, preco').order('nome');
        produtos = prodMod.data || [];

        // Data de hoje
        $('data_pedido').value = new Date().toISOString().slice(0, 10);

        if (editando) {
          $('titulo').textContent = 'Editar compra';
          const mod2 = await import('../assets/js/services/purchases.service.js');
          const c = await mod2.buscarCompra(idEdicao);
          if (!c) { document.body.innerHTML = '<div class="erro">Compra não encontrada.</div>'; return; }
          $('supplier_id').value = c.supplier_id || '';
          $('status').value = c.status || 'rascunho';
          $('data_pedido').value = c.data_pedido || '';
          $('data_previsao').value = c.data_previsao || '';
          $('condicao_pagamento').value = c.condicao_pagamento || '';
          $('prazo_entrega').value = c.prazo_entrega || '';
          $('observacoes').value = c.observacoes || '';
          $('desconto').value = c.desconto || 0;
          $('frete').value = c.frete || 0;

          (c.purchase_items || []).forEach(function(item) {
            adicionarItem(item);
          });
        } else {
          adicionarItem();
        }

        $('carregando').style.display = 'none';
        $('form').style.display = 'block';

        $('btn-add-item').onclick = function() { adicionarItem(); };
        $('desconto').oninput = calcularTotais;
        $('frete').oninput = calcularTotais;

        $('form').onsubmit = salvar;
        $('btn-salvar-topo').onclick = function(e) { e.preventDefault(); salvar(); };

        calcularTotais();
      } catch (e) {
        document.body.innerHTML = '<div class="erro">Erro: ' + esc(e.message) + '</div>';
      }
    })();

    function adicionarItem(item) {
      const lista = $('lista-itens');
      const div = document.createElement('div');
      div.className = 'item-linha';
      div.innerHTML =
        '<div>' +
          '<label style="font-size:11px;color:#64748b;display:block;margin-bottom:2px;">Produto</label>' +
          '<select class="item-produto">' +
            '<option value="">— Selecione —</option>' +
            produtos.map(function(p) { return '<option value="' + p.id + '"' + (item && item.product_id === p.id ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') +
            '<option value="__manual__"' + (item && !item.product_id && item.product_nome ? ' selected' : '') + '>Digitar manualmente</option>' +
          '</select>' +
          '<input type="text" class="item-nome-manual" placeholder="Nome do produto" style="margin-top:4px;display:none;" value="' + (item && !item.product_id ? esc(item.product_nome) : '') + '" />' +
        '</div>' +
        '<div><label style="font-size:11px;color:#64748b;display:block;margin-bottom:2px;">Custo un.</label><input type="number" class="item-custo" min="0" step="0.01" value="' + (item ? item.custo_unitario : 0) + '" /></div>' +
        '<div><label style="font-size:11px;color:#64748b;display:block;margin-bottom:2px;">Qtd</label><input type="number" class="item-qtd" min="1" value="' + (item ? item.quantidade : 1) + '" /></div>' +
        '<button type="button" class="item-remover">×</button>';

      lista.appendChild(div);

      const sel = div.querySelector('.item-produto');
      const manual = div.querySelector('.item-nome-manual');

      sel.onchange = function() {
        if (sel.value === '__manual__') {
          manual.style.display = 'block';
        } else {
          manual.style.display = 'none';
          if (sel.value) {
            const p = produtos.find(function(x) { return x.id === sel.value; });
            if (p && !div.querySelector('.item-custo').value) div.querySelector('.item-custo').value = p.preco || 0;
          }
        }
      };

      if (item && !item.product_id && item.product_nome) {
        manual.style.display = 'block';
      }

      div.querySelector('.item-custo').oninput = calcularTotais;
      div.querySelector('.item-qtd').oninput = calcularTotais;

      div.querySelector('.item-remover').onclick = function() {
        div.remove();
        calcularTotais();
      };

      calcularTotais();
    }

    function calcularTotais() {
      let subtotal = 0;
      document.querySelectorAll('.item-linha').forEach(function(div) {
        const custo = Number(div.querySelector('.item-custo').value) || 0;
        const qtd = Number(div.querySelector('.item-qtd').value) || 0;
        subtotal += custo * qtd;
      });

      const desconto = Number($('desconto').value) || 0;
      const frete = Number($('frete').value) || 0;
      const total = subtotal - desconto + frete;

      $('t-subtotal').textContent = 'R$ ' + subtotal.toFixed(2);
      $('t-total').textContent = 'R$ ' + total.toFixed(2);
    }

    async function salvar() {
      const itens = [];
      let erro = false;

      document.querySelectorAll('.item-linha').forEach(function(div) {
        const sel = div.querySelector('.item-produto');
        const manual = div.querySelector('.item-nome-manual');
        const custo = Number(div.querySelector('.item-custo').value) || 0;
        const qtd = Number(div.querySelector('.item-qtd').value) || 0;

        let product_id = null;
        let product_nome = '';

        if (sel.value === '__manual__' || !sel.value) {
          product_nome = manual.value.trim();
          if (!product_nome) { erro = true; return; }
        } else {
          product_id = sel.value;
          const p = produtos.find(function(x) { return x.id === sel.value; });
          product_nome = p ? p.nome : 'Produto';
        }

        if (qtd <= 0) { erro = true; return; }

        itens.push({ product_id, product_nome, custo_unitario: custo, quantidade: qtd });
      });

      if (erro || !itens.length) {
        mostrarStatus('Preencha todos os itens corretamente.', 'err');
        return;
      }

      const supplierId = $('supplier_id').value;
      const supplierNome = supplierId ? (fornecedores.find(function(f) { return f.id === supplierId; }) || {}).nome : null;

      const dados = {
        supplier_id: supplierId || null,
        supplier_nome: supplierNome || null,
        status: $('status').value,
        data_pedido: $('data_pedido').value,
        data_previsao: $('data_previsao').value || null,
        condicao_pagamento: $('condicao_pagamento').value,
        prazo_entrega: $('prazo_entrega').value,
        observacoes: $('observacoes').value,
        desconto: Number($('desconto').value) || 0,
        frete: Number($('frete').value) || 0
      };

      const btn = $('btn-salvar');
      const btnTopo = $('btn-salvar-topo');
      btn.disabled = true; btnTopo.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const mod = await import('../assets/js/services/purchases.service.js');
        const id = await mod.salvarCompra(dados, itens, idEdicao);
        mostrarStatus('✅ Compra salva!', 'ok');
        setTimeout(function() { location.href = './compra.html?id=' + id; }, 800);
      } catch (e) {
        mostrarStatus('❌ ' + e.message, 'err');
        btn.disabled = false; btnTopo.disabled = false; btn.textContent = 'Salvar compra';
      }
    }

    function mostrarStatus(msg, tipo) {
      const st = $('status-msg');
      st.textContent = msg;
      st.className = 'status visivel status--' + tipo;
    }
  </script>
</body>
</html>
