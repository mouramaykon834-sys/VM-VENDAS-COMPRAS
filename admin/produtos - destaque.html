<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Destaques e promoções — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { font-size: 18px; }
    .btn-loja { padding: 8px 14px; border: 1px solid #0ea5e9; border-radius: 8px; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn-loja:hover { background: #0ea5e9; color: #fff; }
    .conteudo { padding: 24px; }
    .abas { display: flex; gap: 4px; border-bottom: 1px solid #e2e8f0; margin-bottom: 20px; overflow-x: auto; }
    .aba { padding: 12px 20px; font-size: 14px; font-weight: 600; color: #64748b; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .aba.ativa { color: #0ea5e9; border-bottom-color: #0ea5e9; }
    .info-bloco { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .info-bloco h2 { font-size: 15px; margin-bottom: 4px; }
    .info-bloco p { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .lista-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .mini-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all .15s; position: relative; }
    .mini-card:hover { border-color: #0ea5e9; transform: translateY(-2px); }
    .mini-card.marcado { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
    .mini-card__img { aspect-ratio: 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .mini-card__img img { width: 100%; height: 100%; object-fit: cover; }
    .mini-card__nome { padding: 8px 10px; font-size: 12px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
    .mini-card__preco { padding: 0 10px 10px; font-size: 13px; font-weight: 700; color: #0f172a; }
    .mini-card__check { position: absolute; top: 6px; right: 6px; background: #0ea5e9; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .mini-card.marcado .mini-card__check { display: flex; }
    .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn:hover { filter: brightness(.94); }
    .btn--fantasma { background: transparent; color: #0ea5e9; }
    .status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
    .status.visivel { display: block; }
    .status--ok { background: #dcfce7; color: #166534; }
    .status--err { background: #fee2e2; color: #991b1b; }
    .vazio { background: #fff; padding: 60px 24px; text-align: center; border-radius: 12px; border: 1px solid #e2e8f0; color: #64748b; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin: 20px; font-family: monospace; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>
      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
        <a href="./produtos-destaque.html" class="sidebar__item ativo">Destaques e promoções</a>
      </nav>
      <div class="sidebar__secao">Clientes</div>
      <nav class="sidebar__lista">
        <a href="./clientes.html" class="sidebar__item">Clientes</a>
      </nav>
      <div class="sidebar__secao">Configurações</div>
      <nav class="sidebar__lista">
        <a href="./empresa.html" class="sidebar__item">Dados da empresa</a>
        <a href="./identidade.html" class="sidebar__item">Identidade visual</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Destaques e promoções</h1>
        <a href="../index.html" class="btn-loja">← Ver loja</a>
      </header>

      <div class="conteudo" id="conteudo">
        <div class="vazio">Carregando...</div>
      </div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    let supabase;
    let produtos = [];
    let abaAtiva = 'destaque';

    (async () => {
      try {
        const mod = await import('../assets/js/supabase.js');
        supabase = mod.supabase;

        const r = await supabase.auth.getSession();
        const session = r.data ? r.data.session : null;
        if (!session) { location.href = '../login.html'; return; }

        const p = await supabase.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
        if (!p.data || p.data.role !== 'admin') {
          el.innerHTML = '<div class="erro">Acesso restrito a administradores</div>';
          return;
        }

        await carregarProdutos();
        renderTela();
      } catch (e) {
        el.innerHTML = '<div class="erro">Erro: ' + esc(e.message) + '</div>';
      }
    })();

    async function carregarProdutos() {
      const r = await supabase
        .from('products')
        .select('id, nome, preco, preco_promocional, destaque, status, product_images ( url, principal, ordem )')
        .order('created_at', { ascending: false });
      produtos = r.data || [];
    }

    function renderTela() {
      const abas = [
        { id: 'destaque', nome: '⭐ Em destaque' },
        { id: 'promocao', nome: '🔥 Com desconto' },
        { id: 'recentes', nome: '🆕 Novidades' }
      ];

      el.innerHTML =
        '<div class="abas">' +
          abas.map(a => '<button class="aba ' + (abaAtiva === a.id ? 'ativa' : '') + '" data-aba="' + a.id + '">' + a.nome + '</button>').join('') +
        '</div>' +
        '<div class="info-bloco">' +
          '<h2>' + abas.find(a => a.id === abaAtiva).nome + '</h2>' +
          '<p>' + descricaoAba(abaAtiva) + '</p>' +
          '<button class="btn" id="btn-salvar">💾 Salvar alterações</button>' +
          '<div class="status" id="status"></div>' +
          '<div class="lista-produtos" id="lista-produtos"></div>' +
        '</div>';

      el.querySelectorAll('.aba').forEach(b => {
        b.onclick = () => { abaAtiva = b.dataset.aba; renderTela(); };
      });

      document.getElementById('btn-salvar').onclick = salvar;
      renderLista();
    }

    function descricaoAba(aba) {
      if (aba === 'destaque') return 'Marque os produtos que aparecem em "Produtos em destaque" na home.';
      if (aba === 'promocao') return 'Marque os produtos com preço promocional. Eles aparecem em "Ofertas" na home.';
      return 'Produtos mais recentes aparecem automaticamente em "Novidades". Apenas ordene-os se quiser fixar.';
    }

    function renderLista() {
      const lista = document.getElementById('lista-produtos');
      if (!produtos.length) {
        lista.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px;">Nenhum produto cadastrado. Vá em <a href="./produtos.html">Produtos</a> primeiro.</div>';
        return;
      }

      lista.innerHTML = produtos.map(p => {
        const marcado = marcadoPorAba(p);
        const img = (p.product_images || []).slice().sort((a, b) => (b.principal ? 1 : 0) - (a.principal ? 1 : 0))[0];
        const url = img ? img.url : null;
        const temPromo = p.preco_promocional != null && p.preco_promocional < p.preco;
        return '<div class="mini-card ' + (marcado ? 'marcado' : '') + '" data-id="' + p.id + '">' +
          '<div class="mini-card__check">✓</div>' +
          '<div class="mini-card__img">' + (url ? '<img src="' + url + '" alt="" loading="lazy" />' : '') + '</div>' +
          '<div class="mini-card__nome">' + esc(p.nome) + '</div>' +
          '<div class="mini-card__preco">' +
            (temPromo
              ? '<span style="color:#16a34a;">R$ ' + Number(p.preco_promocional).toFixed(2) + '</span> <span style="font-size:11px;color:#94a3b8;text-decoration:line-through;">R$ ' + Number(p.preco).toFixed(2) + '</span>'
              : 'R$ ' + Number(p.preco).toFixed(2))
          + '</div>' +
        '</div>';
      }).join('');

      lista.querySelectorAll('.mini-card').forEach(card => {
        card.onclick = () => {
          const p = produtos.find(x => x.id === card.dataset.id);
          if (!p) return;
          if (abaAtiva === 'destaque') p.destaque = !p.destaque;
          else if (abaAtiva === 'promocao') {
            if (p.preco_promocional != null) {
              if (confirm('Remover o desconto deste produto?')) p.preco_promocional = null;
            } else {
              const v = prompt('Valor promocional (R$) para "' + p.nome + '":', (Number(p.preco) * 0.9).toFixed(2));
              if (v && !isNaN(Number(v))) p.preco_promocional = Number(v);
            }
          } else {
            return;
          }
          renderLista();
        };
      });
    }

    function marcadoPorAba(p) {
      if (abaAtiva === 'destaque') return !!p.destaque;
      if (abaAtiva === 'promocao') return p.preco_promocional != null && p.preco_promocional < p.preco;
      return false;
    }

    async function salvar() {
      const st = document.getElementById('status');
      st.classList.remove('visivel', 'status--ok', 'status--err');
      const btn = document.getElementById('btn-salvar');
      btn.disabled = true; btn.textContent = 'Salvando...';

      try {
        for (const p of produtos) {
          await supabase.from('products').update({
            destaque: !!p.destaque,
            preco_promocional: p.preco_promocional || null
          }).eq('id', p.id);
        }
        st.className = 'status status--ok visivel';
        st.textContent = '✅ Alterações salvas! Recarregue a loja (Ctrl+Shift+R) para ver.';
      } catch (e) {
        st.className = 'status status--err visivel';
        st.textContent = '❌ ' + e.message;
      }
      btn.disabled = false; btn.textContent = '💾 Salvar alterações';
    }
  </script>
</body>
</html>
