<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Formas de pagamento — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; height: 100vh; overflow-y: auto; position: sticky; top: 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .sidebar__rodape { margin-top: 20px; padding: 16px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar__rodape a { color: #94a3b8; text-decoration: none; font-size: 13px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 90; }
    .sidebar-overlay.ativa { display: block; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
    .topbar h1 { font-size: 18px; flex: 1; }
    .menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 6px; color: #0f172a; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { filter: brightness(.94); }
    .btn--fantasma { background: transparent; color: #0ea5e9; }
    .btn--perigo { background: transparent; color: #dc2626; border-color: transparent; padding: 6px 10px; }
    .btn--loja { padding: 8px 14px; border: 1px solid #0ea5e9; border-radius: 8px; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn--loja:hover { background: #0ea5e9; color: #fff; }
    .conteudo { padding: 24px; }
    .aviso { background: #f0f9ff; border: 1px solid #bae6fd; color: #075985; padding: 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .aviso strong { color: #0c4a6e; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .metodo-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; position: relative; }
    .metodo-card.inativo { opacity: 0.55; }
    .metodo-card__topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .metodo-card__nome { font-size: 17px; font-weight: 600; }
    .metodo-card__tipo { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
    .metodo-card__info { font-size: 13px; color: #475569; line-height: 1.8; margin-bottom: 16px; }
    .metodo-card__info strong { color: #0f172a; }
    .metodo-card__tag { display: inline-block; background: #f1f5f9; color: #475569; font-size: 11px; padding: 3px 8px; border-radius: 9999px; margin-right: 6px; margin-bottom: 4px; }
    .metodo-card__tag--ok { background: #dcfce7; color: #166534; }
    .metodo-card__tag--alerta { background: #fef3c7; color: #92400e; }
    .metodo-card__acoes { display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
    .vazio { background: #fff; padding: 60px 24px; text-align: center; border-radius: 12px; border: 1px solid #e2e8f0; color: #64748b; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; font-family: monospace; font-size: 13px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
    .modal-bg.aberto { display: flex; }
    .modal { background: #fff; border-radius: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
    .campo input, .campo textarea, .campo select { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .campo input:focus, .campo textarea:focus, .campo select:focus { outline: none; border-color: #0ea5e9; }
    .campo__dica { font-size: 12px; color: #94a3b8; margin-top: 4px; display: block; }
    .linha-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .linha-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .check-linha { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .check-linha input { width: auto; margin: 0; accent-color: #0ea5e9; }
    .modal__acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: -280px; top: 0; width: 260px; z-index: 100; transition: left .2s; }
      .sidebar.aberta { left: 0; }
      .menu-btn { display: block; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-overlay" id="admin-sidebar-overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="admin-menu-btn" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1>Formas de pagamento</h1>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="btn-novo">+ Nova forma</button>
          <a href="../index.html" class="btn--loja">← Ver loja</a>
        </div>
      </header>

      <div class="conteudo">
        <div class="aviso">
          <strong>💡 Como funciona:</strong> configure aqui as formas de pagamento que sua loja aceita.
          O cliente vai escolher uma delas no checkout. As parcelas e juros são calculados automaticamente.
        </div>
        <div id="conteudo"><div class="vazio">Carregando...</div></div>
      </div>
    </main>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal" id="modal-corpo"></div>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    let supabase;
    let metodos = [];

    (async () => {
      try {
        const mod = await import('../assets/js/supabase.js');
        const menuMod = await import('../assets/js/components/admin-menu.js');
        supabase = mod.supabase;

        const r = await supabase.auth.getSession();
        if (!r.data || !r.data.session) { location.href = '../login.html'; return; }

        const p = await supabase.from('profiles').select('role').eq('id', r.data.session.user.id).maybeSingle();
        if (!p.data || p.data.role !== 'admin') {
          el.innerHTML = '<div class="erro">Acesso restrito a administradores.</div>';
          return;
        }

        menuMod.renderAdminMenu('pagamentos');
        document.getElementById('btn-novo').onclick = () => abrirModal();
        await carregar();
      } catch (e) {
        el.innerHTML = '<div class="erro">Erro: ' + esc(e.message) + '</div>';
      }
    })();

    async function carregar() {
      el.innerHTML = '<div class="vazio">Carregando...</div>';

      const r = await supabase
        .from('payment_methods')
        .select('*')
        .order('ordem');

      if (r.error) { el.innerHTML = '<div class="erro">' + esc(r.error.message) + '</div>'; return; }
      metodos = r.data || [];

      if (!metodos.length) {
        el.innerHTML = '<div class="vazio"><div style="font-size:18px;font-weight:600;color:#0f172a;margin-bottom:8px;">Nenhuma forma de pagamento</div><p>Clique em "+ Nova forma" para começar.</p></div>';
        return;
      }

      const emojis = { pix: '⚡', cartao: '💳', dinheiro: '💵', boleto: '📄', transferencia: '🏦' };

      el.innerHTML = '<div class="cards-grid">' +
        metodos.map(function(m) {
          const tags = [];
          tags.push(`<span class="metodo-card__tag">${m.tipo}</span>`);
          if (m.ativo) tags.push('<span class="metodo-card__tag metodo-card__tag--ok">Ativo</span>');
          else tags.push('<span class="metodo-card__tag">Inativo</span>');
          if (m.permite_parcelar) tags.push(`<span class="metodo-card__tag metodo-card__tag--alerta">Até ${m.max_parcelas}x</span>`);
          if (Number(m.desconto_pct) > 0) tags.push(`<span class="metodo-card__tag metodo-card__tag--ok">${m.desconto_pct}% off</span>`);

          return `
            <div class="metodo-card ${m.ativo ? '' : 'inativo'}">
              <div class="metodo-card__topo">
                <div>
                  <div class="metodo-card__tipo">${emojis[m.tipo] || '💰'} ${m.tipo}</div>
                  <div class="metodo-card__nome">${esc(m.nome)}</div>
                </div>
              </div>
              <div class="metodo-card__info">
                ${m.descricao ? esc(m.descricao) + '<br>' : ''}
                ${m.permite_parcelar
                  ? `<strong>Parcelamento:</strong> até ${m.max_parcelas}x · mín. R$ ${Number(m.parcela_minima).toFixed(2)}${Number(m.juros_por_parcela) > 0 ? ` · juros ${m.juros_por_parcela}%/mês a partir de ${m.juros_a_partir_de}x` : ' · sem juros'}`
                  : '<strong>À vista</strong>'}
              </div>
              <div>${tags.join('')}</div>
              <div class="metodo-card__acoes">
                <button class="btn btn--fantasma" data-edit="${m.id}">Editar</button>
                <button class="btn btn--perigo" data-toggle="${m.id}">${m.ativo ? 'Desativar' : 'Ativar'}</button>
                <button class="btn btn--perigo" data-del="${m.id}">Excluir</button>
              </div>
            </div>
          `;
        }).join('') +
      '</div>';

      el.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => abrirModal(metodos.find(x => x.id === b.dataset.edit));
      });

      el.querySelectorAll('[data-toggle]').forEach(b => {
        b.onclick = async () => {
          const m = metodos.find(x => x.id === b.dataset.toggle);
          await supabase.from('payment_methods').update({ ativo: !m.ativo }).eq('id', m.id);
          carregar();
        };
      });

      el.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = async () => {
          const m = metodos.find(x => x.id === b.dataset.del);
          if (!confirm(`Excluir a forma "${m.nome}"?`)) return;
          await supabase.from('payment_methods').delete().eq('id', m.id);
          carregar();
        };
      });
    }

    function abrirModal(m = null) {
      const editando = !!m;
      const modal = document.getElementById('modal-bg');
      const corpo = document.getElementById('modal-corpo');
      modal.classList.add('aberto');

      corpo.innerHTML = `
        <h2>${editando ? 'Editar' : 'Nova'} forma de pagamento</h2>
        <form id="form-metodo">
          <div class="linha-2">
            <div class="campo">
              <label>Tipo *</label>
              <select id="tipo" required ${editando ? 'disabled' : ''}>
                <option value="pix">⚡ Pix</option>
                <option value="cartao">💳 Cartão</option>
                <option value="dinheiro">💵 Dinheiro</option>
                <option value="boleto">📄 Boleto</option>
                <option value="transferencia">🏦 Transferência</option>
              </select>
            </div>
            <div class="campo">
              <label>Ordem</label>
              <input type="number" id="ordem" min="0" value="${m?.ordem ?? 0}" />
            </div>
          </div>

          <div class="campo">
            <label>Nome exibido *</label>
            <input type="text" id="nome" required value="${esc(m?.nome || '')}" placeholder="Ex: Pix, Cartão de crédito" />
          </div>

          <div class="campo">
            <label>Descrição</label>
            <input type="text" id="descricao" value="${esc(m?.descricao || '')}" placeholder="Ex: Pagamento instantâneo" />
          </div>

          <div class="campo">
            <label>Instruções ao cliente</label>
            <textarea id="instrucoes" rows="3" placeholder="Ex: Enviar comprovante no WhatsApp após pagar">${esc(m?.instrucoes || '')}</textarea>
          </div>

          <div class="linha-2">
            <div class="campo">
              <label>Desconto (%)</label>
              <input type="number" id="desconto_pct" min="0" max="100" step="0.01" value="${m?.desconto_pct ?? 0}" />
            </div>
            <div class="campo">
              <label>Taxa fixa (R$)</label>
              <input type="number" id="taxa_fixa" min="0" step="0.01" value="${m?.taxa_fixa ?? 0}" />
            </div>
          </div>

          <div class="check-linha">
            <input type="checkbox" id="permite_parcelar" ${m?.permite_parcelar ? 'checked' : ''} />
            <label for="permite_parcelar" style="margin:0;cursor:pointer;">Permitir parcelamento</label>
          </div>

          <div id="bloco-parcelas" style="${m?.permite_parcelar ? '' : 'display:none;'}">
            <div class="linha-3">
              <div class="campo">
                <label>Máx. parcelas</label>
                <input type="number" id="max_parcelas" min="1" max="24" value="${m?.max_parcelas ?? 12}" />
              </div>
              <div class="campo">
                <label>Parcela mínima (R$)</label>
                <input type="number" id="parcela_minima" min="0" step="0.01" value="${m?.parcela_minima ?? 10}" />
              </div>
              <div class="campo">
                <label>Juros (%/mês)</label>
                <input type="number" id="juros_por_parcela" min="0" step="0.01" value="${m?.juros_por_parcela ?? 0}" />
              </div>
            </div>
            <div class="campo">
              <label>Cobrar juros a partir de quantas parcelas?</label>
              <input type="number" id="juros_a_partir_de" min="1" value="${m?.juros_a_partir_de ?? 4}" />
              <span class="campo__dica">Ex: 4 = 1x a 3x sem juros, 4x em diante com juros</span>
            </div>
          </div>

          <div class="check-linha">
            <input type="checkbox" id="ativo" ${m?.ativo !== false ? 'checked' : ''} />
            <label for="ativo" style="margin:0;cursor:pointer;">Ativo</label>
          </div>

          <div class="modal__acoes">
            <button type="button" class="btn btn--fantasma" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">${editando ? 'Salvar' : 'Criar'}</button>
          </div>
        </form>
      `;

      const checkParcelar = document.getElementById('permite_parcelar');
      const blocoParcelas = document.getElementById('bloco-parcelas');
      checkParcelar.onchange = () => {
        blocoParcelas.style.display = checkParcelar.checked ? 'block' : 'none';
      };

      document.getElementById('btn-cancelar').onclick = () => modal.classList.remove('aberto');
      modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('aberto'); };

      document.getElementById('form-metodo').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-salvar');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        const payload = {
          tipo: document.getElementById('tipo').value,
          nome: document.getElementById('nome').value.trim(),
          descricao: document.getElementById('descricao').value.trim() || null,
          instrucoes: document.getElementById('instrucoes').value.trim() || null,
          ordem: Number(document.getElementById('ordem').value) || 0,
          permite_parcelar: document.getElementById('permite_parcelar').checked,
          max_parcelas: Number(document.getElementById('max_parcelas').value) || 1,
          parcela_minima: Number(document.getElementById('parcela_minima').value) || 0,
          juros_por_parcela: Number(document.getElementById('juros_por_parcela').value) || 0,
          juros_a_partir_de: Number(document.getElementById('juros_a_partir_de').value) || 1,
          desconto_pct: Number(document.getElementById('desconto_pct').value) || 0,
          taxa_fixa: Number(document.getElementById('taxa_fixa').value) || 0,
          ativo: document.getElementById('ativo').checked
        };

        try {
          let r;
          if (editando) {
            r = await supabase.from('payment_methods').update(payload).eq('id', m.id);
          } else {
            r = await supabase.from('payment_methods').insert(payload);
          }
          if (r.error) throw r.error;

          modal.classList.remove('aberto');
          carregar();
        } catch (err) {
          alert('Erro: ' + err.message);
          btn.disabled = false;
          btn.textContent = editando ? 'Salvar' : 'Criar';
        }
      };
    }
  </script>
</body>
</html>
