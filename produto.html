<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>
  <main class="conteudo">
    <div class="container">
      <div id="conteudo-produto"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
    </div>
  </main>
  <div id="footer"></div>
  <div id="modal-proposta" class="oculto"></div>
  <div id="modal-aviso" class="oculto"></div>

  <script type="module">
    (async () => {
      try {
        const { renderHeader } = await import('./assets/js/components/header.js');
        const { renderFooter } = await import('./assets/js/components/footer.js');
        await renderHeader('produtos');
        await renderFooter();
      } catch (e) {}
    })();

    (async () => {
      const params = new URLSearchParams(location.search);
      const produtoId = params.get('id');
      if (!produtoId) { renderNaoEncontrado('Nenhum produto selecionado.'); return; }

      try {
        const mod = await import('./assets/js/services/products.service.js');
        const p = await Promise.race([
          mod.buscarProduto(produtoId),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
        ]);
        if (!p || p.status === 'oculto') { renderNaoEncontrado('Produto não encontrado.'); return; }
        renderProduto(p, mod);
      } catch (e) {
        renderNaoEncontrado('Produto não encontrado.');
      }
    })();

    function renderProduto(p, mod) {
      document.title = p.nome + ' — Minha Loja';
      const disp = mod.rotuloDisponibilidade(p);
      const cond = mod.rotuloCondicao(p.condicao);
      const imagens = (p.imagens && p.imagens.length) ? p.imagens : [{ url: null }];

      const img = p.imagemPrincipal
        ? '<img src="' + p.imagemPrincipal + '" alt="" />'
        : '<div class="produto-card__sem-imagem"></div>';

      const preco = p.temPromo
        ? '<div class="produto__preco-antigo">R$ ' + p.preco.toFixed(2) + '</div><div class="produto__preco produto__preco--promo">R$ ' + p.precoPromocional.toFixed(2) + '</div>'
        : '<div class="produto__preco">R$ ' + p.preco.toFixed(2) + '</div>';

      const miniaturas = imagens.length > 1
        ? '<div class="galeria__miniaturas" id="galeria-miniaturas">' + imagens.map(function(img, i) {
            return '<button class="galeria__miniatura ' + (i === 0 ? 'ativa' : '') + '" data-img="' + (img.url || '') + '">' + (img.url ? '<img src="' + img.url + '" alt="" loading="lazy" />' : '') + '</button>';
          }).join('') + '</div>'
        : '';

      const el = document.getElementById('conteudo-produto');
      el.innerHTML =
        '<div class="migalhas"><a href="./index.html">Início</a><span><a href="./produtos.html">Produtos</a></span><span>' + esc(p.nome) + '</span></div>' +
        '<div class="produto">' +
          '<div class="galeria">' +
            '<div class="galeria__principal" id="galeria-principal">' + img + '</div>' +
            miniaturas +
          '</div>' +
          '<div class="produto__info">' +
            '<div class="produto__meta">' +
              '<span class="badge badge--neutro">' + cond + '</span>' +
              '<span class="badge badge--' + disp.tipo + '">' + disp.texto + '</span>' +
              (p.marca ? '<span class="texto-suave">Marca: <strong>' + esc(p.marca) + '</strong></span>' : '') +
            '</div>' +
            '<h1 class="produto__nome">' + esc(p.nome) + '</h1>' +
            (p.descricaoCurta ? '<p class="texto-suave">' + esc(p.descricaoCurta) + '</p>' : '') +
            '<div class="produto__preco-bloco">' + preco +
              '<div class="produto__parcelas">Em até <strong>3x</strong> de R$ ' + (p.precoFinal / 3).toFixed(2) + ' sem juros</div>' +
            '</div>' +
            '<div class="produto__acoes">' +
              '<button class="btn btn--principal btn--lg btn--bloco" id="btn-comprar">🛒 Comprar agora</button>' +
              '<div class="produto__acoes-linha">' +
                '<button class="btn btn--contorno" id="btn-proposta">Fazer proposta</button>' +
                '<button class="btn btn--contorno" id="btn-chat">Conversar</button>' +
              '</div>' +
              '<div class="produto__acoes-linha">' +
                '<button class="btn-whatsapp" id="btn-whatsapp">Falar no WhatsApp</button>' +
              '</div>' +
            '</div>' +
            (p.descricao ? '<div><h3 class="mb-2">Descrição</h3><p class="produto__descricao">' + esc(p.descricao) + '</p></div>' : '') +
          '</div>' +
        '</div>';

      // Miniaturas
      document.querySelectorAll('.galeria__miniatura').forEach(function(btn) {
        btn.onclick = function() {
          const url = btn.dataset.img;
          if (!url) return;
          document.getElementById('galeria-principal').innerHTML = '<img src="' + url + '" alt="" />';
          document.querySelectorAll('.galeria__miniatura').forEach(function(b) { b.classList.remove('ativa'); });
          btn.classList.add('ativa');
        };
      });

      // Comprar
      document.getElementById('btn-comprar').onclick = function() {
        const c = JSON.parse(localStorage.getItem('carrinho') || '[]');
        const idx = c.findIndex(function(i) { return i.id === p.id; });
        if (idx >= 0) c[idx].quantidade += 1;
        else c.push({ id: p.id, nome: p.nome, preco: p.precoFinal, imagem: p.imagemPrincipal, quantidade: 1 });
        localStorage.setItem('carrinho', JSON.stringify(c));
        location.href = './carrinho.html';
      };

      document.getElementById('btn-proposta').onclick = async function() {
        const { supabase } = await import('./assets/js/supabase.js');
        const r = await supabase.auth.getUser();
        if (!r.data || !r.data.user) { aviso('Faça login', 'Você precisa estar logado para enviar proposta.', 'Fazer login', './login.html'); return; }
        aviso('Proposta', 'A funcionalidade de proposta estará disponível em breve.', 'Ver chat', './chat.html');
      };

      document.getElementById('btn-chat').onclick = async function() {
        const { supabase } = await import('./assets/js/supabase.js');
        const r = await supabase.auth.getUser();
        if (!r.data || !r.data.user) { aviso('Faça login', 'Você precisa estar logado para conversar.', 'Fazer login', './login.html'); return; }
        aviso('Chat', 'A funcionalidade de chat estará disponível em breve.', 'Ver chat', './chat.html');
      };

      document.getElementById('btn-whatsapp').onclick = async function() {
        try {
          const { abrirWhatsapp } = await import('./assets/js/services/whatsapp.service.js');
          const link = await abrirWhatsapp({ tipo: 'produto', produto: p });
          if (!link) { aviso('WhatsApp não configurado', 'O administrador ainda não cadastrou o WhatsApp da loja. Use o chat.', 'Abrir chat', './chat.html'); }
        } catch (e) { aviso('Erro', 'Não foi possível abrir o WhatsApp.', 'Fechar', '#'); }
      };
    }

    function aviso(t, txt, bt, link) {
      const el = document.getElementById('modal-aviso');
      el.classList.remove('oculto');
      el.innerHTML =
        '<div class="modal-overlay" id="ma-bg">' +
          '<div class="modal" style="max-width:400px;">' +
            '<div class="modal__cabecalho"><h2 class="modal__titulo">' + esc(t) + '</h2></div>' +
            '<div class="modal__corpo"><p>' + esc(txt) + '</p></div>' +
            '<div class="modal__rodape">' +
              '<button class="btn btn--fantasma" id="ma-c">Fechar</button>' +
              (link && link !== '#' ? '<a href="' + link + '" class="btn btn--principal">' + esc(bt) + '</a>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      document.getElementById('ma-c').onclick = function() { el.classList.add('oculto'); el.innerHTML = ''; };
    }

    function renderNaoEncontrado(msg) {
      document.getElementById('conteudo-produto').innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Produto não disponível</div><p class="estado-vazio__descricao">' + esc(msg) + '</p><a href="./produtos.html" class="btn btn--principal">Ver catálogo</a></div>';
    }

    function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  </script>
</body>
</html>
