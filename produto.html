<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Produto — Minha Loja</title>
  <meta name="description" content="Detalhes do produto. Compre, faça uma proposta ou converse direto com a loja." />

  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />

  <style>
    /* Zoom simples na imagem principal */
    .zoom-overlay {
      position: fixed; inset: 0; z-index: var(--z-modal);
      background: rgba(0,0,0,.92);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; cursor: zoom-out;
    }
    .zoom-overlay img { max-width: 95vw; max-height: 95vh; }
  </style>
</head>
<body>

  <div id="header"></div>

  <main class="conteudo">
    <div class="container">
      <div id="conteudo-produto">
        <div class="carregando"><div class="spinner spinner--lg"></div></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <!-- Modal de proposta -->
  <div id="modal-proposta" class="oculto"></div>

  <!-- Modal de mensagem (aviso / login) -->
  <div id="modal-aviso" class="oculto"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { supabase } from './assets/js/supabase.js';
    import { buscarProduto, rotuloDisponibilidade, rotuloCondicao } from './assets/js/services/products.service.js';
    import { abrirWhatsapp } from './assets/js/services/whatsapp.service.js';

    const params = new URLSearchParams(window.location.search);
    const produtoId = params.get('id');

    // -------------------------------------------------------------
    // Inicialização
    // -------------------------------------------------------------
    await renderHeader('produtos');
    await renderFooter();

    if (!produtoId) {
      renderizarNaoEncontrado('Nenhum produto selecionado.');
    } else {
      await carregarProduto(produtoId);
    }

    // -------------------------------------------------------------
    // Carregar produto
    // -------------------------------------------------------------
    async function carregarProduto(id) {
      const el = document.getElementById('conteudo-produto');
      try {
        const p = await buscarProduto(id);

        if (!p || p.status === 'oculto') {
          renderizarNaoEncontrado('Produto não encontrado ou indisponível.');
          return;
        }

        document.title = `${p.nome} — Minha Loja`;
        document.querySelector('meta[name="description"]')
          ?.setAttribute('content', p.descricaoCurta || p.nome);

        const catSlug = p.categoria?.slug || '';
        const catNome = p.categoria?.nome || '';

        const disp = rotuloDisponibilidade(p);
        const cond = rotuloCondicao(p.condicao);
        const imagens = p.imagens.length
          ? p.imagens
          : [{ url: null, id: 'placeholder' }];

        el.innerHTML = `
          <div class="migalhas">
            <a href="./index.html">Início</a>
            <span><a href="./produtos.html">Produtos</a></span>
            ${catNome ? `<span><a href="./produtos.html?categoria=${p.categoriaId}">${escapeHtml(catNome)}</a></span>` : ''}
            <span>${escapeHtml(p.nome)}</span>
          </div>

          <div class="produto">

            <!-- Galeria -->
            <div class="galeria">
              <div class="galeria__principal" id="galeria-principal">
                ${imagemPrincipal(p)}
              </div>
              ${imagens.length > 1 ? `
                <div class="galeria__miniaturas" id="galeria-miniaturas">
                  ${imagens.map((img, i) => `
                    <button class="galeria__miniatura ${i === 0 ? 'ativa' : ''}"
                            data-img="${img.url || ''}">
                      ${img.url
                        ? `<img src="${img.url}" alt="Imagem ${i + 1}" />`
                        : `<div class="produto-card__sem-imagem">
                             <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                  stroke="currentColor" stroke-width="1.5">
                               <rect x="3" y="3" width="18" height="18" rx="2"/>
                             </svg>
                           </div>`}
                    </button>
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Info -->
            <div class="produto__info">
              <div class="produto__meta">
                <span class="badge badge--neutro">${cond}</span>
                <span class="badge badge--${disp.tipo}">${disp.texto}</span>
                ${p.marca ? `<span class="texto-suave">Marca: <strong>${escapeHtml(p.marca)}</strong></span>` : ''}
                ${p.sku ? `<span class="texto-suave">Cód: ${escapeHtml(p.sku)}</span>` : ''}
              </div>

              <h1 class="produto__nome">${escapeHtml(p.nome)}</h1>

              ${p.descricaoCurta ? `<p class="texto-suave">${escapeHtml(p.descricaoCurta)}</p>` : ''}

              <div class="produto__preco-bloco">
                ${p.temPromo
                  ? `<div class="produto__preco-antigo">R$ ${p.preco.toFixed(2)}</div>
                     <div class="produto__preco produto__preco--promo">R$ ${p.precoPromocional.toFixed(2)}</div>
                     <div class="texto-sm texto-sucesso peso-semibold mt-1">
                       Economia de R$ ${(p.preco - p.precoPromocional).toFixed(2)} (${p.descontoPct}% off)
                     </div>`
                  : `<div class="produto__preco">R$ ${p.preco.toFixed(2)}</div>`}
                <div class="produto__parcelas">
                  Em até <strong>3x</strong> de R$ ${(p.precoFinal / 3).toFixed(2)} sem juros
                </div>
              </div>

              <!-- Ações -->
              <div class="produto__acoes">
                <button class="btn btn--principal btn--lg btn--bloco" id="btn-comprar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                  </svg>
                  Comprar agora
                </button>

                <div class="produto__acoes-linha">
                  <button class="btn btn--contorno" id="btn-proposta">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                      <path d="M2 17l10 5 10-5"/>
                      <path d="M2 12l10 5 10-5"/>
                    </svg>
                    Fazer proposta
                  </button>
                  <button class="btn btn--contorno" id="btn-chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Conversar
                  </button>
                </div>

                <div class="produto__acoes-linha">
                  <button class="btn btn--sucesso" id="btn-whatsapp">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    Falar no WhatsApp
                  </button>
                  <button class="btn btn--fantasma btn--icone" id="btn-favorito" title="Favoritar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                  </button>
                </div>
              </div>

              ${p.descricao ? `
                <div>
                  <h3 class="mb-2">Descrição</h3>
                  <p class="produto__descricao">${escapeHtml(p.descricao)}</p>
                </div>
              ` : ''}

              ${renderCaracteristicas(p.caracteristicas)}

              ${renderEspecificacoes(p)}
            </div>
          </div>
        `;

        // Eventos
        ligarEventos(p);
        aplicarFavoritoInicial(p.id);

      } catch (e) {
        console.error(e);
        renderizarNaoEncontrado('Não foi possível carregar este produto.');
      }
    }

    // -------------------------------------------------------------
    // Renderizações auxiliares
    // -------------------------------------------------------------
    function imagemPrincipal(p) {
      if (!p.imagemPrincipal) {
        return `<div class="produto-card__sem-imagem">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>`;
      }
      return `<img src="${p.imagemPrincipal}" alt="${escapeHtml(p.nome)}" id="img-principal" />`;
    }

    function renderCaracteristicas(carac) {
      if (!Array.isArray(carac) || !carac.length) return '';
      return `
        <div>
          <h3 class="mb-2">Características</h3>
          <ul style="list-style: disc; padding-left: 1.2rem;">
            ${carac.map(c => `<li class="texto-sm">${escapeHtml(String(c))}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    function renderEspecificacoes(p) {
      const linhas = [];
      if (p.marca)      linhas.push(['Marca', p.marca]);
      if (p.modelo)     linhas.push(['Modelo', p.modelo]);
      if (p.sku)        linhas.push(['Código / SKU', p.sku]);
      if (p.condicao)   linhas.push(['Condição', rotuloCondicao(p.condicao)]);

      const esp = p.especificacoes || {};
      Object.keys(esp).forEach(k => {
        if (esp[k] !== null && esp[k] !== '') {
          linhas.push([k, String(esp[k])]);
        }
      });

      if (!linhas.length) return '';

      return `
        <div>
          <h3 class="mb-2">Especificações</h3>
          <div class="produto__especificacoes">
            <table>
              <tbody>
                ${linhas.map(([k, v]) => `
                  <tr>
                    <th>${escapeHtml(k)}</th>
                    <td>${escapeHtml(v)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // Eventos da página
    // -------------------------------------------------------------
    function ligarEventos(p) {
      // Miniaturas
      document.querySelectorAll('.galeria__miniatura').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.dataset.img;
          const principal = document.getElementById('galeria-principal');
          if (!url) return;
          principal.innerHTML = `<img src="${url}" alt="${escapeHtml(p.nome)}" />`;
          document.querySelectorAll('.galeria__miniatura')
            .forEach(b => b.classList.remove('ativa'));
          btn.classList.add('ativa');
          ligarZoom();
        });
      });
      ligarZoom();

      // Comprar agora → adiciona ao localStorage e redireciona
      document.getElementById('btn-comprar').addEventListener('click', async () => {
        adicionarAoCarrinho(p, 1);
        window.location.href = './carrinho.html';
      });

      // Fazer proposta
      document.getElementById('btn-proposta').addEventListener('click', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          modalAviso(
            'Entre na sua conta',
            'Para enviar uma proposta, você precisa estar logado.',
            'Fazer login', './login.html'
          );
          return;
        }
        abrirModalProposta(p);
      });

      // Conversar (chat)
      document.getElementById('btn-chat').addEventListener('click', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          modalAviso(
            'Entre na sua conta',
            'Para conversar com a loja, você precisa estar logado.',
            'Fazer login', './login.html'
          );
          return;
        }
        await abrirChat(p);
      });

      // WhatsApp
      document.getElementById('btn-whatsapp').addEventListener('click', () => {
        abrirWhatsapp({ tipo: 'produto', produto: p });
      });

      // Favoritar
      document.getElementById('btn-favorito').addEventListener('click', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          modalAviso(
            'Entre na sua conta',
            'Para favoritar produtos, você precisa estar logado.',
            'Fazer login', './login.html'
          );
          return;
        }
        await alternarFavorito(p.id);
      });
    }

    // -------------------------------------------------------------
    // Zoom na imagem
    // -------------------------------------------------------------
    function ligarZoom() {
      const principal = document.getElementById('galeria-principal');
      const img = principal.querySelector('img');
      if (!img) return;
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', () => {
        const ov = document.createElement('div');
        ov.className = 'zoom-overlay';
        ov.innerHTML = `<img src="${img.src}" alt="" />`;
        ov.addEventListener('click', () => ov.remove());
        document.body.appendChild(ov);
      });
    }

    // -------------------------------------------------------------
    // Carrinho (localStorage simples — depois sincroniza)
    // -------------------------------------------------------------
    function adicionarAoCarrinho(p, qtd) {
      const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
      const idx = carrinho.findIndex(i => i.id === p.id);
      if (idx >= 0) {
        carrinho[idx].quantidade += qtd;
      } else {
        carrinho.push({
          id: p.id,
          nome: p.nome,
          preco: p.precoFinal,
          imagem: p.imagemPrincipal,
          quantidade: qtd
        });
      }
      localStorage.setItem('carrinho', JSON.stringify(carrinho));
      toast('Adicionado ao carrinho', p.nome, 'sucesso');
    }

    // -------------------------------------------------------------
    // Favoritos
    // -------------------------------------------------------------
    async function aplicarFavoritoInicial(produtoId) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const { data } = await supabase
        .from('favorites')
        .select('id')
        .eq('user_id', user.id)
        .eq('product_id', produtoId)
        .maybeSingle();
      if (data) {
        document.getElementById('btn-favorito')?.classList.add('ativo');
      }
    }

    async function alternarFavorito(produtoId) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const btn = document.getElementById('btn-favorito');
      const { data: existente } = await supabase
        .from('favorites')
        .select('id')
        .eq('user_id', user.id)
        .eq('product_id', produtoId)
        .maybeSingle();

      if (existente) {
        await supabase.from('favorites').delete().eq('id', existente.id);
        btn.classList.remove('ativo');
        toast('Removido dos favoritos', '', 'neutro');
      } else {
        await supabase.from('favorites').insert({
          user_id: user.id, product_id: produtoId
        });
        btn.classList.add('ativo');
        toast('Adicionado aos favoritos', '', 'sucesso');
      }
    }

    // -------------------------------------------------------------
    // Chat (cria ou reabre conversa vinculada ao produto)
    // -------------------------------------------------------------
    async function abrirChat(p) {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      // Procura chat existente para este produto
      const { data: existente } = await supabase
        .from('chats')
        .select('id')
        .eq('user_id', user.id)
        .eq('product_id', p.id)
        .maybeSingle();

      let chatId = existente?.id;

      if (!chatId) {
        const { data: novo, error } = await supabase
          .from('chats')
          .insert({
            user_id: user.id,
            product_id: p.id,
            assunto: `Interesse em: ${p.nome}`
          })
          .select('id')
          .single();
        if (error) { console.error(error); toast('Erro', 'Não foi possível abrir o chat', 'erro'); return; }
        chatId = novo.id;
      }
      window.location.href = `./conversa.html?id=${chatId}`;
    }

    // -------------------------------------------------------------
    // Modal de proposta
    // -------------------------------------------------------------
    function abrirModalProposta(p) {
      const el = document.getElementById('modal-proposta');
      el.classList.remove('oculto');
      el.innerHTML = `
        <div class="modal-overlay" id="modal-prop-bg">
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-prop">
            <div class="modal__cabecalho">
              <h2 class="modal__titulo" id="titulo-prop">Enviar proposta</h2>
              <button class="modal__fechar" id="btn-fechar-prop" aria-label="Fechar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <form id="form-proposta">
              <div class="modal__corpo">
                <p class="texto-sm texto-suave mb-4">
                  Produto: <strong>${escapeHtml(p.nome)}</strong><br>
                  Preço anunciado: <strong>R$ ${p.precoFinal.toFixed(2)}</strong>
                </p>

                <div class="campo">
                  <label for="valor-proposta">Seu valor (R$)</label>
                  <input type="number" id="valor-proposta" name="valor_proposta"
                         min="0" step="0.01" required placeholder="0,00" />
                </div>

                <div class="campo">
                  <label for="qtd-proposta">Quantidade</label>
                  <input type="number" id="qtd-proposta" name="quantidade"
                         min="1" value="1" required />
                </div>

                <div class="campo">
                  <label for="msg-proposta">Mensagem (opcional)</label>
                  <textarea id="msg-proposta" name="mensagem" rows="3"
                            placeholder="Detalhes, condições, forma de pagamento..."></textarea>
                </div>
              </div>
              <div class="modal__rodape">
                <button type="button" class="btn btn--fantasma" id="btn-cancelar-prop">Cancelar</button>
                <button type="submit" class="btn btn--principal" id="btn-enviar-prop">
                  Enviar proposta
                </button>
              </div>
            </form>
          </div>
        </div>
      `;

      document.getElementById('btn-fechar-prop').onclick = fecharModalProposta;
      document.getElementById('btn-cancelar-prop').onclick = fecharModalProposta;
      document.getElementById('modal-prop-bg').onclick = (e) => {
        if (e.target.id === 'modal-prop-bg') fecharModalProposta();
      };

      document.getElementById('form-proposta').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-enviar-prop');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        const { data: { user } } = await supabase.auth.getUser();

        const payload = {
          user_id: user.id,
          product_id: p.id,
          preco_anunciado: p.precoFinal,
          valor_proposta: Number(document.getElementById('valor-proposta').value),
          quantidade: Number(document.getElementById('qtd-proposta').value),
          mensagem: document.getElementById('msg-proposta').value.trim() || null,
          status: 'enviada'
        };

        const { data: proposta, error } = await supabase
          .from('proposals')
          .insert(payload)
          .select('id, numero')
          .single();

        if (error) {
          console.error(error);
          toast('Erro ao enviar proposta', 'Tente novamente', 'erro');
          btn.disabled = false;
          btn.textContent = 'Enviar proposta';
          return;
        }

        // Notifica o admin (insere notificação genérica — admin verá no painel)
        await supabase.from('notifications').insert({
          user_id: user.id, // a notificação fica ligada ao próprio usuário e o admin filtra
          tipo: 'proposta',
          titulo: 'Nova proposta recebida',
          mensagem: `Proposta ${proposta.numero} enviada por você.`,
          link: `./proposta.html?id=${proposta.id}`
        });

        fecharModalProposta();
        toast('Proposta enviada!', `Número: ${proposta.numero}`, 'sucesso');

        setTimeout(() => {
          window.location.href = './propostas.html';
        }, 1500);
      });
    }

    function fecharModalProposta() {
      const el = document.getElementById('modal-proposta');
      el.classList.add('oculto');
      el.innerHTML = '';
    }

    // -------------------------------------------------------------
    // Modal de aviso
    // -------------------------------------------------------------
    function modalAviso(titulo, texto, textoBotao, link) {
      const el = document.getElementById('modal-aviso');
      el.classList.remove('oculto');
      el.innerHTML = `
        <div class="modal-overlay" id="modal-aviso-bg">
          <div class="modal" style="max-width: 400px;">
            <div class="modal__cabecalho">
              <h2 class="modal__titulo">${escapeHtml(titulo)}</h2>
            </div>
            <div class="modal__corpo">
              <p>${escapeHtml(texto)}</p>
            </div>
            <div class="modal__rodape">
              <button class="btn btn--fantasma" id="aviso-cancelar">Agora não</button>
              <a href="${link}" class="btn btn--principal">${escapeHtml(textoBotao)}</a>
            </div>
          </div>
        </div>
      `;
      document.getElementById('aviso-cancelar').onclick = () => {
        el.classList.add('oculto');
        el.innerHTML = '';
      };
      document.getElementById('modal-aviso-bg').onclick = (e) => {
        if (e.target.id === 'modal-aviso-bg') {
          el.classList.add('oculto'); el.innerHTML = '';
        }
      };
    }

    // -------------------------------------------------------------
    // Estado "não encontrado"
    // -------------------------------------------------------------
    function renderizarNaoEncontrado(msg) {
      document.getElementById('conteudo-produto').innerHTML = `
        <div class="estado-vazio">
          <div class="estado-vazio__titulo">Produto não disponível</div>
          <p class="estado-vazio__descricao">${escapeHtml(msg)}</p>
          <a href="./produtos.html" class="btn btn--principal">Ver catálogo</a>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // Toast rápido
    // -------------------------------------------------------------
    function toast(titulo, msg = '', tipo = 'info') {
      let area = document.querySelector('.toast-area');
      if (!area) {
        area = document.createElement('div');
        area.className = 'toast-area';
        document.body.appendChild(area);
      }
      const t = document.createElement('div');
      t.className = `toast toast--${tipo}`;
      t.innerHTML = `
        <div class="toast__titulo">${escapeHtml(titulo)}</div>
        ${msg ? `<div class="toast__msg">${escapeHtml(msg)}</div>` : ''}
      `;
      area.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // -------------------------------------------------------------
    // Utilitário
    // -------------------------------------------------------------
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
  </script>
</body>
</html>
