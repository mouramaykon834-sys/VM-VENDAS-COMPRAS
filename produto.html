<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
  <style>
    #galeria-principal img { cursor: zoom-in; }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="conteudo">
    <div class="container">
      <div id="conteudo-produto"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    (async () => {
      try {
        const { renderHeader } = await import('./assets/js/components/header.js');
        const { renderFooter } = await import('./assets/js/components/footer.js');
        await renderHeader('produtos');
        await renderFooter();
      } catch (e) {}
    })();

    let imagensUrls = [];

    (async () => {
      const params = new URLSearchParams(location.search);
      const produtoId = params.get('id');
      if (!produtoId) { renderNaoEncontrado('Nenhum produto selecionado.'); return; }

      try {
        const mod = await import('./assets/js/services/products.service.js');
        const p = await Promise.race([
          mod.buscarProduto(produtoId),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
        ]);
        if (!p || p.status === 'oculto') { renderNaoEncontrado('Produto não encontrado.'); return; }
        renderProduto(p, mod);
      } catch (e) {
        renderNaoEncontrado('Produto não encontrado.');
      }
    })();

    function renderProduto(p, mod) {
      document.title = p.nome + ' — Minha Loja';
      const disp = mod.rotuloDisponibilidade(p);
      const cond = mod.rotuloCondicao(p.condicao);
      const imagens = (p.imagens && p.imagens.length) ? p.imagens : [{ url: null }];

      imagensUrls = imagens.map(function(img) { return img.url; }).filter(function(u) { return u; });
      if (p.imagemPrincipal && imagensUrls.indexOf(p.imagemPrincipal) === -1) {
        imagensUrls.unshift(p.imagemPrincipal);
      }

      const img = p.imagemPrincipal
        ? '<img src="' + p.imagemPrincipal + '" alt="" />'
        : '<div class="produto-card__sem-imagem"></div>';

      const preco = p.temPromo
        ? '<div class="produto__preco-antigo">R$ ' + p.preco.toFixed(2) + '</div><div class="produto__preco produto__preco--promo">R$ ' + p.precoPromocional.toFixed(2) + '</div>'
        : '<div class="produto__preco">R$ ' + p.preco.toFixed(2) + '</div>';

      const miniaturas = imagens.length > 1
        ? '<div class="galeria__miniaturas" id="galeria-miniaturas">' + imagens.map(function(img, i) {
            return '<button class="galeria__miniatura ' + (i === 0 ? 'ativa' : '') + '" data-img="' + (img.url || '') + '" data-idx="' + i + '">' + (img.url ? '<img src="' + img.url + '" alt="" loading="lazy" />' : '') + '</button>';
          }).join('') + '</div>'
        : '';

      const el = document.getElementById('conteudo-produto');
      el.innerHTML =
        '<div class="migalhas"><a href="./index.html">Início</a><span><a href="./produtos.html">Produtos</a></span><span>' + esc(p.nome) + '</span></div>' +
        '<div class="produto">' +
          '<div class="galeria">' +
            '<div class="galeria__principal" id="galeria-principal">' + img + '</div>' +
            miniaturas +
          '</div>' +
          '<div class="produto__info">' +
            '<div class="produto__meta">' +
              '<span class="badge badge--neutro">' + cond + '</span>' +
              '<span class="badge badge--' + disp.tipo + '">' + disp.texto + '</span>' +
              (p.marca ? '<span class="texto-suave">Marca: <strong>' + esc(p.marca) + '</strong></span>' : '') +
            '</div>' +
            '<h1 class="produto__nome">' + esc(p.nome) + '</h1>' +
            (p.descricaoCurta ? '<p class="texto-suave">' + esc(p.descricaoCurta) + '</p>' : '') +
            '<div class="produto__preco-bloco">' + preco +
              '<div class="produto__parcelas">Em até <strong>3x</strong> de R$ ' + (p.precoFinal / 3).toFixed(2) + ' sem juros</div>' +
            '</div>' +
            '<div class="produto__acoes">' +
              '<div class="produto__acoes-linha">' +
                '<button class="btn btn--principal btn--lg" id="btn-comprar" style="flex:2;">🛒 Comprar agora</button>' +
                '<button class="btn btn--contorno btn--lg" id="btn-carrinho" style="flex:1;" title="Adicionar ao carrinho">+ Carrinho</button>' +
              '</div>' +
              '<div class="produto__acoes-linha">' +
                '<button class="btn btn--contorno" id="btn-proposta">Fazer proposta</button>' +
                '<button class="btn btn--contorno" id="btn-chat">Conversar</button>' +
              '</div>' +
              '<div class="produto__acoes-linha">' +
                '<button class="btn-whatsapp" id="btn-whatsapp">Falar no WhatsApp</button>' +
              '</div>' +
            '</div>' +
            (p.descricao ? '<div><h3 class="mb-2">Descrição</h3><p class="produto__descricao">' + esc(p.descricao) + '</p></div>' : '') +
          '</div>' +
        '</div>';

      // =====================================================
      // GALERIA
      // =====================================================
      const principal = document.getElementById('galeria-principal');
      if (principal) {
        principal.onclick = function() {
          if (!imagensUrls.length) return;
          abrirGaleriaFull(0);
        };
      }

      document.querySelectorAll('.galeria__miniatura').forEach(function(btn) {
        btn.onclick = function() {
          const url = btn.dataset.img;
          const idx = Number(btn.dataset.idx) || 0;
          if (!url) return;
          document.getElementById('galeria-principal').innerHTML = '<img src="' + url + '" alt="" />';
          document.querySelectorAll('.galeria__miniatura').forEach(function(b) { b.classList.remove('ativa'); });
          btn.classList.add('ativa');
          document.getElementById('galeria-principal').onclick = function() {
            abrirGaleriaFull(idx);
          };
        };
      });

      // =====================================================
      // BOTÕES
      // =====================================================

      // COMPRAR AGORA (adiciona + redireciona)
      document.getElementById('btn-comprar').onclick = function() {
        const c = JSON.parse(localStorage.getItem('carrinho') || '[]');
        const idx = c.findIndex(function(i) { return i.id === p.id; });
        if (idx >= 0) c[idx].quantidade += 1;
        else c.push({ id: p.id, nome: p.nome, preco: p.precoFinal, imagem: p.imagemPrincipal, quantidade: 1 });
        localStorage.setItem('carrinho', JSON.stringify(c));
        location.href = './carrinho.html';
      };

      // ADICIONAR AO CARRINHO (sem redirect, com toast)
      document.getElementById('btn-carrinho').onclick = function() {
        try {
          const c = JSON.parse(localStorage.getItem('carrinho') || '[]');
          const idx = c.findIndex(function(i) { return i.id === p.id; });
          if (idx >= 0) c[idx].quantidade += 1;
          else c.push({ id: p.id, nome: p.nome, preco: p.precoFinal, imagem: p.imagemPrincipal, quantidade: 1 });
          localStorage.setItem('carrinho', JSON.stringify(c));

          // Atualiza badge do header
          const total = c.reduce(function(s, i) { return s + (i.quantidade || 0); }, 0);
          const badge = document.getElementById('badge-carrinho');
          if (badge) {
            if (total > 0) { badge.textContent = total; badge.classList.remove('oculto'); }
            else badge.classList.add('oculto');
          }

          // Toast
          mostrarToast('✅ Adicionado ao carrinho', p.nome);
        } catch (e) {
          alert('Erro ao adicionar: ' + e.message);
        }
      };

      // PROPOSTA
      document.getElementById('btn-proposta').onclick = async function() {
        const { supabase } = await import('./assets/js/supabase.js');
        const r = await supabase.auth.getUser();
        if (!r.data || !r.data.user) { mostrarAviso('Faça login', 'Você precisa estar logado para enviar proposta.', 'Fazer login', './login.html'); return; }
        abrirModalProposta(p);
      };

      // CHAT
      document.getElementById('btn-chat').onclick = async function() {
        const { supabase } = await import('./assets/js/supabase.js');
        const r = await supabase.auth.getUser();
        if (!r.data || !r.data.user) {
          mostrarAviso('Faça login', 'Você precisa estar logado para conversar com a loja.', 'Fazer login', './login.html');
          return;
        }
        try {
          const { abrirConversa } = await import('./assets/js/services/chat.service.js');
          const chatId = await abrirConversa({
            product_id: p.id,
            assunto: 'Interesse em: ' + p.nome
          });
          location.href = './conversa.html?id=' + chatId;
        } catch (e) {
          alert('Erro ao abrir chat: ' + e.message);
        }
      };

      // WHATSAPP
      document.getElementById('btn-whatsapp').onclick = async function() {
        try {
          const { abrirWhatsapp } = await import('./assets/js/services/whatsapp.service.js');
          const link = await abrirWhatsapp({ tipo: 'produto', produto: p });
          if (!link) { mostrarAviso('WhatsApp não configurado', 'O administrador ainda não cadastrou o WhatsApp da loja.', 'Fechar', '#'); }
        } catch (e) { mostrarAviso('Erro', 'Não foi possível abrir o WhatsApp.', 'Fechar', '#'); }
      };
    }

    // =====================================================
    // TOAST — inline (não depende de cart-widget.js)
    // =====================================================
    function mostrarToast(titulo, mensagem) {
      let area = document.querySelector('.toast-area-cart');
      if (!area) {
        area = document.createElement('div');
        area.className = 'toast-area-cart';
        area.style.cssText = 'position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100% - 40px);';
        document.body.appendChild(area);
      }

      const el = document.createElement('div');
      el.style.cssText =
        'background:#dcfce7;color:#166534;' +
        'border-left:4px solid #16a34a;' +
        'padding:12px 16px;border-radius:10px;' +
        'box-shadow:0 8px 20px rgba(15,23,42,.15);' +
        'font-family:system-ui,sans-serif;font-size:14px;' +
        'min-width:240px;max-width:100%;' +
        'pointer-events:auto;opacity:0;transform:translateX(20px);' +
        'transition:all .25s;';

      el.innerHTML =
        '<div style="font-weight:700;margin-bottom:2px;">' + esc(titulo) + '</div>' +
        (mensagem ? '<div style="font-size:12px;opacity:.85;">' + esc(mensagem) + '</div>' : '');

      area.appendChild(el);

      requestAnimationFrame(function() {
        el.style.opacity = '1';
        el.style.transform = 'translateX(0)';
      });

      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(function() { el.remove(); }, 300);
      }, 3000);
    }

    async function abrirGaleriaFull(indice) {
      try {
        const { abrirGaleria } = await import('./assets/js/components/galeria.js');
        abrirGaleria(imagensUrls, indice);
      } catch (e) {
        console.error('Erro ao abrir galeria:', e);
      }
    }

    function abrirModalProposta(p) {
      const div = document.createElement('div');
      div.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;';
      div.id = 'modal-proposta-overlay';

      div.innerHTML =
        '<div style="background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px rgba(15,23,42,.2);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;">' +
            '<h2 style="font-size:18px;font-weight:600;">Enviar proposta</h2>' +
            '<button id="mp-x" style="background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;line-height:1;">×</button>' +
          '</div>' +
          '<form id="form-prop" style="padding:20px;">' +
            '<p style="font-size:13px;color:#64748b;margin-bottom:16px;">Produto: <strong>' + esc(p.nome) + '</strong><br>Preço anunciado: <strong>R$ ' + p.precoFinal.toFixed(2) + '</strong></p>' +
            '<div style="margin-bottom:14px;">' +
              '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:5px;">Seu valor (R$)</label>' +
              '<input type="number" id="vp" required min="0" step="0.01" style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;" />' +
            '</div>' +
            '<div style="margin-bottom:14px;">' +
              '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:5px;">Quantidade</label>' +
              '<input type="number" id="qp" required value="1" min="1" style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;" />' +
            '</div>' +
            '<div style="margin-bottom:14px;">' +
              '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:5px;">Mensagem</label>' +
              '<textarea id="mp" rows="3" style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;"></textarea>' +
            '</div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">' +
              '<button type="button" id="mp-cancel" style="padding:10px 18px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;font-weight:600;cursor:pointer;">Cancelar</button>' +
              '<button type="submit" id="mp-enviar" style="padding:10px 18px;border-radius:8px;border:none;background:#0ea5e9;color:#fff;font-weight:600;cursor:pointer;">Enviar proposta</button>' +
            '</div>' +
          '</form>' +
        '</div>';

      document.body.appendChild(div);

      document.getElementById('mp-x').onclick = fecharModalProposta;
      document.getElementById('mp-cancel').onclick = fecharModalProposta;
      div.onclick = function(e) { if (e.target === div) fecharModalProposta(); };

      document.getElementById('form-prop').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('mp-enviar');
        btn.disabled = true; btn.textContent = 'Enviando...';

        try {
          const { supabase } = await import('./assets/js/supabase.js');
          const r = await supabase.auth.getUser();
          const user = r.data ? r.data.user : null;
          if (!user) throw new Error('Faça login primeiro');

          const { error } = await supabase.from('proposals').insert({
            user_id: user.id,
            product_id: p.id,
            preco_anunciado: p.precoFinal,
            valor_proposta: Number(document.getElementById('vp').value),
            quantidade: Number(document.getElementById('qp').value),
            mensagem: document.getElementById('mp').value.trim() || null,
            status: 'enviada'
          });

          if (error) throw error;

          fecharModalProposta();
          setTimeout(function() { location.href = './propostas.html'; }, 500);
        } catch (err) {
          alert('Erro: ' + err.message);
          btn.disabled = false; btn.textContent = 'Enviar proposta';
        }
      };
    }

    function fecharModalProposta() {
      const el = document.getElementById('modal-proposta-overlay');
      if (el) el.remove();
    }

    function mostrarAviso(t, txt, bt, link) {
      const div = document.createElement('div');
      div.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;';
      div.innerHTML =
        '<div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:24px;text-align:center;">' +
          '<h2 style="font-size:18px;font-weight:600;margin-bottom:12px;">' + esc(t) + '</h2>' +
          '<p style="color:#64748b;font-size:14px;margin-bottom:20px;">' + esc(txt) + '</p>' +
          '<div style="display:flex;gap:8px;justify-content:center;">' +
            '<button id="av-c" style="padding:10px 18px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-weight:600;cursor:pointer;">Fechar</button>' +
            (link && link !== '#' ? '<a href="' + link + '" style="padding:10px 18px;border-radius:8px;border:none;background:#0ea5e9;color:#fff;font-weight:600;text-decoration:none;">' + esc(bt) + '</a>' : '') +
          '</div>' +
        '</div>';
      document.body.appendChild(div);
      document.getElementById('av-c').onclick = function() { div.remove(); };
      div.onclick = function(e) { if (e.target === div) div.remove(); };
    }

    function renderNaoEncontrado(msg) {
      document.getElementById('conteudo-produto').innerHTML = '<div class="estado-vazio"><div class="estado-vazio__titulo">Produto não disponível</div><p class="estado-vazio__descricao">' + esc(msg) + '</p><a href="./produtos.html" class="btn btn--principal">Ver catálogo</a></div>';
    }

    function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  </script>
</body>
</html>
