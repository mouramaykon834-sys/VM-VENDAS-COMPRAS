<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produto — Minha Loja</title>
<link rel="stylesheet" href="./assets/css/tokens.css" />
<link rel="stylesheet" href="./assets/css/base.css" />
<link rel="stylesheet" href="./assets/css/layout.css" />
<link rel="stylesheet" href="./assets/css/components.css" />
<link rel="stylesheet" href="./assets/css/store.css" />

<style>
.prod-ref {
  color: #0ea5e9;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 1px dashed #0ea5e9;
  transition: background .15s;
  padding: 0 2px;
  border-radius: 3px;
}

.prod-ref:hover {
  background: #f0f9ff;
}

.prod-ref-nao-achado {
  color: #dc2626;
  border-bottom: 1px dashed #dc2626;
  cursor: help;
}

/* =============================================================
   SELO DE GARANTIA PADRÃO
   ============================================================= */

.selo-garantia {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 10px;
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  border: 1px solid #86efac;
  color: #166534;
  font-size: 13px;
  font-weight: 600;
  margin-top: 12px;
}

.selo-garantia__icone {
  font-size: 16px;
  line-height: 1;
}

.selo-garantia__texto strong {
  color: #065f46;
}

/* =============================================================
   GARANTIA ESTENDIDA
   ============================================================= */

.garantia-estendida {
  margin-top: 18px;
  padding: 16px;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  background: var(--cor-fundo-suave);
}

html[data-tema="escuro"] .garantia-estendida {
  background: #0f172a;
  border-color: #334155;
}

.garantia-estendida__titulo {
  font-size: 13px;
  font-weight: 700;
  color: var(--cor-texto);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.garantia-estendida__opcao {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  margin-bottom: 8px;
  transition: border-color .15s, background .15s;
}

html[data-tema="escuro"] .garantia-estendida__opcao {
  background: #1e293b;
  border-color: #334155;
}

.garantia-estendida__opcao:last-child {
  margin-bottom: 0;
}

.garantia-estendida__opcao:hover {
  border-color: var(--cor-principal);
}

.garantia-estendida__opcao.selecionada {
  border-color: var(--cor-principal);
  background: #f0f9ff;
}

html[data-tema="escuro"] .garantia-estendida__opcao.selecionada {
  background: rgba(14, 165, 233, 0.1);
}

.garantia-estendida__opcao input[type="radio"] {
  width: 18px;
  height: 18px;
  accent-color: var(--cor-principal);
  cursor: pointer;
  flex-shrink: 0;
}

.garantia-estendida__info {
  flex: 1;
  min-width: 0;
}

.garantia-estendida__titulo-opcao {
  font-size: 14px;
  font-weight: 600;
  color: var(--cor-texto);
  margin-bottom: 2px;
}

.garantia-estendida__desc {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.garantia-estendida__preco {
  font-size: 14px;
  font-weight: 700;
  color: var(--cor-sucesso);
  white-space: nowrap;
}

/* =============================================================
   AVISO DE PREÇO COM GARANTIA
   ============================================================= */

.produto__preco-garantia-aviso {
  display: none;
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(14, 165, 233, 0.1);
  border: 1px solid rgba(14, 165, 233, 0.3);
  font-size: 13px;
  color: #075985;
}

html[data-tema="escuro"] .produto__preco-garantia-aviso {
  background: rgba(14, 165, 233, 0.15);
  color: #7dd3fc;
}

.produto__preco-garantia-aviso.visivel {
  display: block;
}

.produto__preco-garantia-aviso strong {
  color: var(--cor-principal);
}

/* =============================================================
   MODAL DE GARANTIA
   ============================================================= */

.garantia-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15, 23, 42, 0.62);
  backdrop-filter: blur(3px);
}

.garantia-modal {
  width: 100%;
  max-width: 520px;
  max-height: min(720px, 90vh);
  overflow: auto;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
}

html[data-tema="escuro"] .garantia-modal {
  background: #0f172a;
  border-color: #334155;
}

.garantia-modal__cabecalho {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid #e2e8f0;
}

html[data-tema="escuro"] .garantia-modal__cabecalho {
  border-color: #334155;
}

.garantia-modal__titulo {
  margin: 0;
  color: #0f172a;
  font-size: 19px;
  line-height: 1.3;
  font-weight: 700;
}

html[data-tema="escuro"] .garantia-modal__titulo {
  color: #f8fafc;
}

.garantia-modal__subtitulo {
  margin: 5px 0 0;
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

html[data-tema="escuro"] .garantia-modal__subtitulo {
  color: #94a3b8;
}

.garantia-modal__fechar {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #64748b;
  font-size: 25px;
  line-height: 1;
  cursor: pointer;
}

.garantia-modal__fechar:hover {
  background: #f1f5f9;
  color: #0f172a;
}

html[data-tema="escuro"] .garantia-modal__fechar:hover {
  background: #1e293b;
  color: #f8fafc;
}

.garantia-modal__corpo {
  padding: 20px 22px;
}

.garantia-modal__produto {
  margin-bottom: 16px;
  padding: 12px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: #f8fafc;
  color: #334155;
  font-size: 13px;
}

html[data-tema="escuro"] .garantia-modal__produto {
  background: #1e293b;
  border-color: #334155;
  color: #cbd5e1;
}

.garantia-modal__produto strong {
  color: #0f172a;
}

html[data-tema="escuro"] .garantia-modal__produto strong {
  color: #f8fafc;
}

.garantia-modal__resumo {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.garantia-modal__item {
  padding: 13px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
}

html[data-tema="escuro"] .garantia-modal__item {
  border-color: #334155;
}

.garantia-modal__label {
  display: block;
  margin-bottom: 4px;
  color: #64748b;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}

html[data-tema="escuro"] .garantia-modal__label {
  color: #94a3b8;
}

.garantia-modal__valor {
  color: #0f172a;
  font-size: 16px;
  font-weight: 700;
}

html[data-tema="escuro"] .garantia-modal__valor {
  color: #f8fafc;
}

.garantia-modal__descricao {
  color: #475569;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-line;
}

html[data-tema="escuro"] .garantia-modal__descricao {
  color: #cbd5e1;
}

.garantia-modal__rodape {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 22px 20px;
  border-top: 1px solid #e2e8f0;
}

html[data-tema="escuro"] .garantia-modal__rodape {
  border-color: #334155;
}

.garantia-modal__rodape button {
  min-height: 42px;
}

@media (max-width: 640px) {
  .garantia-modal-overlay {
    padding: 12px;
  }

  .garantia-modal__resumo {
    grid-template-columns: 1fr;
  }

  .garantia-modal__rodape {
    flex-direction: column-reverse;
  }

  .garantia-modal__rodape button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<main class="conteudo">
  <div class="container">
    <div id="conteudo-produto">
      <div class="carregando">
        <div class="spinner spinner--lg"></div>
      </div>
    </div>
  </div>
</main>

<div id="footer"></div>

<script type="module">

(async () => {
  try {
    const { renderHeader } = await import('./assets/js/components/header.js');
    const { renderFooter } = await import('./assets/js/components/footer.js');

    await renderHeader('produtos');
    await renderFooter();
  } catch (e) {}
})();

let imagensUrls = [];
let produtoAtual = null;
let garantiaSelecionada = null;

/* ============================================================
   CARREGAMENTO DO PRODUTO
   ============================================================ */

(async () => {
  const params = new URLSearchParams(location.search);
  const produtoId = params.get('id');

  if (!produtoId) {
    renderNaoEncontrado('Nenhum produto selecionado.');
    return;
  }

  try {
    const mod = await import('./assets/js/services/products.service.js');

    const p = await Promise.race([
      mod.buscarProduto(produtoId),
      new Promise((_, rej) =>
        setTimeout(() => rej(new Error('timeout')), 8000)
      )
    ]);

    if (!p || p.status === 'oculto') {
      renderNaoEncontrado('Produto não encontrado.');
      return;
    }

    renderProduto(p, mod);

  } catch (e) {
    console.error('[produto] erro:', e);
    renderNaoEncontrado('Produto não encontrado.');
  }
})();

/* ============================================================
   RENDERIZAÇÃO DO PRODUTO
   ============================================================ */

async function renderProduto(p, mod) {

  document.title = p.nome + ' — Minha Loja';
  produtoAtual = p;

  const disp = mod.rotuloDisponibilidade(p);
  const cond = mod.rotuloCondicao(p.condicao);

  const imagens = (p.imagens && p.imagens.length)
    ? p.imagens
    : [{ url: null }];

  imagensUrls = imagens
    .map(function(img) {
      return img.url;
    })
    .filter(function(u) {
      return u;
    });

  if (
    p.imagemPrincipal &&
    imagensUrls.indexOf(p.imagemPrincipal) === -1
  ) {
    imagensUrls.unshift(p.imagemPrincipal);
  }

  const img = p.imagemPrincipal
    ? '<img src="' + p.imagemPrincipal + '" alt="" />'
    : '<div class="produto-card__sem-imagem">📦</div>';

  const preco = p.temPromo
    ? '<div class="produto__preco-antigo">R$ ' +
      p.preco.toFixed(2) +
      '</div><div class="produto__preco produto__preco--promo" id="preco-principal">R$ ' +
      p.precoPromocional.toFixed(2) +
      '</div>'
    : '<div class="produto__preco" id="preco-principal">R$ ' +
      p.preco.toFixed(2) +
      '</div>';

  const miniaturas = imagens.length > 1
    ? '<div class="galeria__miniaturas" id="galeria-miniaturas">' +
      imagens.map(function(img, i) {
        return '<button class="galeria__miniatura ' +
          (i === 0 ? 'ativa' : '') +
          '" data-img="' +
          (img.url || '') +
          '" data-idx="' +
          i +
          '">' +
          (img.url
            ? '<img src="' + img.url + '" alt="" loading="lazy" />'
            : '') +
          '</button>';
      }).join('') +
      '</div>'
    : '';

  /* ============================================================
     GARANTIA PADRÃO
     ============================================================ */

  const garantiaPadraoMeses = Number(
    p.garantia_meses ||
    p.garantiaMeses ||
    p.garantia_padrao_meses ||
    0
  );

  const garantiaPadraoDescricao =
    p.garantia_descricao ||
    p.garantiaDescricao ||
    p.descricao_garantia ||
    '';

  const temGarantiaPadrao = garantiaPadraoMeses > 0;

  const seloGarantia = temGarantiaPadrao
    ? '<div class="selo-garantia">' +
      '<span class="selo-garantia__icone">🛡️</span>' +
      '<span class="selo-garantia__texto">' +
      '<strong>Garantia de ' +
      garantiaPadraoMeses +
      ' meses</strong> inclusa' +
      '</span>' +
      '</div>'
    : '';

  /* ============================================================
     GARANTIAS ESTENDIDAS
     ============================================================ */

  const garantiasEstendidas =
    p.garantias_estendidas ||
    p.garantiasEstendidas ||
    p.garantia_estendida_opcoes ||
    [];

  let blocoGarantiaEstendida = '';

  if (
    Array.isArray(garantiasEstendidas) &&
    garantiasEstendidas.length
  ) {

    blocoGarantiaEstendida =
      '<div class="garantia-estendida">' +

      '<div class="garantia-estendida__titulo">' +
      '🛡️ Garantia estendida' +
      '</div>' +

      '<label class="garantia-estendida__opcao">' +

      '<input type="radio" ' +
      'name="garantia-estendida" ' +
      'value="sem" checked>' +

      '<div class="garantia-estendida__info">' +
      '<div class="garantia-estendida__titulo-opcao">' +
      'Sem garantia estendida' +
      '</div>' +
      '<div class="garantia-estendida__desc">' +
      'Manter apenas a garantia padrão do produto' +
      '</div>' +
      '</div>' +

      '<div class="garantia-estendida__preco">' +
      'Grátis' +
      '</div>' +

      '</label>' +

      garantiasEstendidas.map(function(g, index) {

        const meses = Number(
          g.meses ||
          g.meses_adicionais ||
          g.periodo ||
          0
        );

        const precoGarantia = Number(
          g.preco ||
          g.valor ||
          g.preco_garantia ||
          0
        );

        const descricao =
          g.descricao ||
          g.descricao_garantia ||
          '';

        if (!meses) return '';

        return (
          '<label class="garantia-estendida__opcao" ' +
          'data-garantia-index="' + index + '">' +

          '<input type="radio" ' +
          'name="garantia-estendida" ' +
          'value="' + index + '" ' +
          'data-meses="' + meses + '" ' +
          'data-preco="' + precoGarantia + '" ' +
          'data-descricao="' +
          esc(descricao) +
          '">' +

          '<div class="garantia-estendida__info">' +

          '<div class="garantia-estendida__titulo-opcao">' +
          '+' + meses + ' meses de garantia' +
          '</div>' +

          '<div class="garantia-estendida__desc">' +
          (descricao
            ? esc(descricao)
            : 'Confira os detalhes da garantia') +
          '</div>' +

          '</div>' +

          '<div class="garantia-estendida__preco">' +
          'R$ ' +
          precoGarantia.toFixed(2) +
          '</div>' +

          '</label>'
        );
      }).join('') +

      '<div id="preco-garantia-aviso" ' +
      'class="produto__preco-garantia-aviso">' +
      '</div>' +

      '</div>';
  }

  /* ============================================================
     CONTEÚDO PRINCIPAL
     ============================================================ */

  document.getElementById('conteudo-produto').innerHTML =

    '<div class="produto">' +

    '<div class="produto__galeria">' +

    '<div class="galeria__principal" id="galeria-principal">' +
    img +
    '</div>' +

    miniaturas +

    '</div>' +

    '<div class="produto__info">' +

    '<div class="produto__condicao">' +
    esc(cond) +
    '</div>' +

    '<h1 class="produto__titulo">' +
    esc(p.nome) +
    '</h1>' +

    '<div class="produto__disponibilidade">' +
    esc(disp) +
    '</div>' +

    '<div id="preco-area">' +
    preco +
    '</div>' +

    seloGarantia +

    blocoGarantiaEstendida +

    (p.descricao
      ? '<div class="produto__descricao">' +
        esc(p.descricao) +
        '</div>'
      : '') +

    '<div class="produto__acoes">' +

    '<button id="btn-comprar" ' +
    'class="btn btn--principal">' +
    'Comprar agora' +
    '</button>' +

    '<button id="btn-carrinho" ' +
    'class="btn btn--secundario">' +
    'Adicionar ao carrinho' +
    '</button>' +

    '<button id="btn-proposta" ' +
    'class="btn btn--secundario">' +
    'Fazer proposta' +
    '</button>' +

    '<button id="btn-chat" ' +
    'class="btn btn--secundario">' +
    'Conversar com a loja' +
    '</button>' +

    '<button id="btn-whatsapp" ' +
    'class="btn btn--secundario">' +
    'WhatsApp' +
    '</button>' +

    '</div>' +

    '</div>' +

    '</div>';

  /* ============================================================
     GALERIA
     ============================================================ */

  document.querySelectorAll(
    '.galeria__miniatura'
  ).forEach(function(btn) {

    btn.addEventListener('click', function() {

      const idx = Number(
        btn.getAttribute('data-idx') || 0
      );

      const url =
        btn.getAttribute('data-img');

      if (url) {

        const principal =
          document.getElementById(
            'galeria-principal'
          );

        principal.innerHTML =
          '<img src="' +
          url +
          '" alt="" />';

      }

      document.querySelectorAll(
        '.galeria__miniatura'
      ).forEach(function(b) {
        b.classList.remove('ativa');
      });

      btn.classList.add('ativa');
    });

  });

  /* ============================================================
     GARANTIA — EVENTOS
     ============================================================ */

  const radiosGarantia =
    document.querySelectorAll(
      'input[name="garantia-estendida"]'
    );

  radiosGarantia.forEach(function(radio) {

    radio.addEventListener('change', function() {

      document.querySelectorAll(
        '.garantia-estendida__opcao'
      ).forEach(function(opcao) {
        opcao.classList.remove('selecionada');
      });

      const opcaoSelecionada =
        radio.closest(
          '.garantia-estendida__opcao'
        );

      if (opcaoSelecionada) {
        opcaoSelecionada.classList.add(
          'selecionada'
        );
      }

      if (radio.value === 'sem') {

        garantiaSelecionada = null;

        atualizarPrecoGarantia();

        return;
      }

      const meses =
        Number(
          radio.getAttribute('data-meses') || 0
        );

      const precoGarantia =
        Number(
          radio.getAttribute('data-preco') || 0
        );

      const descricao =
        radio.getAttribute(
          'data-descricao'
        ) || '';

      const garantia = {
        meses: meses,
        preco: precoGarantia,
        descricao: descricao
      };

      abrirModalGarantia(
        p,
        garantia,
        function(confirmada) {

          if (!confirmada) {

            const semGarantia =
              document.querySelector(
                'input[name="garantia-estendida"][value="sem"]'
              );

            if (semGarantia) {
              semGarantia.checked = true;
            }

            garantiaSelecionada = null;

            document.querySelectorAll(
              '.garantia-estendida__opcao'
            ).forEach(function(opcao) {
              opcao.classList.remove(
                'selecionada'
              );
            });

            atualizarPrecoGarantia();

            return;
          }

          garantiaSelecionada = garantia;

          atualizarPrecoGarantia();
        }
      );

    });

  });

  /* ============================================================
     ESTADO INICIAL
     ============================================================ */

  const radioInicial =
    document.querySelector(
      'input[name="garantia-estendida"][value="sem"]'
    );

  if (radioInicial) {
    const opcaoInicial =
      radioInicial.closest(
        '.garantia-estendida__opcao'
      );

    if (opcaoInicial) {
      opcaoInicial.classList.add(
        'selecionada'
      );
    }
  }

  /* ============================================================
     BOTÃO CARRINHO
     ============================================================ */

  document.getElementById(
    'btn-carrinho'
  ).onclick = function() {

    adicionarAoCarrinho(
      p,
      garantiaSelecionada
    );

    mostrarToast(
      'Produto adicionado',
      garantiaSelecionada
        ? 'Produto + garantia estendida adicionados ao carrinho.'
        : 'Produto adicionado ao carrinho.'
    );
  };

  /* ============================================================
     BOTÃO COMPRAR
     ============================================================ */

  document.getElementById(
    'btn-comprar'
  ).onclick = function() {

    adicionarAoCarrinho(
      p,
      garantiaSelecionada
    );

    location.href =
      './carrinho.html';
  };

  /* ============================================================
     PROPOSTA
     ============================================================ */

  document.getElementById(
    'btn-proposta'
  ).onclick = async function() {

    const { supabase } =
      await import(
        './assets/js/supabase.js'
      );

    const r =
      await supabase.auth.getUser();

    if (
      !r.data ||
      !r.data.user
    ) {

      mostrarAviso(
        'Faça login',
        'Você precisa estar logado para enviar proposta.',
        'Fazer login',
        './login.html'
      );

      return;
    }

    abrirModalProposta(p);
  };

  /* ============================================================
     CHAT
     ============================================================ */

  document.getElementById(
    'btn-chat'
  ).onclick = async function() {

    const { supabase } =
      await import(
        './assets/js/supabase.js'
      );

    const r =

/* ============================================================
   CARRINHO
   ============================================================ */

function adicionarAoCarrinho(
  produto,
  garantia
) {

  try {

    const c =
      JSON.parse(
        localStorage.getItem(
          'carrinho'
        ) || '[]'
      );

    const precoBase =
      produto.temPromo
        ? produto.precoPromocional
        : produto.preco;

    const precoFinal =
      precoBase +
      (
        garantia
          ? Number(
              garantia.preco || 0
            )
          : 0
      );

    const chaveGarantia =
      garantia
        ? (
            garantia.meses +
            '_' +
            garantia.preco
          )
        : 'sem';

    const idx =
      c.findIndex(function(i) {

        if (
          i.id !== produto.id
        ) {
          return false;
        }

        const iChave =
          i.garantia_estendida
            ? (
                i.garantia_estendida.meses +
                '_' +
                i.garantia_estendida.preco
              )
            : 'sem';

        return (
          iChave ===
          chaveGarantia
        );
      });

    if (idx >= 0) {

      c[idx].quantidade += 1;

    } else {

      const item = {

        id: produto.id,

        nome: produto.nome,

        preco: precoFinal,

        preco_base: precoBase,

        imagem:
          produto.imagemPrincipal,

        quantidade: 1
      };

      if (garantia) {

        item.garantia_estendida = {

          meses:
            garantia.meses,

          preco:
            garantia.preco,

          descricao:
            garantia.descricao || ''
        };
      }

      c.push(item);
    }

    localStorage.setItem(
      'carrinho',
      JSON.stringify(c)
    );

  } catch (e) {

    console.error(
      '[carrinho] erro:',
      e
    );
  }
}

/* ============================================================
   BADGE DO CARRINHO
   ============================================================ */

function atualizarBadgeCarrinho() {

  try {

    const c =
      JSON.parse(
        localStorage.getItem(
          'carrinho'
        ) || '[]'
      );

    const total =
      c.reduce(
        function(s, i) {
          return s +
            (i.quantidade || 0);
        },
        0
      );

    const badge =
      document.getElementById(
        'badge-carrinho'
      );

    if (badge) {

      if (total > 0) {

        badge.textContent =
          total;

        badge.classList.remove(
          'oculto'
        );

      } else {

        badge.classList.add(
          'oculto'
        );
      }
    }

  } catch (e) {}
}

/* ============================================================

   ============================================================ */

function mostrarToast(
  titulo,
  mensagem
) {

  let area =
    document.querySelector(
      '.toast-area-cart'
    );

  if (!area) {

    area =
      document.createElement(
        'div'
      );

    area.className =
      'toast-area-cart';

    area.style.cssText =
      'position:fixed;' +
      'top:20px;' +
      'right:20px;' +
      'z-index:99999;' +
      'display:flex;' +
      'flex-direction:column;' +
      'gap:10px;' +
      'pointer-events:none;' +
      'max-width:calc(100% - 40px);';

    document.body.appendChild(
      area
    );
  }

  const el =
    document.createElement(
      'div'
    );

  el.style.cssText =
    'background:#dcfce7;' +
    'color:#166534;' +
    'border-left:4px solid #16a34a;' +
    'padding:12px 16px;' +
    'border-radius:10px;' +
    'box-shadow:0 8px 20px rgba(15,23,42,.15);' +
    'font-family:system-ui,sans-serif;' +
    'font-size:14px;' +
    'min-width:240px;' +
    'pointer-events:auto;' +
    'opacity:0;' +
    'transform:translateX(20px);' +
    'transition:all .25s;';

  el.innerHTML =
    '<div style="font-weight:700;margin-bottom:2px;">' +
    esc(titulo) +
    '</div>' +

    (
      mensagem
        ? '<div style="font-size:12px;opacity:.85;">' +
          esc(mensagem) +
          '</div>'
        : ''
    );

  area.appendChild(el);

  requestAnimationFrame(
    function() {

      el.style.opacity =
        '1';

      el.style.transform =
        'translateX(0)';
    }
  );

  setTimeout(
    function() {

      el.style.opacity =
        '0';

      el.style.transform =
        'translateX(20px)';

      setTimeout(
        function() {
          el.remove();
        },
        300
      );

    },
    3000
  );
}

/* ============================================================
   ESCAPE HTML
   ============================================================ */

function esc(s) {

  return s == null
    ? ''
    : String(s).replace(
        /[&<>"']/g,
        function(m) {

          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[m];
        }
      );
}
