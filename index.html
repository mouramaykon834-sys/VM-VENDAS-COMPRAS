<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minha Loja — Produtos e ofertas</title>
<meta name="description" content="Loja virtual com produtos novos, usados e seminovos." />

<link rel="stylesheet" href="./assets/css/tokens.css" />
<link rel="stylesheet" href="./assets/css/base.css" />
<link rel="stylesheet" href="./assets/css/layout.css" />
<link rel="stylesheet" href="./assets/css/components.css" />
<link rel="stylesheet" href="./assets/css/store.css" />

</head>

<body>

<div id="header"></div>

<main class="conteudo">
<div class="container">

<!-- CARROSSEL -->
<div id="home-carrossel"></div>

<!-- BANNER PADRÃO -->
<section class="banner-home" id="banner">
  <div class="banner-home__conteudo">
    <h1 class="banner-home__titulo" id="home-titulo">Bem-vindo à nossa loja</h1>
    <p class="banner-home__subtitulo" id="home-subtitulo">Encontre produtos novos, usados e seminovos com preços imperdíveis.</p>
    <a href="./produtos.html" class="btn btn--destaque btn--lg">Ver todos os produtos</a>
  </div>
</section>

<!-- CATEGORIAS -->
<section class="secao" id="secao-categorias" style="display:none;">
  <div class="secao__cabecalho">
    <h2 class="secao__titulo">Categorias</h2>
    <a href="./produtos.html" class="secao__link">Ver todas</a>
  </div>
  <div class="categorias-circulos" id="lista-categorias"></div>
</section>

<!-- DESTAQUES -->
<section class="secao">
  <div class="secao__cabecalho">
    <h2 class="secao__titulo">Produtos em destaque</h2>
    <a href="./produtos.html" class="secao__link">Ver todos</a>
  </div>
  <div class="carrossel-produtos">
    <button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--prev" aria-label="Anterior" hidden>‹</button>
    <div id="lista-destaques" class="carrossel-produtos__trilho">
      <div class="carregando"><div class="spinner"></div></div>
    </div>
    <button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--next" aria-label="Próximo" hidden>›</button>
  </div>
</section>

<!-- OFERTAS -->
<section class="secao">
  <div class="secao__cabecalho">
    <h2 class="secao__titulo">Ofertas</h2>
    <a href="./produtos.html?ordenar=menor-preco" class="secao__link">Ver todas</a>
  </div>
  <div class="carrossel-produtos">
    <button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--prev" aria-label="Anterior" hidden>‹</button>
    <div id="lista-ofertas" class="carrossel-produtos__trilho">
      <div class="carregando"><div class="spinner"></div></div>
    </div>
    <button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--next" aria-label="Próximo" hidden>›</button>
  </div>
</section>

<!-- SEÇÕES POR CATEGORIA (estilo Mercado Livre) -->
<div id="categorias-produtos"></div>

</div>
</main>

<div id="footer"></div>

<script type="module">

/* ============================================================
   HEADER / FOOTER
   ============================================================ */

Promise.all([
  import('./assets/js/components/header.js')
    .then(m => m.renderHeader('inicio'))
    .catch(e => console.error('[header]', e)),
  import('./assets/js/components/footer.js')
    .then(m => m.renderFooter())
    .catch(e => console.error('[footer]', e))
]);

/* ============================================================
   CARROSSEL DE BANNERS
   ============================================================ */

(async () => {
  try {
    const mod = await import('./assets/js/components/carrossel.js');
    await mod.iniciarCarrossel();
  } catch (e) {
    console.warn('[carrossel] não iniciado:', e);
  }
})();

/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */

(async () => {
  try {
    const mod = await import('./assets/js/services/settings.service.js');
    const cfg = await mod.iniciarConfiguracoes();
    const store = cfg.store || {};

    if (store.banner_home_url) {
      const b = document.getElementById('banner');
      b.style.background = 'linear-gradient(rgba(15,23,42,.4), rgba(15,23,42,.6)), url(' + store.banner_home_url + ') center/cover';
    }

    if (store.titulo_home) {
      document.getElementById('home-titulo').textContent = store.titulo_home;
    }

    if (store.subtitulo_home) {
      document.getElementById('home-subtitulo').textContent = store.subtitulo_home;
    }
  } catch (e) {}
})();

/* ============================================================
   CATEGORIAS (círculos no topo)
   ============================================================ */

(async () => {
  try {
    const { supabase } = await import('./assets/js/supabase.js');

    const r = await supabase
      .from('categories')
      .select('id, nome, slug, imagem_url')
      .eq('ativo', true)
      .order('ordem', { ascending: true })
      .order('nome', { ascending: true });

    if (r.error || !r.data || !r.data.length) {
      return;
    }

    const secao = document.getElementById('secao-categorias');
    secao.style.display = 'block';

    const lista = document.getElementById('lista-categorias');

    lista.innerHTML = r.data.map(function (c) {
      const img = c.imagem_url
        ? '<img src="' + c.imagem_url + '" alt="' + esc(c.nome) + '" loading="lazy" />'
        : '<div class="categorias-circulos__placeholder">' + esc(c.nome.charAt(0).toUpperCase()) + '</div>';

      return (
        '<a href="./produtos.html?categoria=' + c.id + '" class="categorias-circulos__item">' +
          '<div class="categorias-circulos__imagem">' + img + '</div>' +
          '<div class="categorias-circulos__nome">' + esc(c.nome) + '</div>' +
        '</a>'
      );
    }).join('');
  } catch (e) {
    console.warn('[categorias] erro:', e);
  }
})();

/* ============================================================
   PRODUTOS DA HOME
   ============================================================ */

(async () => {
  try {
    const mod = await import('./assets/js/services/products.service.js');

    // Carrega destaques + ofertas em paralelo (essas continuam "eager")
    await Promise.all([
      carregarSecao('lista-destaques', mod.listarDestaques, 'Nenhum produto em destaque ainda', mod),
      carregarSecao('lista-ofertas', mod.listarOfertas, 'Nenhuma oferta no momento', mod)
    ]);

    // Carrega as seções por categoria com LAZY LOAD
    await carregarCategoriasComLazyLoad(mod);

    // Ativa as setas dos carrosséis que já existem (destaques + ofertas)
    ativarSetasCarrossel();
  } catch (e) {
    console.warn('[home] erro ao carregar produtos:', e);
  }
})();

async function carregarSecao(id, fn, textoVazio, mod) {
  const el = document.getElementById(id);
  if (!el) return;

  try {
    const produtos = await Promise.race([
      fn(12),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
    ]);

    if (!produtos || !produtos.length) {
      el.innerHTML =
        '<div class="estado-vazio" style="flex:0 0 100%;width:100%;">' +
          '<div class="estado-vazio__titulo">' + textoVazio + '</div>' +
          '<p class="estado-vazio__descricao">Em breve novos produtos.</p>' +
        '</div>';
      return;
    }

    el.innerHTML = produtos.map(p => cardProduto(p, mod)).join('');
    ativarFavoritosCards();
  } catch (e) {
    el.innerHTML =
      '<div class="estado-vazio" style="flex:0 0 100%;width:100%;">' +
        '<div class="estado-vazio__titulo">' + textoVazio + '</div>' +
      '</div>';
  }
}

/* ============================================================
   SEÇÕES POR CATEGORIA — COM LAZY LOAD (IntersectionObserver)
   ============================================================
   Estrutura:
   1. Renderiza um "esqueleto" de cada categoria de imediato
      (cabeçalho + skeleton de cards) — aparece rápido na tela.
   2. Quando a seção se aproxima da viewport (200px antes),
      busca os produtos e substitui o skeleton pelos cards.
   3. Uma vez carregada, a seção é "desobservada" (não carrega 2x).
   ============================================================ */

async function carregarCategoriasComLazyLoad(mod) {
  const container = document.getElementById('categorias-produtos');
  if (!container) return;

  let categorias = [];

  try {
    categorias = await mod.listarCategorias();
  } catch (e) {
    console.warn('[categorias-produtos] erro ao listar:', e);
    return;
  }

  if (!categorias || !categorias.length) {
    return;
  }

  // 1. Renderiza o "esqueleto" de cada seção (skeleton + cabeçalho)
  container.innerHTML = categorias.map(function (cat) {
    return montarEsqueletoCategoria(cat);
  }).join('');

  // 2. Configura o IntersectionObserver
  //    rootMargin: 300px → começa a carregar 300px ANTES da seção aparecer
  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;

        const secao = entry.target;
        const categoriaId = secao.dataset.categoriaId;
        const categoriaNome = secao.dataset.categoriaNome;

        // Para de observar (não recarrega se voltar)
        observer.unobserve(secao);

        // Carrega os produtos daquela categoria
        carregarProdutosDaSecao(secao, categoriaId, categoriaNome, mod);
      });
    },
    {
      rootMargin: '300px 0px',
      threshold: 0
    }
  );

  // 3. Observa todas as seções recém-inseridas
  container.querySelectorAll('.secao[data-categoria-id]').forEach(function (secao) {
    observer.observe(secao);
  });
}

function montarEsqueletoCategoria(cat) {
  // Skeleton: 6 cards fake, imitando os produtos reais
  const skeletons = Array(6).fill(0).map(function () {
    return (
      '<div class="skeleton-card">' +
        '<div class="skeleton-card__imagem skeleton"></div>' +
        '<div class="skeleton-card__info">' +
          '<div class="skeleton skeleton-linha skeleton-linha--curta"></div>' +
          '<div class="skeleton skeleton-linha skeleton-linha--longa"></div>' +
          '<div class="skeleton skeleton-linha skeleton-linha--preco"></div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  return (
    '<section class="secao" ' +
      'data-categoria-id="' + cat.id + '" ' +
      'data-categoria-nome="' + esc(cat.nome) + '">' +
      '<div class="secao__cabecalho">' +
        '<h2 class="secao__titulo">' + esc(cat.nome) + '</h2>' +
        '<a href="./produtos.html?categoria=' + cat.id + '" class="secao__link">Ver todos</a>' +
      '</div>' +
      '<div class="carrossel-produtos">' +
        '<button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--prev" aria-label="Anterior" hidden>‹</button>' +
        '<div class="carrossel-produtos__trilho">' + skeletons + '</div>' +
        '<button type="button" class="carrossel-produtos__seta carrossel-produtos__seta--next" aria-label="Próximo" hidden>›</button>' +
      '</div>' +
    '</section>'
  );
}

async function carregarProdutosDaSecao(secao, categoriaId, categoriaNome, mod) {
  const trilho = secao.querySelector('.carrossel-produtos__trilho');
  if (!trilho) return;

  try {
    const produtos = await Promise.race([
      mod.listarPorCategoria(categoriaId, 12),
      new Promise(function (_, rej) {
        setTimeout(function () { rej(new Error('timeout')); }, 8000);
      })
    ]);

    // Sem produtos: remove a seção da tela
    if (!produtos || !produtos.length) {
      secao.remove();
      return;
    }

    // Substitui os skeletons pelos cards reais
    trilho.innerHTML = produtos.map(function (p) {
      return cardProduto(p, mod);
    }).join('');

    // Reativa favoritos e setas SÓ dessa seção
    ativarFavoritosCards();
    ativarSetasCarrosselEm(secao);
  } catch (e) {
    console.warn('[categoria ' + categoriaNome + '] erro:', e);

    // Se der erro, remove a seção silenciosamente
    secao.remove();
  }
}

/* ============================================================
   MOEDA BRASILEIRA
   ============================================================ */

function formatarMoedaBR(valor) {
  const numero = Number(valor) || 0;
  return numero.toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

/* ============================================================
   CARD DO PRODUTO
   ============================================================ */

function cardProduto(p, mod) {
  const disp = mod.rotuloDisponibilidade(p);

  const img = p.imagemPrincipal
    ? '<img src="' + p.imagemPrincipal + '" alt="" loading="lazy" />'
    : '<div class="produto-card__sem-imagem">📦</div>';

  const preco = p.temPromo
    ? '<div class="produto-card__preco-antigo">R$ ' + formatarMoedaBR(p.preco) + '</div>' +
      '<div class="produto-card__preco produto-card__preco--promo">R$ ' + formatarMoedaBR(p.precoPromocional) + '</div>'
    : '<div class="produto-card__preco">R$ ' + formatarMoedaBR(p.preco) + '</div>';

  return (
    '<article class="produto-card">' +
      '<a href="./produto.html?id=' + p.id + '" class="produto-card__imagem">' +
        img +
        '<div class="produto-card__selos">' +
          (p.temPromo ? '<span class="badge badge--destaque">-' + p.descontoPct + '%</span>' : '') +
          (p.destaque ? '<span class="badge badge--principal">Destaque</span>' : '') +
        '</div>' +
      '</a>' +
      '<button type="button" class="produto-card__favorito" data-fav="' + p.id + '" title="Favoritar" aria-label="Favoritar">♡</button>' +
      '<div class="produto-card__info">' +
        '<div class="produto-card__condicao">' + mod.rotuloCondicao(p.condicao) + '</div>' +
        '<a href="./produto.html?id=' + p.id + '" class="produto-card__nome">' + esc(p.nome) + '</a>' +
        preco +
        '<div><span class="badge badge--' + disp.tipo + '">' + disp.texto + '</span></div>' +
        '<div class="produto-card__acoes">' +
          '<a href="./produto.html?id=' + p.id + '" class="btn btn--principal btn--sm">Comprar</a>' +
          '<a href="./produto.html?id=' + p.id + '#proposta" class="btn btn--contorno btn--sm">Proposta</a>' +
        '</div>' +
      '</div>' +
    '</article>'
  );
}

/* ============================================================
   FAVORITOS
   ============================================================ */

async function ativarFavoritosCards() {
  try {
    const { supabase } = await import('./assets/js/supabase.js');
    const { alternarFavorito } = await import('./assets/js/components/cart-widget.js');

    const { data: { user } } = await supabase.auth.getUser();

    let favoritos = new Set();

    if (user) {
      const r = await supabase
        .from('favorites')
        .select('product_id')
        .eq('user_id', user.id);

      (r.data || []).forEach(function (f) {
        favoritos.add(f.product_id);
      });
    }

    document.querySelectorAll('.produto-card__favorito').forEach(function (btn) {
      if (btn.dataset.favAtivo) return;
      btn.dataset.favAtivo = '1';

      const id = btn.dataset.fav;

      if (favoritos.has(id)) {
        btn.classList.add('ativo');
        btn.textContent = '♥';
      }

      btn.onclick = async function (e) {
        e.preventDefault();
        e.stopPropagation();

        if (!user) {
          window.location.href = './login.html?redirect=' + encodeURIComponent(window.location.pathname);
          return;
        }

        try {
          const virouFavorito = await alternarFavorito(id);

          if (virouFavorito) {
            btn.classList.add('ativo');
            btn.textContent = '♥';
          } else {
            btn.classList.remove('ativo');
            btn.textContent = '♡';
          }
        } catch (err) {
          console.warn('[favorito] erro:', err);
        }
      };
    });
  } catch (e) {
    console.warn('[favoritos] erro ao ativar:', e);
  }
}

/* ============================================================
   SETAS DOS CARROSSÉIS HORIZONTAIS
   ============================================================ */

function ativarSetasCarrossel() {
  document.querySelectorAll('.carrossel-produtos').forEach(function (wrapper) {
    ativarSetasCarrosselEm(wrapper);
  });
}

function ativarSetasCarrosselEm(escopo) {
  // Se for um wrapper .carrossel-produtos, usa direto.
  // Se for uma <section>, busca o carrossel dentro dela.
  const wrappers = escopo.classList && escopo.classList.contains('carrossel-produtos')
    ? [escopo]
    : escopo.querySelectorAll('.carrossel-produtos');

  wrappers.forEach(function (wrapper) {
    const trilho = wrapper.querySelector('.carrossel-produtos__trilho');
    const setaPrev = wrapper.querySelector('.carrossel-produtos__seta--prev');
    const setaNext = wrapper.querySelector('.carrossel-produtos__seta--next');

    if (!trilho || !setaPrev || !setaNext) return;

    // Evita duplicar eventos
    if (trilho.dataset.setasAtivas) return;
    trilho.dataset.setasAtivas = '1';

    function atualizarSetas() {
      const scrollLeft = trilho.scrollLeft;
      const scrollMax = trilho.scrollWidth - trilho.clientWidth;

      setaPrev.hidden = scrollLeft <= 4;
      setaNext.hidden = scrollLeft >= scrollMax - 4;
    }

    function rolarPasso(direcao) {
      const card = trilho.querySelector('.produto-card');
      const passo = card ? (card.offsetWidth + 12) * 2 : trilho.clientWidth * 0.8;
      trilho.scrollBy({ left: direcao * passo, behavior: 'smooth' });
    }

    setaPrev.addEventListener('click', function () { rolarPasso(-1); });
    setaNext.addEventListener('click', function () { rolarPasso(1); });

    trilho.addEventListener('scroll', atualizarSetas, { passive: true });
    window.addEventListener('resize', atualizarSetas);

    setTimeout(atualizarSetas, 300);
    setTimeout(atualizarSetas, 1500);
  });
}

/* ============================================================
   ESCAPE HTML
   ============================================================ */

function esc(s) {
  return s == null
    ? ''
    : String(s).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
}

</script>

</body>
</html>
