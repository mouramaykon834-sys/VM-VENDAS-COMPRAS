<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagens — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>
  <main class="conteudo">
    <div class="container">
      <div class="migalhas"><a href="./index.html">Início</a><span>Mensagens</span></div>
      <h1 class="pagina-titulo">Minhas mensagens</h1>
      <div id="conteudo"><div class="carregando"><div class="spinner spinner--lg"></div></div></div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
    import { supabase } from './assets/js/supabase.js';
    import { listarMinhasConversas } from './assets/js/services/chat.service.js';

    await iniciarConfiguracoes();
    await renderHeader('chat');
    await renderFooter();

    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    (async () => {
      const r = await supabase.auth.getSession();
      if (!r.data?.session) {
        el.innerHTML = `<div class="estado-vazio"><div class="estado-vazio__titulo">Faça login</div><a href="./login.html?redirect=chat.html" class="btn btn--principal">Fazer login</a></div>`;
        return;
      }
      try {
        const conversas = await listarMinhasConversas();
        if (!conversas.length) {
          el.innerHTML = `<div class="estado-vazio"><div class="estado-vazio__titulo">Nenhuma conversa ainda</div><p class="estado-vazio__descricao">Quando você conversar com a loja, as mensagens aparecerão aqui.</p><a href="./produtos.html" class="btn btn--principal">Ver produtos</a></div>`;
          return;
        }
        el.innerHTML = conversas.map(c => {
          const img = (c.products?.product_images || []).slice().sort((a,b) => (b.principal?1:0)-(a.principal?1:0))[0]?.url;
          return `
            <a href="./conversa.html?id=${c.id}" class="cartao" style="display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;margin-bottom:12px;text-decoration:none;color:inherit;">
              ${img ? `<img src="${img}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;" />` : `<div style="width:56px;height:56px;background:#f1f5f9;border-radius:8px;"></div>`}
              <div>
                <strong>${esc(c.assunto || 'Conversa')}</strong>
                <div style="font-size:12px;color:var(--cor-texto-suave);margin-top:4px;">${esc((c.ultima_msg || '').slice(0, 60))}</div>
              </div>
              <div style="text-align:right;">
                ${c.nao_lidas_cliente > 0 ? `<span class="badge badge--principal">${c.nao_lidas_cliente}</span>` : ''}
                <div style="font-size:11px;color:var(--cor-texto-suave);margin-top:6px;">${c.ultima_msg_at ? new Date(c.ultima_msg_at).toLocaleDateString('pt-BR') : ''}</div>
              </div>
            </a>
          `;
        }).join('');
      } catch (e) { el.innerHTML = `<div class="alerta alerta--erro">${esc(e.message)}</div>`; }
    })();
  </script>
</body>
</html>
