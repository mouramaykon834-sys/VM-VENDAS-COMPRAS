<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
  <style>
    .tela-auth { min-height: calc(100vh - var(--altura-header)); display: flex; align-items: center; justify-content: center; padding: var(--esp-6) var(--esp-4); }
    .cartao-auth { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--cor-borda); border-radius: var(--raio-xl); padding: var(--esp-8); box-shadow: var(--sombra-md); }
    .cartao-auth h1 { font-size: var(--texto-2xl); margin-bottom: var(--esp-2); text-align: center; }
    .cartao-auth p.sub { color: var(--cor-texto-suave); text-align: center; margin-bottom: var(--esp-6); font-size: var(--texto-sm); }
    .cartao-auth__rodape { margin-top: var(--esp-5); padding-top: var(--esp-5); border-top: 1px solid var(--cor-borda); text-align: center; font-size: var(--texto-sm); color: var(--cor-texto-suave); }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="tela-auth">
    <div class="cartao-auth">
      <h1>Recuperar senha</h1>
      <p class="sub">Enviaremos um link de redefinição para seu e-mail.</p>

      <div id="msg"></div>

      <form id="form-recuperar" novalidate>
        <div class="campo">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" required />
        </div>
        <button type="submit" class="btn btn--principal btn--bloco btn--lg" id="btn-enviar">
          Enviar link de recuperação
        </button>
      </form>

      <div class="cartao-auth__rodape">
        Lembrou a senha? <a href="./login.html"><strong>Entrar</strong></a>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';
    import { supabase } from './assets/js/supabase.js';

    await iniciarConfiguracoes();
    await renderHeader();
    await renderFooter();

    const form = document.getElementById('form-recuperar');
    const btn = document.getElementById('btn-enviar');
    const msg = document.getElementById('msg');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    form.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { msg.innerHTML = '<div class="alerta alerta--erro">Informe seu e-mail.</div>'; return; }

      btn.disabled = true; btn.textContent = 'Enviando...';

      try {
        const redirectTo = `${location.origin}${location.pathname.replace('recuperar-senha.html', 'perfil.html')}`;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;

        msg.innerHTML = '<div class="alerta alerta--sucesso">✅ Se o e-mail estiver cadastrado, você receberá o link em alguns minutos. Verifique também a caixa de spam.</div>';
        btn.textContent = 'E-mail enviado';
      } catch (err) {
        console.error(err);
        msg.innerHTML = `<div class="alerta alerta--erro">${esc(err.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Enviar link de recuperação';
      }
    };
  </script>
</body>
</html>
