<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
  <style>
    .tela-auth { min-height: calc(100vh - var(--altura-header)); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .cartao-auth { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--cor-borda); border-radius: 16px; padding: 32px; box-shadow: var(--sombra-md); }
    .cartao-auth h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
    .cartao-auth p.sub { color: var(--cor-texto-suave); text-align: center; margin-bottom: 24px; font-size: 14px; }
    .cartao-auth__rodape { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--cor-borda); text-align: center; font-size: 14px; color: var(--cor-texto-suave); }
    .erro-msg { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
    .erro-msg.visivel { display: block; }
    .ok-msg { background: #dcfce7; color: #166534; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
    .ok-msg.visivel { display: block; }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="tela-auth">
    <div class="cartao-auth">
      <h1>Recuperar senha</h1>
      <p class="sub">Enviaremos um link de redefinição para seu e-mail.</p>

      <div id="erro" class="erro-msg"></div>
      <div id="ok" class="ok-msg"></div>

      <form id="form" novalidate>
        <div class="campo">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" required />
        </div>

        <button type="submit" class="btn btn--principal btn--bloco btn--lg" id="btn">
          Enviar link
        </button>
      </form>

      <div class="cartao-auth__rodape">
        Lembrou a senha? <a href="./login.html"><strong>Entrar</strong></a>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module">
    (async () => {
      try {
        const { renderHeader } = await import('./assets/js/components/header.js');
        const { renderFooter } = await import('./assets/js/components/footer.js');
        await renderHeader();
        await renderFooter();
      } catch (e) {}
    })();

    document.getElementById('form').onsubmit = async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn');
      const erro = document.getElementById('erro');
      const ok = document.getElementById('ok');

      erro.classList.remove('visivel');
      ok.classList.remove('visivel');

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const { enviarEmailRecuperacao } = await import('./assets/js/services/auth.service.js');
        await enviarEmailRecuperacao(email);

        document.getElementById('ok').textContent = 'Se o e-mail estiver cadastrado, você receberá o link em alguns minutos. Verifique também a caixa de spam.';
        document.getElementById('ok').classList.add('visivel');
        btn.textContent = 'E-mail enviado';
      } catch (err) {
        document.getElementById('erro').textContent = err.message || 'Erro ao enviar.';
        document.getElementById('erro').classList.add('visivel');
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    };
  </script>
</body>
</html>
