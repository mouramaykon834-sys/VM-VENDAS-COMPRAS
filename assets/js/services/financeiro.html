<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Financeiro — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
    .sidebar__logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; color: #fff; font-weight: 700; font-size: 15px; }
    .sidebar__badge { background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .sidebar__secao { padding: 16px 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; font-weight: 600; }
    .sidebar__lista { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .sidebar__item { padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; display: block; }
    .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar__item.ativo { background: #0ea5e9; color: #fff; }
    .main { display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { font-size: 18px; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #0ea5e9; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn--loja { padding: 8px 14px; border: 1px solid #0ea5e9; border-radius: 8px; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn--loja:hover { background: #0ea5e9; color: #fff; }
    .conteudo { padding: 24px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .card__rotulo { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 8px; }
    .card__valor { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .card--ok { border-color: #86efac; background: #f0fdf4; }
    .card--erro { border-color: #fca5a5; background: #fef2f2; }
    .card--alerta { border-color: #fcd34d; background: #fffbeb; }
    .acoes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .acao-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; text-decoration: none; color: inherit; display: block; transition: all .15s; }
    .acao-card:hover { border-color: #0ea5e9; transform: translateY(-2px); }
    .acao-card__titulo { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .acao-card__desc { font-size: 12px; color: #64748b; }
    .erro { padding: 20px; background: #fee2e2; color: #991b1b; border-radius: 8px; margin: 20px; font-family: monospace; }
    @media (max-width: 1024px) { .cards { grid-template-columns: repeat(2, 1fr); } .acoes-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 500px) { .cards { grid-template-columns: 1fr; } .acoes-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo"><span>🏠</span><span>Minha Loja</span><span class="sidebar__badge">ADMIN</span></div>
      <div class="sidebar__secao">Principal</div>
      <nav class="sidebar__lista">
        <a href="./index.html" class="sidebar__item">Dashboard</a>
        <a href="./pedidos.html" class="sidebar__item">Pedidos</a>
        <a href="./propostas.html" class="sidebar__item">Propostas</a>
        <a href="./conversas.html" class="sidebar__item">Conversas</a>
      </nav>
      <div class="sidebar__secao">Vendas</div>
      <nav class="sidebar__lista">
        <a href="./orcamentos.html" class="sidebar__item">Orçamentos</a>
      </nav>
      <div class="sidebar__secao">Financeiro</div>
      <nav class="sidebar__lista">
        <a href="./financeiro.html" class="sidebar__item ativo">Visão geral</a>
        <a href="./contas-receber.html" class="sidebar__item">Contas a receber</a>
        <a href="./contas-pagar.html" class="sidebar__item">Contas a pagar</a>
        <a href="./fluxo-caixa.html" class="sidebar__item">Fluxo de caixa</a>
      </nav>
      <div class="sidebar__secao">Catálogo</div>
      <nav class="sidebar__lista">
        <a href="./produtos.html" class="sidebar__item">Produtos</a>
        <a href="./categorias.html" class="sidebar__item">Categorias</a>
      </nav>
      <div class="sidebar__secao">Estoque</div>
      <nav class="sidebar__lista">
        <a href="./estoque.html" class="sidebar__item">Visão geral</a>
        <a href="./estoque-movimentar.html" class="sidebar__item">Movimentar</a>
      </nav>
      <div class="sidebar__secao">Compras</div>
      <nav class="sidebar__lista">
        <a href="./fornecedores.html" class="sidebar__item">Fornecedores</a>
        <a href="./compras.html" class="sidebar__item">Compras</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Financeiro</h1>
        <a href="../index.html" class="btn--loja">← Ver loja</a>
      </header>
      <div class="conteudo" id="conteudo"><div class="erro">Carregando...</div></div>
    </main>
  </div>

  <script type="module">
    const el = document.getElementById('conteudo');
    const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });

    (async () => {
      try {
        const { supabase } = await import('../assets/js/supabase.js');
        const r = await supabase.auth.getSession();
        if (!r.data || !r.data.session) { location.href = '../login.html'; return; }

        const mod = await import('../assets/js/services/financial.service.js');
        const res = await mod.resumoFinanceiro();

        el.innerHTML =
          '<div class="cards">' +
            '<div class="card card--ok">' +
              '<div class="card__rotulo">💰 Recebido (total)</div>' +
              '<div class="card__valor">R$ ' + res.recebido.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card card--erro">' +
              '<div class="card__rotulo">💸 Pago (total)</div>' +
              '<div class="card__valor">R$ ' + res.pago.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card ' + (res.saldo >= 0 ? 'card--ok' : 'card--erro') + '">' +
              '<div class="card__rotulo">📊 Saldo</div>' +
              '<div class="card__valor">R$ ' + res.saldo.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card__rotulo">📅 A receber</div>' +
              '<div class="card__valor">R$ ' + res.aReceber.toFixed(2) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="cards">' +
            '<div class="card">' +
              '<div class="card__rotulo">📅 A pagar</div>' +
              '<div class="card__valor">R$ ' + res.aPagar.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card ' + (res.atrasadoReceber > 0 ? 'card--alerta' : '') + '">' +
              '<div class="card__rotulo">⚠️ A receber atrasado</div>' +
              '<div class="card__valor">R$ ' + res.atrasadoReceber.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card ' + (res.atrasadoPagar > 0 ? 'card--alerta' : '') + '">' +
              '<div class="card__rotulo">⚠️ A pagar atrasado</div>' +
              '<div class="card__valor">R$ ' + res.atrasadoPagar.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card__rotulo">📈 Total a receber</div>' +
              '<div class="card__valor">R$ ' + res.totalReceber.toFixed(2) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="acoes-grid">' +
            '<a href="./contas-receber.html" class="acao-card">' +
              '<div class="acao-card__titulo">💰 Contas a receber</div>' +
              '<div class="acao-card__desc">Vendas, parcelas, juros</div>' +
            '</a>' +
            '<a href="./contas-pagar.html" class="acao-card">' +
              '<div class="acao-card__titulo">💸 Contas a pagar</div>' +
              '<div class="acao-card__desc">Despesas, fornecedores</div>' +
            '</a>' +
            '<a href="./fluxo-caixa.html" class="acao-card">' +
              '<div class="acao-card__titulo">📊 Fluxo de caixa</div>' +
              '<div class="acao-card__desc">Entradas e saídas por dia</div>' +
            '</a>' +
            '<a href="./conta-editar.html" class="acao-card">' +
              '<div class="acao-card__titulo">➕ Nova conta</div>' +
              '<div class="acao-card__desc">Lançar manualmente</div>' +
            '</a>' +
          '</div>';
      } catch (e) {
        el.innerHTML = '<div class="erro">Erro: ' + esc(e.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
