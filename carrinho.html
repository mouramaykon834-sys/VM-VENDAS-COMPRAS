<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho — Minha Loja</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />
</head>
<body>
  <div id="header"></div>

  <main class="conteudo">
    <div class="container">
      <div class="migalhas"><a href="./index.html">Início</a><span>Carrinho</span></div>
      <h1 class="pagina-titulo">Meu carrinho</h1>

      <div id="conteudo-carrinho">
        <div class="carregando"><div class="spinner spinner--lg"></div></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { renderHeader } from './assets/js/components/header.js';
    import { renderFooter } from './assets/js/components/footer.js';
    import { iniciarConfiguracoes } from './assets/js/services/settings.service.js';

    await iniciarConfiguracoes();
    await renderHeader('carrinho');
    await renderFooter();

    const el = document.getElementById('conteudo-carrinho');

    function ler() {
      try { return JSON.parse(localStorage.getItem('carrinho') || '[]'); } catch { return []; }
    }
    function salvar(itens) { localStorage.setItem('carrinho', JSON.stringify(itens)); }

    function render() {
      const itens = ler();

      if (!itens.length) {
        el.innerHTML = `
          <div class="estado-vazio">
            <div class="estado-vazio__titulo">Seu carrinho está vazio</div>
            <p class="estado-vazio__descricao">Adicione produtos para continuar.</p>
            <a href="./produtos.html" class="btn btn--principal">Ver produtos</a>
          </div>`;
        return;
      }

      const subtotal = itens.reduce((s, i) => s + i.preco * i.quantidade, 0);

      el.innerHTML = `
        <div class="carrinho">
          <div class="carrinho__lista">
            ${itens.map((i, idx) => `
              <div class="carrinho__item">
                ${i.imagem
                  ? `<img src="${i.imagem}" alt="" class="carrinho__item-img" />`
                  : `<div class="carrinho__item-img"></div>`}
                <div class="carrinho__item-info">
                  <a href="./produto.html?id=${i.id}" class="carrinho__item-nome">${esc(i.nome)}</a>
                  <div class="carrinho__item-preco">R$ ${Number(i.preco).toFixed(2)}</div>
                  <button class="carrinho__item-remover" data-rm="${idx}">Remover</button>
                </div>
                <div class="carrinho__item-acoes">
                  <div class="carrinho__quantidade">
                    <button class="btn btn--fantasma btn--sm" data-menos="${idx}">−</button>
                    <input type="number" min="1" value="${i.quantidade}" data-qtd="${idx}" />
                    <button class="btn btn--fantasma btn--sm" data-mais="${idx}">+</button>
                  </div>
                  <div style="margin-top:8px;text-align:right;font-weight:700;">
                    R$ ${(i.preco * i.quantidade).toFixed(2)}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <aside class="resumo">
            <h2 class="resumo__titulo">Resumo do pedido</h2>
            <div class="resumo__linha">
              <span>Subtotal</span>
              <span>R$ ${subtotal.toFixed(2)}</span>
            </div>
            <div class="resumo__total">
              <span>Total</span>
              <span>R$ ${subtotal.toFixed(2)}</span>
            </div>
            <a href="./checkout.html" class="btn btn--principal btn--bloco btn--lg mt-4">
              Finalizar pedido
            </a>
            <a href="./produtos.html" class="btn btn--fantasma btn--bloco mt-2">
              Continuar comprando
            </a>
          </aside>
        </div>
      `;

      // Eventos
      el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
        const i = ler(); i.splice(Number(b.dataset.rm), 1); salvar(i); render();
      });
      el.querySelectorAll('[data-mais]').forEach(b => b.onclick = () => {
        const i = ler(); i[Number(b.dataset.mais)].quantidade++; salvar(i); render();
      });
      el.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => {
        const i = ler(); const idx = Number(b.dataset.menos);
        if (i[idx].quantidade > 1) i[idx].quantidade--; else i.splice(idx, 1);
        salvar(i); render();
      });
      el.querySelectorAll('[data-qtd]').forEach(inp => inp.onchange = (e) => {
        const i = ler(); const idx = Number(e.target.dataset.qtd);
        const v = Math.max(1, Number(e.target.value) || 1);
        i[idx].quantidade = v; salvar(i); render();
      });
    }

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    render();
  </script>
</body>
</html>
