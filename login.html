<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Entrar — Minha Loja</title>

  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/store.css" />

  <style>
    .tela-auth {
      min-height: calc(100vh - var(--altura-header));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .cartao-auth {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid var(--cor-borda);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--sombra-md);
    }

    .cartao-auth h1 {
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }

    .cartao-auth p.sub {
      color: var(--cor-texto-suave);
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .cartao-auth__rodape {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--cor-borda);
      text-align: center;
      font-size: 14px;
      color: var(--cor-texto-suave);
    }

    .erro-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .erro-msg.visivel {
      display: block;
    }

    .ok-msg {
      background: #dcfce7;
      color: #166534;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .ok-msg.visivel {
      display: block;
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 14px;
    }

    .auth-links a {
      color: var(--cor-principal);
      text-decoration: none;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="header"></div>

  <main class="tela-auth">

    <div class="cartao-auth">

      <h1>Entrar</h1>

      <p class="sub">
        Acesse sua conta para continuar.
      </p>

      <div id="erro" class="erro-msg"></div>

      <div id="ok" class="ok-msg"></div>

      <form id="form-login" novalidate>

        <div class="campo">

          <label for="email">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            required
          />

        </div>

        <div class="campo">

          <label for="senha">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            autocomplete="current-password"
            required
          />

        </div>

        <div class="auth-links">

          <a href="./recuperar-senha.html">
            Esqueci minha senha
          </a>

        </div>

        <button
          type="submit"
          class="btn btn--principal btn--bloco btn--lg"
          id="btn-entrar"
          style="margin-top: 20px;"
        >
          Entrar
        </button>

      </form>

      <div class="cartao-auth__rodape">

        Ainda não tem conta?

        <a href="./cadastro.html">
          <strong>Criar conta</strong>
        </a>

      </div>

    </div>

  </main>

  <div id="footer"></div>


  <script type="module">

    /*
     * HEADER / FOOTER
     */
    (async () => {

      try {

        const {
          renderHeader
        } = await import(
          './assets/js/components/header.js'
        );

        const {
          renderFooter
        } = await import(
          './assets/js/components/footer.js'
        );

        await renderHeader();

        await renderFooter();

      } catch (e) {

        console.error(
          '[login] erro ao carregar layout:',
          e
        );

      }

    })();


    /*
     * LOGIN
     */
    document
      .getElementById('form-login')
      .addEventListener('submit', async function(e) {

        e.preventDefault();

        const email =
          document
            .getElementById('email')
            .value
            .trim();

        const senha =
          document
            .getElementById('senha')
            .value;

        const btn =
          document
            .getElementById('btn-entrar');

        const erro =
          document
            .getElementById('erro');

        const ok =
          document
            .getElementById('ok');


        /*
         * Limpar mensagens
         */
        erro.classList.remove('visivel');

        ok.classList.remove('visivel');


        /*
         * Validação
         */
        if (!email) {

          mostrarErro(
            'Informe seu e-mail.'
          );

          return;
        }


        if (!senha) {

          mostrarErro(
            'Informe sua senha.'
          );

          return;
        }


        /*
         * Estado do botão
         */
        btn.disabled = true;

        btn.textContent =
          'Entrando...';


        try {

          const {
            entrar
          } = await import(
            './assets/js/services/auth.service.js'
          );


          /*
           * Login pelo Supabase
           */
          await entrar({
            email,
            senha
          });


          /*
           * Login realizado
           */
          ok.textContent =
            'Login realizado com sucesso!';

          ok.classList.add(
            'visivel'
          );


          /*
           * Verificar destino informado
           *
           * Exemplo:
           * login.html?redirect=checkout.html
           */
          const params =
            new URLSearchParams(
              window.location.search
            );

          const redirect =
            params.get('redirect');


          setTimeout(() => {

            if (
              redirect &&
              !redirect.includes('login.html') &&
              !redirect.includes('cadastro.html')
            ) {

              window.location.href =
                redirect;

            } else {

              window.location.href =
                './index.html';

            }

          }, 500);


        } catch (err) {

          console.error(
            '[login] erro:',
            err
          );


          mostrarErro(
            err?.message ||
            'Não foi possível entrar na conta.'
          );


          btn.disabled = false;

          btn.textContent =
            'Entrar';

        }

      });


    /*
     * Mostrar erro
     */
    function mostrarErro(msg) {

      const erro =
        document.getElementById('erro');

      erro.textContent =
        msg;

      erro.classList.add(
        'visivel'
      );

    }

  </script>

</body>
</html>
